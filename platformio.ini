; PlatformIO project for the Wio Terminal (Seeed, ATSAMD51) port.
;
; This is separate from and additive to the desktop CMake build -- it does not
; touch it. See app/wio/README.md.
;
; The `wio` environment is the only Wio game build: the closed-world RPG2k/2003
; engine (compiled by bc2cpp, no interpreter) on the board's LCD, microSD and
; buttons. It links the wio-target libmruby.a and uni-algo that are built
; outside this file (see the environment's own comment). There is no
; interpreted Wio build.
;
; `wio_sd_upload` is a throwaway loader that copies files onto the microSD card
; over USB-CDC serial for dev machines with no card reader (scripts/wio/sd_upload.py
; drives it). See app/wio/src/sd_upload_main.cxx -- reflash `wio` afterwards.
;
; `maix_amigo` is the Sipeed Maix Amigo (Kendryte K210) P0 hello-world + LCD
; bring-up, the first slice of app/maix/README.md. The K210 PlatformIO platform
; ships no Amigo board definition, so it uses the custom boards/
; sipeed-maix-amigo.json (Maixduino Arduino core's sipeed_maix_amigo variant).
; Its entry point (app/wio/src/maix_amigo_main.cxx) lives under app/wio/src/
; only because src_dir below is project-wide -- see that file's own comment.
;
; `maix_sd_upload` is the same throwaway serial-to-SD idea as
; `wio_sd_upload` above, for the Amigo (scripts/maix/sd_upload.py drives
; it) -- reflash `maix_game` afterwards.

; The M5Stack Core port is NOT another environment in this file -- it is a
; separate, standalone PlatformIO project at app/m5stack/platformio.ini. It
; needs `framework = arduino, espidf` (plain
; `framework = arduino`'s precompiled Arduino libs fail a real SPI-flash-probe
; assert under QEMU that building from source as an ESP-IDF component does
; not), and PlatformIO's ESP-IDF/CMake build mode takes over the project
; root's own CMakeLists.txt and cannot honor build_src_filter -- both fatal
; to sharing this file's project-wide src_dir/CMakeLists.txt the way Wio and
; Maix do. See app/m5stack/README.md.

[platformio]
; pio-lock is a lib_deps entry in each env so its build hook runs; pinned by
; commit SHA, since the lock does not record pio-lock itself.
extra_configs = pio.lock.ini
src_dir = app/wio/src


[env:wio]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino

; A current Arm GNU Toolchain release instead of atmelsam@9.0.0's default
; (GCC 7.2.1).
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.140201.0

build_src_filter =
    -<*>
    +<wio_rgss_boot_main.cxx>

extra_scripts =
    pre:app/wio/exclude_lvgl_asm.py
    pre:app/wio/patch_tft_espi_fonts.py

; WIO_MRUBY_BUILD_DIR is the closed-world wio libmruby build (its lib/ and
; include/); WIO_UNIALGO_LIB_DIR is a standalone arm-none-eabi cross-build of
; 3rd/uni-algo. A default `pio run` does not produce either.
build_flags =
    -DWIO_TERMINAL
    -DLV_CONF_INCLUDE_SIMPLE
    -I app/wio
    -I include
    -I 3rd/mruby/include
    -I ${sysenv.WIO_MRUBY_BUILD_DIR}/include
    -L ${sysenv.WIO_MRUBY_BUILD_DIR}/lib
    -L ${sysenv.WIO_UNIALGO_LIB_DIR}
    -lmruby
    -luni-algo
    ; mruby-rgss/mruby-lcf use std::string/std::vector, and PlatformIO's own
    ; atmelsam/arduino builder never adds libstdc++ to the link.
    -lstdc++
    -fno-ident
    -fmerge-all-constants
    -Wno-implicit-function-declaration
    -Wl,-Map=.pio/build/wio/firmware.map
    -DRPGMAKER_WIO_TFT_NO_EXTRA_FONTS

lib_deps =
    https://github.com/m-mcgowan/pio-lock.git#18604c671854aa209e8b8e21b5473448c731c950
    symlink://3rd/lvgl
    Seeed_Arduino_LCD

; `pio run -e wio_sim -t upload` builds the `wio` firmware above and boots
; its ELF under this project's own Renode emulator instead of
; writing it to a connected board -- the same "flash it and see it run"
; gesture, with no hardware. Renode is deliberately not a repo dependency
;: build it with scripts/wio/renode_build.bash and point $RENODE_BIN
; at it (or put `renode` on PATH); app/wio/renode/README.md has the details.
;
; `upload_protocol = custom` is load-bearing: under the board's real `sam-ba`
; protocol the atmelsam platform runs its "Looking for upload port..." action
; (BeforeUpload -> AutodetectUploadPort) before the upload command and fails
; with no board attached; `custom`'s action list is the upload command alone.
; The command names `$BUILD_DIR/${PROGNAME}.elf` rather than $SOURCES because
; on this platform $SOURCES is the .bin bossac's own path uploads.
[env:wio_sim]
extends = env:wio
upload_protocol = custom
upload_command = "$PROJECT_DIR/scripts/wio/renode_boot.bash" "$BUILD_DIR/${PROGNAME}.elf"

; A throwaway loader (see the note above `[platformio]`): no LCD, just the SD
; card over serial. Same FS lib pin as `wio`.
[env:wio_sd_upload]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino

build_src_filter =
    -<*>
    +<sd_upload_main.cxx>

build_flags =
    -DWIO_TERMINAL

lib_deps =
    https://github.com/m-mcgowan/pio-lock.git#18604c671854aa209e8b8e21b5473448c731c950
    https://github.com/Seeed-Studio/Seeed_Arduino_FS.git#v2.1.5

; Maix Amigo P0 hello-world + LCD bring-up (see the note above `[platformio]`
; and app/maix/README.md). Custom board boards/sipeed-maix-amigo.json: the
; sipeed kendryte210 platform ships no Amigo definition, only BiT/Go/Dock/
; Duino/MF1, while the Maixduino Arduino core does carry the sipeed_maix_amigo
; variant this board JSON points at. Not part of a default `pio run` yet --
; P0 is proven by building this environment explicitly.
[env:maix_amigo]
lib_deps =
    https://github.com/m-mcgowan/pio-lock.git#18604c671854aa209e8b8e21b5473448c731c950
platform = kendryte210
board = sipeed-maix-amigo
framework = arduino
monitor_speed = 115200

# framework-maixduino predates the Amigo and ships no sipeed_maix_amigo
# variant dir -- see app/maix/add_amigo_variant.py.
extra_scripts = pre:app/maix/add_amigo_variant.py

build_src_filter =
    -<*>
    +<maix_amigo_main.cxx>

; The mruby-linking firmware (see the note above `[platformio]` and
; app/maix/README.md): display HAL + input + interpreter boot smoke, proving
; the link and the VM run on the chip. No game scene yet.
;
; MAIX_MRUBY_BUILD_DIR must point at that cross build's own output
; directory for the maix target (build-maix-mruby/maix, containing
; lib/libmruby.a and include/), and MAIX_UNIALGO_LIB_DIR at a standalone
; riscv64 cross-build of 3rd/uni-algo (scripts/maix/unialgo_build.bash) --
; nothing produces either from a default `pio run`, so this env is not part
; of one. CI's `maix` job builds both first (same shape as env:wio
; and its WIO_MRUBY_BUILD_DIR/WIO_UNIALGO_LIB_DIR pair).
[env:maix_rgss_boot]
platform = kendryte210
board = sipeed-maix-amigo
framework = arduino
monitor_speed = 115200

build_src_filter =
    -<*>
    +<maix_rgss_boot_main.cxx>
    +<maix_display.cxx>
    +<maix_input.cxx>
    +<maix_sd_syscalls.cxx>

# The Amigo variant include (same as env:maix_amigo above), plus LVGL's
# ARM-only SIMD assembly exclusion (same as every env linking LVGL: the
# .S files are Helium/NEON kernels the riscv assembler would choke on, and
# LV_USE_DRAW_SW_ASM is NONE in app/maix/lv_conf.h, so they are unused).
extra_scripts =
    pre:app/maix/add_amigo_variant.py
    pre:app/wio/exclude_lvgl_asm.py
    pre:app/maix/patch_wire_i2c_timeout.py
    pre:app/maix/patch_kendryte_ram_size.py

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I app/maix
    -I include
    -I 3rd/mruby/include
    -I ${sysenv.MAIX_MRUBY_BUILD_DIR}/include
    -L ${sysenv.MAIX_MRUBY_BUILD_DIR}/lib
    -L ${sysenv.MAIX_UNIALGO_LIB_DIR}
    -lmruby
    -luni-algo
    ; PlatformIO's kendryte builder never adds libstdc++ to the link the way
    ; the desktop toolchain does -- mruby-rgss's lib.cxx/lcf.cxx do use it
    ; (std::string/std::vector), so it must be requested explicitly. Same
    ; shape as env:wio's own -lstdc++.
    -lstdc++
    -Wl,-Map=.pio/build/maix_rgss_boot/firmware.map

; The repo's vendored LVGL (same source as the desktop build) rather than a
; registry copy, so the rendering code matches -- mruby-rgss's native
; methods reference lv_* throughout, so the archive cannot link without it,
; even though nothing here creates a display yet.
lib_deps =
    https://github.com/m-mcgowan/pio-lock.git#18604c671854aa209e8b8e21b5473448c731c950
    symlink://3rd/lvgl

; The game-booting firmware (see app/maix/README.md): same stack as
; maix_rgss_boot (display, input, interpreter) plus the flash-resident game
; (app/maix/embed_game.py bakes data/maix-hello in at build time, served by
; maix_embed.cxx behind GAME_DIR=/game) and a real RPG2k boot -- title
; screen, driven one main_loop per Arduino loop() iteration. Needs the same
; two cross-build outputs as maix_rgss_boot, plus nothing else new.
[env:maix_game]
platform = kendryte210
board = sipeed-maix-amigo
framework = arduino
monitor_speed = 115200

build_src_filter =
    -<*>
    +<maix_game_main.cxx>
    +<maix_display.cxx>
    +<maix_input.cxx>
    +<maix_gamepad.cxx>
    +<maix_embed.cxx>

extra_scripts =
    pre:app/maix/add_amigo_variant.py
    pre:app/wio/exclude_lvgl_asm.py
    pre:app/maix/embed_game.py
    pre:app/maix/patch_wire_i2c_timeout.py
    pre:app/maix/patch_kendryte_ram_size.py

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I app/maix
    -I include
    -I 3rd/mruby/include
    -I ${sysenv.MAIX_MRUBY_BUILD_DIR}/include
    -L ${sysenv.MAIX_MRUBY_BUILD_DIR}/lib
    -L ${sysenv.MAIX_UNIALGO_LIB_DIR}
    -lmruby
    -luni-algo
    -lstdc++
    -Wl,-Map=.pio/build/maix_game/firmware.map

lib_deps =
    https://github.com/m-mcgowan/pio-lock.git#18604c671854aa209e8b8e21b5473448c731c950
    symlink://3rd/lvgl

; Same game firmware but booting game data from the microSD card
; (/sd/maixgame, pushed with scripts/maix/sd_upload.py) instead of the
; flash-embedded copy: swaps maix_embed.cxx for the SD-backed newlib layer
; and defines MAIX_WITH_SD (which also flips GAME_DIR). Title-only for
; now -- post-title asset streaming needs full LCD/SD bus arbitration
; (see maix_tf_sd.h); reflash maix_game afterwards if you want the
; embedded copy back.
[env:maix_game_sd]
platform = kendryte210
board = sipeed-maix-amigo
framework = arduino
monitor_speed = 115200

build_src_filter =
    -<*>
    +<maix_game_main.cxx>
    +<maix_display.cxx>
    +<maix_input.cxx>
    +<maix_gamepad.cxx>
    +<maix_sd_syscalls.cxx>

extra_scripts =
    pre:app/maix/add_amigo_variant.py
    pre:app/wio/exclude_lvgl_asm.py
    pre:app/maix/patch_wire_i2c_timeout.py
    pre:app/maix/patch_kendryte_ram_size.py

build_flags =
    -DMAIX_WITH_SD
    -DLV_CONF_INCLUDE_SIMPLE
    -I app/maix
    -I include
    -I 3rd/mruby/include
    -I ${sysenv.MAIX_MRUBY_BUILD_DIR}/include
    -L ${sysenv.MAIX_MRUBY_BUILD_DIR}/lib
    -L ${sysenv.MAIX_UNIALGO_LIB_DIR}
    -lmruby
    -luni-algo
    -lstdc++
    -Wl,-Map=.pio/build/maix_game_sd/firmware.map

lib_deps =
    https://github.com/m-mcgowan/pio-lock.git#18604c671854aa209e8b8e21b5473448c731c950
    symlink://3rd/lvgl

; A throwaway loader (see the note above `[platformio]`): no LCD, just the
; SD card over serial. Same protocol as app/wio's own sd_upload firmware
; (PING/PUT, see that file) so the host side works the same; driven by
; scripts/maix/sd_upload.py. Reflash maix_game (or whatever was running)
; afterwards.
[env:maix_sd_upload]
lib_deps =
    https://github.com/m-mcgowan/pio-lock.git#18604c671854aa209e8b8e21b5473448c731c950
platform = kendryte210
board = sipeed-maix-amigo
framework = arduino
monitor_speed = 115200

build_src_filter =
    -<*>
    +<maix_sd_upload_main.cxx>

# framework-maixduino predates the Amigo and ships no sipeed_maix_amigo
# variant dir -- see app/maix/add_amigo_variant.py.
extra_scripts = pre:app/maix/add_amigo_variant.py
