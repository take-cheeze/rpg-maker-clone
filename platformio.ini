; PlatformIO project for the Wio Terminal (Seeed, ATSAMD51) port.
;
; This is separate from and additive to the desktop CMake build -- it does not
; touch it. See app/wio/README.md and docs/adr/0007-wio-terminal-port.md.
;
; The `wio` environment builds the P1 hardware bring-up firmware: the LVGL
; display + input HAL (mruby-rgss/src/wio.cxx, pulled in via the wio_hal.cxx
; shim) driving the board's LCD and buttons, with the Arduino sketch in
; app/wio/src/main.cxx. The mruby interpreter and SD-backed asset loading are
; layered on in later slices.
;
; The `wio_walk` environment is a different thing entirely: the minimal,
; non-mruby map-walking engine of docs/adr/0061 (shared with the iPod nano 7G
; homebrew app, see docs/adr/0091), reading a host-exported map off the SD
; card. It links neither LVGL nor mruby -- see app/wio/src/walk_main.cxx.
;
; `wio_sd_upload` is neither of those: a throwaway loader that copies files
; onto the microSD card over USB-CDC serial for dev machines with no card
; reader (scripts/wio_sd_upload.py drives it). See
; app/wio/src/sd_upload_main.cxx -- reflash `wio_walk` or `wio` afterwards.

[platformio]
src_dir = app/wio/src

[env:wio]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino

; docs/adr/0133: atmelsam@9.0.0's own manifest still pins toolchain-
; gccarmnoneeabi ~1.70201.0 (GCC 7.2.1, 2017) -- override it with a current
; Arm GNU Toolchain release. This was originally motivated by -flto (GCC
; 7.2.1 broke it outright, a real link failure); -flto itself was later
; reverted for an unrelated, more serious reason (docs/adr/0135), but 14.2.1
; is kept -- confirmed independently, by itself, to boot correctly under
; Renode, and real bytes still come from -fmerge-all-constants alone plus
; whatever this newer compiler's own -Os heuristics improved on over seven
; years.
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.140201.0

; Build the sketch and the HAL shim, but not the SD syscall scaffold -- that
; belongs to the later mruby/asset slice and is gated behind WIO_WITH_SD --
; and not the map-walk firmware, the mruby-bytecode-from-SD smoke test, or
; the real mruby+RGSS+LVGL boot test, each its own environment below (the
; latter two need WIO_MRUBY_CORE_DIR/WIO_MRUBY_BUILD_DIR neither of which
; this environment's lib_deps/build_flags provide, so leaving either in
; +<*> here is a build failure -- confirmed for real, not just reasoned
; about: CI's own `wio` job failed outright on wio_rgss_boot_main.cxx's
; #include <mruby.h> the first time that file existed, since nothing added
; it to this exclusion list -- not just dead code).
build_src_filter =
    +<*>
    -<sd_syscalls.cxx>
    -<walk_main.cxx>
    -<walk_core.c>
    -<sd_upload_main.cxx>
    -<mruby_sd_smoke_main.cxx>
    -<wio_rgss_boot_main.cxx>

; LVGL ships Helium/NEON SIMD blend kernels as .S files that PlatformIO's LDF
; would try to assemble; the Cortex-M4 has neither, and LV_USE_DRAW_SW_ASM is
; NONE, so drop them before the build (see the script for details).
extra_scripts = pre:app/wio/exclude_lvgl_asm.py

; docs/adr/0135: -flto was tried (docs/adr/0133) and reverted -- a real
; regression, not a size/speed tradeoff. It strips the ARM vector table
; (.isr_vector) from the linked binary outright, confirmed by booting the
; real linked ELF under this project's own Renode emulator (docs/adr/0094):
; every -flto build aborts on a wild jump moments after reset, isolated to
; -flto specifically (GCC 14.2.1 and -fmerge-all-constants each boot fine on
; their own). Not a Renode-only artifact -- a real SAMD51 reads the same
; fixed vector-table address at boot, so this would very likely have kept
; real hardware from booting at all despite linking cleanly and reporting a
; correctly-sized image. -fno-ident drops the per-object GCC version comment
; (free, a handful of bytes per file). -fmerge-all-constants merges
; duplicate constants across translation units more aggressively than the
; default -fmerge-constants -- real bytes, and GCC's own docs flag it as
; technically not standards-strict for constants whose identity could
; matter, which this project's own code never relies on. Both verified
; independently under Renode to boot correctly.
build_flags =
    -DWIO_TERMINAL
    -DLV_CONF_INCLUDE_SIMPLE
    -I app/wio
    -I include
    -fno-ident
    -fmerge-all-constants
    -Wno-implicit-function-declaration

; Use the repo's vendored LVGL (same source as the desktop build) rather than a
; registry copy, so the rendering code matches. The board's LCD driver comes
; from the Seeed package.
lib_deps =
    symlink://3rd/lvgl
    Seeed_Arduino_LCD

; The map-walk firmware (docs/adr/0091): the shared C engine of the iPod nano
; 7G port on this board's LCD, SD card and 5-way switch. Two source files and
; no LVGL, so it shares nothing with the `wio` environment above except the
; board -- the sketch is the platform half, walk_core.c pulls in the engine
; the nano app runs.
[env:wio_walk]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino

build_src_filter =
    -<*>
    +<walk_main.cxx>
    +<walk_core.c>

build_flags =
    -DWIO_TERMINAL

; The LCD driver the `wio` env already uses, plus Seeed's FatFs wrapper for
; the microSD slot. The latter by Git URL at a pinned tag rather than by
; name: it is published as "Seeed Arduino FS", so the underscored spelling
; that works for the LCD library resolves to nothing and the build fails on a
; missing Seeed_FS.h. (Its SFUD sibling is not needed -- nothing in the
; library's sources references it -- and its SDMMC driver self-guards on
; WIO_LITE_AI, so only the SD half compiles here.)
lib_deps =
    Seeed_Arduino_LCD
    https://github.com/Seeed-Studio/Seeed_Arduino_FS.git#v2.1.5

; A throwaway loader (see the note above `[platformio]`): no LCD, just the SD
; card over serial. Same FS lib pin as `wio_walk`.
[env:wio_sd_upload]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino

build_src_filter =
    -<*>
    +<sd_upload_main.cxx>

build_flags =
    -DWIO_TERMINAL

lib_deps =
    https://github.com/Seeed-Studio/Seeed_Arduino_FS.git#v2.1.5

; ADR 0103's own follow-up: the real mruby+RGSS+LVGL boot, not the bare-core
; smoke test below. Links the actual wio-target libmruby.a (ADR 0103 first
; got building, MRUBY_TARGET=wio rake) -- which now carries mruby-rgss's own
; wio.cxx HAL, so this environment must NOT also build wio_hal.cxx the way
; `wio` above does, or wio_display_create/wio_input_init/wio_input_scan are
; defined twice. WIO_MRUBY_BUILD_DIR must point at that build's own output
; directory (.../wio, containing lib/libmruby.a and include/), and
; WIO_UNIALGO_LIB_DIR at a standalone arm-none-eabi cross-build of 3rd/
; uni-algo (mruby-rgss/mruby-lcf's own real dependency, not something
; PlatformIO's own LDF can build -- unlike LVGL, it ships no library.json).
; Neither is produced by anything in this repo's own build today, so this is
; not wired into a default `pio run` or into CI, the same as
; wio_mruby_sd_smoke below.
;
; That libmruby.a must specifically be a build with RGSS_WIO_ARDUINO_INCLUDES
; set (build_config.rb's own comment on it has the exact reasoning): plain
; `MRUBY_TARGET=wio rake` with no such build_config.rb escape hatch set links
; wio.cxx's HAL against nothing at all, so it compiles, but the ADR 0103
; measurement-only RGSS_WIO_STUB_HEADERS path is silently ABI-incompatible
; with a real link here (a declarations-only TFT_eSPI stub gives the global
; `TFT_eSPI g_tft` the wrong object layout, and mismatched pinMode/
; digitalRead/delay/millis signatures without extern "C" linkage). Only
; RGSS_WIO_ARDUINO_INCLUDES (real PlatformIO framework headers) produces a
; libmruby.a this environment can actually link successfully against.
[env:wio_rgss_boot]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino

; See env:wio's own comment on this: a current Arm GNU Toolchain release
; instead of atmelsam@9.0.0's default (GCC 7.2.1). docs/adr/0133/0135.
platform_packages =
    platformio/toolchain-gccarmnoneeabi@1.140201.0

build_src_filter =
    -<*>
    +<wio_rgss_boot_main.cxx>

extra_scripts = pre:app/wio/exclude_lvgl_asm.py

; See env:wio's own comment on -fno-ident/-fmerge-all-constants, and on why
; -flto is gone (docs/adr/0135).
build_flags =
    -DWIO_TERMINAL
    -DLV_CONF_INCLUDE_SIMPLE
    -I app/wio
    -I include
    -I 3rd/mruby/include
    -I ${sysenv.WIO_MRUBY_BUILD_DIR}/include
    -L ${sysenv.WIO_MRUBY_BUILD_DIR}/lib
    -L ${sysenv.WIO_UNIALGO_LIB_DIR}
    -lmruby
    -luni-algo
    ; PlatformIO's own atmelsam/arduino builder never adds libstdc++ to the
    ; link (the framework itself builds with -fno-exceptions -fno-rtti and
    ; avoids the C++ runtime entirely) -- mruby-rgss's lib.cxx/lcf.cxx do use
    ; it (std::string/std::vector, including their internal
    ; std::__throw_bad_array_new_length overflow guard), so it must be
    ; requested explicitly.
    -lstdc++
    -fno-ident
    -fmerge-all-constants
    -Wno-implicit-function-declaration
    -Wl,-Map=.pio/build/wio_rgss_boot/firmware.map

lib_deps =
    symlink://3rd/lvgl
    Seeed_Arduino_LCD

; docs/adr/0135: diagnostic-only, not a real hardware config, and not wired
; into a default `pio run` or into CI (same as wio_mruby_sd_smoke below).
; Widens FLASH far past the real 507904-byte board budget (see
; app/wio/renode/oversized_flash_debug.ld's own comment) purely so the
; *current*, real-overflow wio_rgss_boot build can still link and boot
; under Renode (with app/wio/renode/wio_terminal_oversized_flash.repl's
; matching widened flash0) for live mruby-heap inspection via GDB, plus -g
; for the DWARF type info GDB needs to walk mrb_state's structures by name.
; This exact setup is what found both real bugs ADR 135 documents. Inherits
; env:wio_rgss_boot's own -Wl,-Map=.pio/build/wio_rgss_boot/firmware.map --
; run `mkdir -p .pio/build/wio_rgss_boot` first if that directory does not
; already exist (e.g. from a prior `pio run -e wio_rgss_boot`), or the link
; fails on a missing map-file directory before anything this env is for
; ever gets exercised.
[env:wio_rgss_boot_heapdbg]
extends = env:wio_rgss_boot
board_build.ldscript = app/wio/renode/oversized_flash_debug.ld
build_flags =
    ${env:wio_rgss_boot.build_flags}
    -g

; Scratch verification for ADR 0099 (load mrblib bytecode from a file
; instead of embedding it): reads a plain RITE binary off the SD card and
; loads it with mrb_load_irep_buf. Passed for real under Renode
; (scripts/wio_renode_build.bash + wio_renode_sdcard.bash) -- see the ADR's
; "On real (emulated) hardware" section for the two real bugs that took to
; get there (an mrb_int size mismatch, a real memory ceiling on the full
; schema). WIO_MRUBY_CORE_DIR must point at a bare mruby core (mruby-bigint
; only) cross-built for wio, providing lib/libmruby_core_merged.a (the real
; mrblib.o merged in -- a bare object path here gets misparsed by SCons as
; a `-l` argument) and include/; nothing in this repo's own build produces
; that today, so this is not wired into a default `pio run` or into CI.
[env:wio_mruby_sd_smoke]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino

build_src_filter =
    -<*>
    +<mruby_sd_smoke_main.cxx>

; mrblib.o (mruby's own Ruby-level bootstrap) is merged into
; libmruby_core_merged.a ahead of time -- a bare object path in build_flags
; gets misparsed by SCons's flag merging as a `-l` argument ("cannot find
; -l/path/to/mrblib.o") rather than linked directly, so -l alone is what
; actually works.
build_flags =
    -I 3rd/mruby/include
    -I ${sysenv.WIO_MRUBY_CORE_DIR}/include
    -L ${sysenv.WIO_MRUBY_CORE_DIR}/lib
    -lmruby_core_merged

lib_deps =
    https://github.com/Seeed-Studio/Seeed_Arduino_FS.git#v2.1.5
