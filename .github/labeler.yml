# Path-based labels for pull requests, applied by actions/labeler
# (.github/workflows/labeler.yml). Every label used here must exist in
# .github/labels.yml — scripts/label_config_check.rb enforces that.
#
# The rules only cover paths whose engine / platform / component is
# unambiguous. The big mixed files (mruby-rpg2k/mrblib/game.rb holds the
# chipset, the message window, the battle and the weather) deliberately get no
# component label: the labeler never removes labels (`sync-labels: false`), so
# whatever a human adds by hand stays put.
#
# Note: this config is read from `master`, because the workflow runs on
# `pull_request_target` so that pull requests from forks can be labelled. A
# change to the rules below therefore only takes effect once it is merged.

# --- engine ----------------------------------------------------------------

"engine:rpg2k":
  - changed-files:
      - any-glob-to-any-file:
          - "mruby-rpg2k/**"
          - "mruby-lcf/**"
          - "scripts/rpg2k*/**"
          - "scripts/lcf/**"
          - "scripts/gen/rpg2k-save.rb"
          - "scripts/gen/lcf-save-wine.bash"
          - "scripts/*nepheshel*"
          - "scripts/compare/nepheshel-save-wine.bash"
          - "scripts/compare/nepheshel-wine.bash"
          - "scripts/download/nepheshel.bash"
          - "scripts/run/nepheshel-easyrpg-wine.bash"
          - "scripts/download/prayforyou.bash"
          - "scripts/download/killer-knights.bash"
          - "scripts/rtp/install.bash"
          - "scripts/analyze_game.rb"
          - "docs/rpg2000-sample-analysis.md"

"engine:rpg2k3":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*rpg2k3*"
          - "**/*rpg2003*"

"engine:xp":
  - changed-files:
      - any-glob-to-any-file:
          - "mruby-rpgxp/**"
          - "scripts/rpgxp/**"
          - "scripts/compare/rpgxp-wine.bash"
          - "scripts/download/opengame-xp.bash"
          - "scripts/rtp/xp_install.bash"
          - "scripts/rgssad/asset_check.bash"
          - "docs/rpgxp-rgss-api-gap.md"

# VX and VX Ace share one data layer (mruby-rpgvx serves RGSS2 and RGSS3, see
# ADR 0024), so a change there lands on both editions.
"engine:vx":
  - changed-files:
      - any-glob-to-any-file:
          - "mruby-rpgvx/**"
          - "scripts/rpgvx/**"
          - "docs/rpgvx-rgss-api-gap.md"

"engine:vxace":
  - changed-files:
      - any-glob-to-any-file:
          - "mruby-rpgvx/**"
          - "scripts/rpgvx/**"
          - "docs/rpgvx-rgss-api-gap.md"
          - "**/*vxace*"
          - "**/*rgss3*"

"engine:mv":
  - changed-files:
      - any-glob-to-any-file:
          - "mruby-mvjs/mrblib/mv.rb"
          - "mruby-mvjs/test/mv_test.rb"
          - "data/mv-sample/**"
          - "scripts/*mv*"
          - "scripts/download/mv-corescript.bash"
          - "scripts/gen/mv-sample.py"
          - "scripts/mv/testbed_check.rb"

"engine:mz":
  - changed-files:
      - any-glob-to-any-file:
          - "mruby-mvjs/mrblib/mz.rb"
          - "mruby-mvjs/test/mz_test.rb"
          - "data/mz-sample/**"
          - "scripts/*mz*"
          - "scripts/download/mz-corescript.bash"
          - "scripts/gen/mz-encrypted.py"
          - "scripts/gen/mz-sample.py"
          - "scripts/mz/boot_check.bash"
          - "scripts/mz/encrypted_check.bash"
          - "scripts/mz/frame_check.rb"
          - "scripts/mz/testbed_check.rb"

"engine:wolf":
  - changed-files:
      - any-glob-to-any-file:
          - "mruby-wolf/**"
          - "scripts/*wolf*"
          - "scripts/download/wolfrpg-sample.bash"
          - "scripts/wolf/data_wolf_check.rb"
          - "scripts/wolf/interpreter_check.rb"
          - "scripts/wolf/testbed_check.rb"
          - "docs/adr/0064-wolf-rpg-editor-data-layer.md"

# --- platform --------------------------------------------------------------
# platform:linux has no rules: the SDL sources it would match are the shared
# desktop path, so it is added by hand when a problem is Linux specific.

"platform:wasm":
  - changed-files:
      - any-glob-to-any-file:
          - "src/shell.html"
          - "src/wasm_keypad.cxx"
          - "scripts/cors-proxy/**"
          - "cmake/emscripten-probe-cache.cmake"
          - "scripts/*emscripten*"
          - "scripts/gen/emscripten_probe_cache.rb"
          - "scripts/serve.py"
          - "docs/deploy.md"
          - "docs/cors-proxy.md"

"platform:terminal":
  - changed-files:
      - any-glob-to-any-file:
          - "mruby-rgss/src/sixel.cxx"
          - "mruby-rgss/src/terminal.cxx"
          - "mruby-rgss/src/iterm.cxx"
          - "include/sixel.hxx"
          - "include/terminal.hxx"
          - "include/iterm.hxx"
          - "include/log_console.hxx"
          - "src/log_console.cxx"

"platform:windows":
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/setup.iss"
          - "scripts/*wine*"
          - "scripts/compare/nepheshel-save-wine.bash"
          - "scripts/compare/nepheshel-wine.bash"
          - "scripts/compare/rpgxp-wine.bash"
          - "scripts/gen/lcf-save-wine.bash"
          - "scripts/run/nepheshel-easyrpg-wine.bash"
          - "scripts/run/rpg2k-rpgrt-wine.bash"
          - "scripts/run/rpg2k-wine.bash"

"platform:psp":
  - changed-files:
      - any-glob-to-any-file:
          - "app/psp/**"
          - "mruby-rgss/src/psp*.cxx"
          - "include/psp.hxx"

"platform:android":
  - changed-files:
      - any-glob-to-any-file:
          - "app/android/**"
          - "src/android*.cxx"
          - "docs/adr/0058-android-port.md"

"platform:wio":
  - changed-files:
      - any-glob-to-any-file:
          - "app/wio/**"
          - "mruby-rgss/src/wio*.cxx"
          - "include/wio.hxx"
          - "include/lv_conf.h"
          - "platformio.ini"
          # The minimal walk engine the wio_walk firmware runs is shared with
          # the iPod nano 7G app (docs/adr/0091), so a change to it is a
          # change to this platform too.
          - "app/shared/rpg2k_walk/**"

"platform:maix":
  - changed-files:
      - any-glob-to-any-file:
          - "app/maix/**"
          - "boards/sipeed-maix-amigo.json"
          # platformio.ini is shared with the Wio Terminal environments (one
          # project-wide src_dir), so the labeler also tags platform:wio on
          # mixed diffs -- both labels on such a PR is correct.

"platform:m5stack":
  - changed-files:
      - any-glob-to-any-file:
          # A standalone PlatformIO project (its own platformio.ini under
          # app/m5stack/, not another environment in the repo root's --
          # see that file's own comment) -- unlike Wio/Maix, none of its
          # own files live outside app/m5stack/, so this rule needs no
          # cross-tagging onto platform:wio the way platform:maix's own
          # comment describes for itself.
          - "app/m5stack/**"
          - "mruby-rgss/src/m5stack.cxx"
          - "include/m5stack.hxx"
          - "scripts/m5stack/qemu_*.bash"

