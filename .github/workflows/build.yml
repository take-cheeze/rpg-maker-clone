# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Lets a maintainer publish a Cloudflare Pages preview on demand by
  # commenting `/preview` on a pull request. Only the `preview-gate`,
  # `wasm` and `preview-cloudflare` jobs take part in this flow; every other
  # job opts out with `github.event_name != 'issue_comment'`.
  issue_comment:
    types: [ created ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Path-based gate for the `psp`/`psp-smoke`/`psp-smoke-game` pipeline below:
  # those three jobs (a pspdev container cross-build plus two PPSSPP headless
  # smokes) are among the slowest in this workflow, and touch nothing but
  # app/psp, so a change with no bearing on the PSP port no longer pays for
  # them. `workflow_dispatch` bypasses this filter entirely -- see those
  # jobs' own `if:` -- so a manual run always builds everything.
  changes:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04
    outputs:
      psp: ${{ steps.filter.outputs.psp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            psp:
              - 'app/psp/**'
              - '.github/workflows/build.yml'

  # This workflow contains a single job called "build"
  build:
    # `/preview` comments only ever want the wasm page; skip the rest of CI.
    if: ${{ github.event_name != 'issue_comment' }}
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04

    env:
      SCCACHE_GHA_ENABLED: "true"
      ACTIONS_CACHE_SERVICE_V2: "on"
      # sccache's GHA backend stores one cache blob per compilation unit, so
      # every run that's allowed to write can mint a large number of small
      # cache entries -- on a repo this commit-heavy, doing that on every PR
      # and manual run (not just the pushes that actually update master)
      # multiplies fast. Only a push to master grows the shared cache;
      # every other trigger (pull_request, workflow_dispatch off master)
      # still reads whatever master already wrote (so a warm sccache is
      # still faster) but can't write new blobs of its own.
      SCCACHE_GHA_RW_MODE: >-
        ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master')
            && 'READ_WRITE' || 'READ_ONLY' }}
      # Optional: routes the game-archive/asset downloads below through the
      # CORS proxy's R2 cache (scripts/cors-proxy/, docs/cors-proxy.md) instead of the
      # origin host, as a fallback for when the "cache test game" step below
      # misses. Unset in forks and by default — scripts/cors-proxy-url.bash
      # passes URLs through unchanged when this is empty. May carry a
      # ?key=...&url= prefix (see AUTH_KEY in docs/cors-proxy.md), so it's a
      # secret rather than a repository variable.
      CORS_PROXY_URL: ${{ secrets.CORS_PROXY_URL }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: nixbuild/nix-quick-install-action@v35

      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
        # Network-bound (talks to the GitHub Actions cache service): bound it
        # so a stalled cache backend can't silently eat the job's whole budget
        # instead of surfacing as a clear timeout.
        timeout-minutes: 15
        background: true
      - name: cache rtp
        uses: actions/cache@v6
        id: rtp-cache
        with:
          path: scripts/*.zip
          key: rtp-${{ hashFiles('./scripts/rtp*_install.bash') }}
          restore-keys: rtp-
        # Network-bound cache restore; see "Restore and cache Nix store" above.
        timeout-minutes: 10
        background: true
      - name: cache wine prefix
        uses: actions/cache@v6
        id: wine-prefix-cache
        with:
          # rtp_install.bash / rtp_xp_install.bash default WINEPREFIX to
          # $HOME/.wine and skip the wine RTP installer entirely once they
          # find it already populated here, so a cache hit turns "Download
          # RTP" into a couple of `ls` calls instead of two wine installs.
          path: ~/.wine
          key: wine-prefix-${{ hashFiles('./scripts/rtp*_install.bash') }}
          restore-keys: wine-prefix-
        # Network-bound cache restore; see "Restore and cache Nix store" above.
        timeout-minutes: 10
        background: true
      - name: cache test game
        uses: actions/cache@v6
        id: cache
        with:
          path: data
          key: game-${{ hashFiles('./scripts/download-*.bash', './scripts/gen-mv-sample.py', './scripts/gen-sample-font.py', './data/mv-sample/data/**', './data/mv-sample/img/**', './data/mv-sample/audio/**', './data/mv-sample/fonts/**', './data/mv-sample/js/main.js', './data/mv-sample/js/plugins.js', './data/mv-sample/index.html', './scripts/gen-mz-sample.py', './data/mz-sample/data/**', './data/mz-sample/img/**', './data/mz-sample/audio/**', './data/mz-sample/fonts/**', './data/mz-sample/js/plugins.js', './data/mz-sample/index.html') }}
        # Network-bound cache restore; see "Restore and cache Nix store" above.
        timeout-minutes: 10
        background: true

      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # Submodules are initialized by the step below instead of here (see
          # its comment), so this job skips 3rd/SDL, 3rd/SDL_mixer and
          # 3rd/optcarrot.
          submodules: false
          # Keep the checkout quiet. `show-progress` is what adds `--progress`
          # to the fetch, which prints a "Receiving objects: NN%" line per
          # update — a screenful of log before anything is built. Dropping the
          # persisted credentials removes the other half: the post-job step
          # otherwise walks all 14 submodules unsetting the `includeIf` config
          # it added, ~10 `[command]git config ...` lines each. Nothing runs an
          # authenticated git command after checkout (the download scripts
          # clone public repositories), so both are pure noise. Same two
          # settings on every checkout below.
          show-progress: false
          persist-credentials: false

      # find_package(SDL2 REQUIRED) resolves the nix devshell's system SDL2 on
      # this target (CMakeLists.txt), so the vendored 3rd/SDL and
      # 3rd/SDL_mixer submodules build nothing here -- only the Android job
      # links the vendored copies (it has no system SDL2 package to find).
      # 3rd/optcarrot is unreferenced by CMakeLists.txt entirely; only the
      # `bc2cpp-checks` jobs' Optcarrot benchmark reads it. See
      # scripts/checkout-submodules.bash.
      - name: Init submodules
        env:
          SKIP_SUBMODULES: 3rd/SDL 3rd/SDL_mixer 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      # No `Skip the quickjs test262 submodule` step here any more: it existed
      # only to keep nix's nested-`.gitmodules` walk off tc39/test262, and this
      # job no longer triggers that walk — `nix develop` stopped fetching
      # submodules when flake.nix dropped `self.submodules = true`. The `flake`
      # job, the one that still asks for them, keeps the step.

      # Realises the dev shell and exports its environment (PATH, compiler
      # launchers, etc.) into $GITHUB_ENV / $GITHUB_PATH, so every later step
      # below runs its command directly instead of going through
      # `nix develop -c`.
      - name: wait nix setup
        wait-all:
      - run: ./scripts/nix-develop-export-env.bash

      # The native compile is the long pole. Everything that does not feed the
      # compiler — the RTP/game/MV downloads (network-bound) and pre-commit
      # (lint) — is launched as a `background: true` step so it overlaps the
      # build instead of running strictly before/after it. Each download script
      # is idempotent (it skips work already present, e.g. on a cache hit), so
      # the steps run unconditionally and no-op when their data is in place;
      # that keeps them safe to `wait` on below (a skipped `if:` step is avoided
      # so the wait always has a real step to join). Every write lands on a
      # git-ignored path (build/, data/*, scripts/*.zip, the fetched MV engine
      # files), so nothing here can race pre-commit's tracked-file `git diff`.
      #
      # None of these steps invoke `nix` any more (the dev-shell export above
      # already put everything they need on $PATH), so they are plain
      # commands and can run concurrently with no store-lock contention to
      # worry about.
      - name: Download RTP
        id: dl-rtp
        background: true
        # VX Ace's RTP alone is ~186 MiB (its BGM ships as .ogg, not .mid),
        # against ~15-40 MiB for each of the other four; widened from 10
        # minutes to give five sequential downloads + wine installs room.
        timeout-minutes: 20
        run: |
          ./scripts/rtp_install.bash
          ./scripts/rtp_2003_install.bash
          ./scripts/rtp_xp_install.bash
          ./scripts/rtp_vx_install.bash
          ./scripts/rtp_vxace_install.bash

      - name: Download game
        id: dl-game
        background: true
        timeout-minutes: 15
        run: |
          ./scripts/download-nepheshel.bash
          ./scripts/download-mtf-meido-action.bash
          ./scripts/download-opengame-xp.bash
          ./scripts/download-prayforyou.bash
          ./scripts/download-yumenikki.bash
          ./scripts/download-killer-knights.bash
          ./scripts/download-histoire.bash

      - name: Download MV test game
        id: dl-mv
        background: true
        timeout-minutes: 10
        run: ./scripts/download-lunatic-core.bash

      - name: Build MV sample engine
        id: dl-mv-sample
        background: true
        timeout-minutes: 10
        run: ./scripts/download-mv-corescript.bash

      - name: Fetch MZ corescript
        id: dl-mz-sample
        background: true
        timeout-minutes: 10
        run: ./scripts/download-mz-corescript.bash

      # MIDI instrument patches for SDL_mixer's TiMidity synth. Not committed
      # (~32 MiB of samples), so fetch them here or the `timidity_patches` check
      # skips and any .mid the smoke tests touch plays silence.
      - name: Download MIDI patches
        id: dl-freepats
        background: true
        timeout-minutes: 10
        run: ./scripts/download-freepats.bash

      # The fallback UI font for projects that ship none. Not committed
      # (~1.7 MiB), so fetch it here or the `default_font` check skips and the
      # XP/VX/MV smoke tests draw their windows with the 12px bitmap font.
      - name: Download default font
        id: dl-default-font
        background: true
        timeout-minutes: 5
        run: ./scripts/download-default-font.bash

      - name: pre-commit
        id: pre-commit
        background: true
        env:
          SKIP: nixfmt
        run: |
          pre-commit run -a || (
            git diff --exit-code ;
            false
          )

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      # Runs while the background steps above are still in flight.
      # -DENABLE_TIME_REPORT=ON (CMakeLists.txt) is this job's own opt-in --
      # local/dev builds don't pay for it -- turning on GCC's
      # -ftime-report-details for every compile below, so the build log the
      # next step captures carries a per-file compiler-phase timing block the
      # "compile-time report" step further down turns into a bottleneck-hint
      # summary.
      - name: cmake
        run: |
          cmake -S . -B build -GNinja -DENABLE_TIME_REPORT=ON

      - name: build
        run: |
          cmake --build build 2>&1 | tee build.log

      - name: sccache stats
        if: always()
        run: |
          {
            echo "## sccache stats"
            echo ""
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Reads the -ftime-report-details blocks the build step's log just
      # captured (empty/absent on a fully-cached run, which is fine -- see
      # the script's own comment) and appends a "slowest files/phases this
      # run" table to the job summary, right alongside the sccache stats
      # above. if: always() so a failed build still surfaces where its time
      # actually went before it died.
      - name: compile-time report
        if: always()
        run: ruby scripts/compile_time_report.rb build.log

      # Barrier: block until lint and every download have finished before the
      # checks that consume them. A failed background step (e.g. pre-commit)
      # surfaces here and fails the job, exactly as it did when these ran inline.
      - name: Wait for lint and downloads
        wait:
          [pre-commit, dl-rtp, dl-game, dl-mv, dl-mv-sample, dl-mz-sample,
           dl-freepats, dl-default-font]

      - name: Prepare screenshot dir
        run: mkdir -p ss

      # Every post-build check here is independent and each is a separate,
      # mostly IO-/timeout-bound process that reads the (now built) binary and
      # the downloaded data read-only, so they run concurrently in one
      # `parallel` group (implicit wait at the end). The Ruby-only checks that
      # used to sit in this group (LCF, the RPG XP data/script-host checks,
      # RPG2k's event soak/logic/testbed-logic checks) never touched the
      # binary at all, so they moved to the `ruby-checks` job below, which
      # skips `cmake`/`build` entirely and does not have to wait on it. The MV
      # smoke tests stay non-blocking (continue-on-error) while the MV runtime
      # is brought up; the required checks that remain here (the RPG2k/RPG XP
      # real-game boot smokes, the RGSSAD packed-asset smoke and ctest) fail
      # the group — and the job — if they fail. Each xvfb-run instance gets a
      # fixed, distinct display number
      # (--server-num) and a distinct screenshot path, so the concurrent runs
      # never collide. `xvfb-run -a` (auto-picked display) is deliberately
      # avoided: its server-number probe is not atomic, so concurrent -a runs
      # can grab the same display, killing one Xvfb out from under its client
      # ("XIO: fatal IO error"). Reserved numbers: exe_open=99,
      # render_probe=98, audio_probe=97 and error_dump=96 (see those ctest
      # tests in CMakeLists.txt, all run by the `test` step below); MV runs=100..108,
      # the RPG2k
      # real-game boot smoke=109..110, the MZ boot smoke=111, the RPG XP
      # real-game boot smoke=112..119 (one per pass -- script host/battle/save
      # on the editor bed plus script host on Pray for You, each its own step
      # and its own display so they run concurrently rather than the four of
      # them serially in one step; 116..119 stays free for another pass to be
      # added without renumbering anything else), the RGSSAD packed-asset
      # smoke=120..121 (two runs, one per arm of its A/B) and the RPG2k
      # per-frame allocation regression check=122 below. Every
      # smoke here must use a distinct --server-num (never `-a`), or its
      # non-atomic probe can steal exe_open's display and fail that required
      # check.
      #
      # The inline smokes run through `scripts/quiet_alsa.bash`, which drops the
      # "cannot find card '0'" wall a runner without a sound device produces on
      # every engine start (the same three patterns the boot-check scripts
      # already strip) while preserving the engine's exit status and its
      # `[MV-*]` markers.
      #
      # This step group runs its members with a worker-count cap rather than
      # true unlimited concurrency (observed ceiling: about a dozen in flight
      # at once), so a step queues behind whatever is already running when its
      # turn in this list comes up -- list position costs wall clock, not just
      # instruction order. The MZ play-out modes (battle_play, encounter,
      # equip, menu_play, message_play -- the ones below with a raised
      # DEFAULT_TIMEOUT_MS in mz_boot_check.bash, because they drive a whole
      # scene rather than only booting into it) are the longest-running steps
      # in the group by a wide margin, so they are listed first: queued behind
      # a dozen short checks, the slowest of them was the last thing still
      # running, stretching the group's total time by however long it sat
      # waiting for a slot it could have had immediately. Listed first, it
      # claims a slot as soon as the barrier above opens and finishes
      # overlapped with everything else instead of after it.
      - parallel:
          - name: MZ battle smoke test
            continue-on-error: true
            env:
              MZ_MODE: battle
            run: ./scripts/mz_boot_check.bash 111

          # Reaching Scene_Battle is a much smaller claim than combat working,
          # and the gap between them is where MZ's battles were found frozen:
          # the bed's enemy had an empty `battlerName`, so `Sprite_Enemy` never
          # loaded a bitmap and `updateFrame` threw on every frame of every
          # battle, taking out the rest of Scene_Battle.update. The smoke above
          # stayed green throughout, because the scene is entered before the
          # first broken update. This mode plays the fight out — confirm is
          # tapped through the party/actor/target windows until an enemy takes
          # damage and the victory sequence hands back to the map — and asserts
          # `damaged=true ended=true`. See ADR 0004 M6.3i. The timeout is left
          # to the script's per-mode default (this fight needs the most room of
          # any mode, and an override here is what would silently cut it short
          # on a slow runner); the run ends as soon as the probe reports, so the
          # ceiling costs nothing when the fight is quick.
          - name: MZ battle-play smoke test
            continue-on-error: true
            env:
              MZ_MODE: battle_play
            run: ./scripts/mz_boot_check.bash 111

          # Common events, which had no coverage at all: the bed's
          # CommonEvents.json was empty, and the two kinds are separate
          # machinery. A parallel common event runs on an interpreter
          # Game_CommonEvent owns and Game_Map.updateEvents drives, and only
          # while its switch is on; Call Common Event instead builds a child
          # interpreter nested inside the calling one. The bed authors one of
          # each and this step drives both, asserting each ran on its own.
          # See ADR 0004 M6.3m.
          # A random encounter: the engine deciding to fight, rather than a
          # game telling it to. Every other battle here is started by a Battle
          # Processing command; this one comes out of the map's own encounter
          # list after the player takes a step, through
          # Game_Player.updateEncounterCount and executeEncounter with no event
          # involved. The bed's maps carried no encounter list at all, so the
          # path had never run. It walks on the *second* map — map 1 has to stay
          # encounter-free because the move probe walks there — which makes this
          # the first step that drives two systems in one run. See ADR 0004
          # M6.3n.
          - name: MZ encounter smoke test
            continue-on-error: true
            env:
              MZ_MODE: encounter
            run: ./scripts/mz_boot_check.bash 111

          - name: MZ common event smoke test
            continue-on-error: true
            env:
              MZ_MODE: common
            run: ./scripts/mz_boot_check.bash 111

          # Scene_Equip, the last major scene nothing else here enters, and the
          # one place a parameter is meant to change because of what an actor
          # holds. The bed declared everything around equipment — five
          # equipTypes, a weapon type, an armor type — while Weapons.json and
          # Armors.json stayed empty, so no slot ever had anything to hold. It
          # now authors a weapon and an armor, plus the armor-type trait the
          # class was missing (isEquipAtypeOk is a plain trait lookup, so an
          # armor nobody allows is silently unselectable). The check asserts
          # `stronger=true`, not just that the slot filled: a slot can hold an
          # object while the number the player sees never moves. See ADR 0004
          # M6.3q.
          - name: MZ equip smoke test
            continue-on-error: true
            env:
              MZ_MODE: equip
            run: ./scripts/mz_boot_check.bash 111

          - name: MZ menu smoke test
            continue-on-error: true
            env:
              MZ_MODE: menu
            run: ./scripts/mz_boot_check.bash 111

          # Opening Scene_Menu is the same size of claim as reaching
          # Scene_Battle was — it holds the instant the scene is pushed, before
          # its first update — and the step above had been green on a bed whose
          # item database was empty, where the menu has nothing to do at all.
          # This mode uses the menu: the party is given a Potion and the actor
          # is wounded through event commands, then confirm walks the command
          # window, the item category, the item list and the actor window, and
          # cancel unwinds back to the map. It asserts `healed=true` (an item's
          # effect reached an actor's HP), `used=true` (the inventory paid for
          # it) and `returned=true` (the stack unwound). See ADR 0004 M6.3j.
          - name: MZ menu-play smoke test
            continue-on-error: true
            env:
              MZ_MODE: menu_play
            run: ./scripts/mz_boot_check.bash 111

          # The MZ message smoke test asserts a window opened over the map,
          # which says nothing about the window taking input, closing again, or the
          # interpreter doing anything with the answer — the same
          # scene-was-reached shape that hid the frozen battles. This mode shows
          # a message and a two-way choice, pages the text through, moves the
          # cursor to the *second* entry and confirms it, then checks which
          # branch of the event ran. The first entry is the default, so a run
          # that never moved the cursor takes the other branch and reports
          # picked=false: "a choice was made" and "a window appeared" are told
          # apart. See ADR 0004 M6.3p.
          # The same bed with its assets **encrypted**, which is a different
          # loading path rather than a variation on one: nothing is opened by
          # name, the engine XHRs each asset, decrypts it in its own JavaScript
          # and hands a Blob object URL to an Image. Both real games sampled
          # while testing this shipped that way, and neither could load a single
          # asset before M6.3r — a black screen in Scene_Boot. The encrypted
          # project is derived here rather than committed, so the plain bed stays
          # the one source of truth for its contents.
          - name: MZ encrypted-assets smoke test
            continue-on-error: true
            run: ./scripts/mz_encrypted_check.bash 113

          - name: MZ message-play smoke test
            continue-on-error: true
            env:
              MZ_MODE: message_play
            run: ./scripts/mz_boot_check.bash 111

          # The animation path, which nothing else here touches. MZ picks
          # between two animation systems by data shape: an animation carrying
          # a `frames` array draws as sprites (Sprite_AnimationMV), anything
          # else goes to Effekseer, whose WASM runtime this host never starts
          # (ADR 0004 M6.2) — so an Effekseer animation would play its timings
          # and no visuals at all. The bed authors an MV-format burst, and the
          # check asserts `mv=true` (the reachable system was selected) and
          # `played=true` (cell sprites were visible with a bitmap). It is also
          # the only thing in this bed that asks the renderer for a blend mode
          # other than normal alpha; the frame check below is what proves the
          # burst reached the picture, since the log says `played=true` even
          # when the art fails to resolve.
          - name: MZ animation smoke test
            continue-on-error: true
            env:
              MZ_MODE: animation
            run: ./scripts/mz_boot_check.bash 111

          - name: test
            run: |
              cmake --build build -t test

          # Boot the built engine on the real RPG2000/2003 test-beds and drive
          # it past the title into the map with --rpg2k_new_game. The CRuby host
          # checks above load the same game.rb/main.rb sources but cannot catch
          # mruby/CRuby divergence (a bare `module_function` is a no-op in
          # mruby, `Enumerable#none?` is absent), which had left the LCF map
          # path raising on New Game while every check passed. Any uncaught
          # mruby exception aborts the binary, so a non-zero exit or a missing
          # [RPG2k-MAP] marker fails this step. It uses display 109 and up, one
          # per game. See ADR 0021.
          - name: RPG2k real-game boot smoke test
            run: ./scripts/rpg2k_boot_check.bash 109

          # Regression guard for the RPG2000 map scene's per-frame mruby
          # object churn (Array/Proc/env allocations/sec): boots the engine on
          # Nepheshel, samples RGSS::Profiler's own cumulative per-type alloc
          # counters (mirrored into the profiler trace as the
          # `mruby_type_allocs` counter series) at two points in a steady
          # window, and fails if the measured rate exceeds a ceiling set from
          # this scene's own measured baseline (docs/profiling.md) -- a
          # reverted per-frame optimization (see the script's own header for
          # the list) shows up as a failing check instead of just a quieter
          # frame budget nobody happens to notice. Display 122.
          - name: RPG2k per-frame allocation regression check
            env:
              SERVER_NUM: 122
            run: ./scripts/rpg2k_alloc_regression_check.rb

          # The same guard for the RPG Maker XP runtime: the XP checks above run
          # mruby-rpgxp's sources under CRuby, so only booting the real binary
          # catches mruby/CRuby divergence. Each bed runs *its own* engine —
          # there is no reimplemented flow any more (ADR 0030): the check taps
          # confirm on the game's own title screen, logs every scene it reaches
          # as `[RPGXP-SCRIPTS]`/`[RPGXP-HOST-SCENE]`, walks the party on the
          # editor bed's map (`[RPGXP-HOST-MOVE]`), opens that bed's own menu
          # (`[RPGXP-HOST-MENU]`) and, in a pass each, fights in its own
          # battle scene (`[RPGXP-HOST-BATTLE]`) and opens its own save screen
          # (`[RPGXP-HOST-SAVE]`). Two beds: the editor-shaped OpenGame test bed
          # (script host, battle and save passes) and the *released* Pray for
          # You (Game.rgssad only, several maps; script host pass only — see
          # rpgxp_boot_check.bash). Each pass is a full headless engine boot on
          # CI's unaccelerated renderer, and running the four of them serially
          # in one step used to be this smoke's whole cost. RPGXP_BOOT_PASS
          # (see that script's usage comment) lets each run as its own step
          # here instead, on its own reserved display (112..115 — see the
          # reserved server-num map above), so they overlap with each other
          # and with every other step in this group rather than adding up. See
          # docs/adr/0025-rpgxp-cross-runtime-testing.md and
          # docs/adr/0030-rgss-only-the-games-own-engine.md.
          - name: RPG XP real-game boot smoke test (script host, editor bed)
            env:
              RPGXP_BOOT_PASS: script_host
            run: |
              ./scripts/rpgxp_boot_check.bash 112 \
                data/OpenGame.exe/Testbed/XP

          - name: RPG XP real-game boot smoke test (battle, editor bed)
            env:
              RPGXP_BOOT_PASS: battle
            run: |
              ./scripts/rpgxp_boot_check.bash 113 \
                data/OpenGame.exe/Testbed/XP

          - name: RPG XP real-game boot smoke test (save, editor bed)
            env:
              RPGXP_BOOT_PASS: save
            run: |
              ./scripts/rpgxp_boot_check.bash 114 \
                data/OpenGame.exe/Testbed/XP

          - name: RPG XP real-game boot smoke test (script host, Pray for You)
            env:
              RPGXP_BOOT_PASS: script_host
            run: |
              ./scripts/rpgxp_boot_check.bash 115 \
                data/PrayforYou

          # A released game keeps its Graphics/ inside the encrypted archive with
          # nothing loose, so the native asset loaders have to read through it.
          # Packs the same real test bed twice — with and without a title graphic
          # in the archive — and asserts the engine finds it only when it is
          # there, which is what makes the check non-vacuous. Displays 114-115.
          - name: RGSSAD packed-asset smoke test
            run: ./scripts/rgssad_asset_check.bash 120

          # Every MV screenshot step below budgets noticeably more than it used
          # to (5-8s -> 15-30s): MV#present/#maybe_screenshot (mv.rb) used to
          # blit a plain Canvas2D buffer that PIXI's auto-detected
          # WebGLRenderer (mvwebgl.cxx made canvas.getContext('webgl') succeed,
          # which every MV game now picks up too, not just MZ) never actually
          # drew into, so every MV screenshot was silently the canvas' own
          # untouched blank white -- cheap, and wrong. Reading the real frame
          # back from the WebGL FBO every frame (present_gl/screenshot_gl, the
          # same path MZ already paid for) costs real wall-clock time, roughly
          # proportional to the 816x624 canvas rather than scene complexity,
          # which is why even the asset-light data/mv-sample needs the same
          # kind of bump as data/Lunatic-Core.
          - name: MV boot smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=100 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=15000 --game_dir data/Lunatic-Core --test_play \
                --mv_screenshot=ss/mv_title.png

          # Drive the real downloaded MV test bed (Lunatic-Core) past the title
          # into actual play: New Game -> map, then hold a direction and log the
          # player's start/end tile (`[MV-MOVE] ... moved=<bool>`) and capture a
          # frame. The boot smoke above only reaches the title; this exercises
          # the fuller real game's map / movement / render path (a real database,
          # autotiles and character sheet the minimal sample can't cover). Like
          # the MZ movement smoke, this greps the log for `moved=true` (a step
          # that merely runs to completion cannot pass) — the process exit code
          # alone previously let a stuck-tileset regression through unnoticed.
          # Non-blocking, like the other MV smokes.
          - name: MV real-game play smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=105 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=20000 --game_dir data/Lunatic-Core --test_play \
                --mv_new_game --mv_move_test --mv_screenshot=ss/mv_play.png \
                | tee ss/mv_play.log
              grep -q '\[MV-MOVE\].*moved=true' ss/mv_play.log ||
                { echo "player never moved ([MV-MOVE] moved=true missing)"; exit 1; }

          - name: MV sample smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=101 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=15000 --game_dir data/mv-sample --test_play \
                --mv_new_game --mv_screenshot=ss/mv_sample.png

          # Play RPG Maker MZ (M6.3c): the fetched rmmz corescript + PIXI v5 on
          # the committed data/mz-sample project. The check asserts the boot
          # reaches a real scene through the native surfaceless-EGL renderer
          # (`[MZ-BOOT] booted to <scene>`, and not the Scene_Boot loading
          # screen), that New Game gets to the start map (`[MZ-MAP]`) and that a
          # held direction actually walks the player (`[MZ-MOVE] moved=true`),
          # and it captures the frame to ss/mz_play.png. Non-blocking while the
          # MZ runtime is brought up, like the MV smokes; display 111 (see the
          # reserved server-num map above).
          - name: MZ play smoke test
            continue-on-error: true
            run: ./scripts/mz_boot_check.bash 111

          # The rest of the in-game paths, one run each (the same shape as the
          # MV smokes above), all through the same no-X headless launcher the
          # play smoke uses. Each mode asserts its own success line, so a probe
          # that merely ran cannot pass: the message window has to open
          # (`[MZ-MSG] busy=true window_open=true`), Scene_Menu has to be
          # reached (`[MZ-MENU] reached_menu=true`), the asynchronous save chain
          # has to settle with the slot written and read back (`[MZ-SAVE]`), and
          # Battle Processing has to land in Scene_Battle (`[MZ-BTL]`).
          # Non-blocking while the MZ runtime is brought up, like the MV smokes.
          - name: MZ message smoke test
            continue-on-error: true
            env:
              MZ_MODE: message
            run: ./scripts/mz_boot_check.bash 111

          # The first thing here that leaves the start map. A bed with one map
          # never loads a second one, so Transfer Player, Scene_Map re-creating
          # itself, DataManager.loadMapData for a MapXXX.json that was not read
          # at boot, and Game_Map.setupEvents for the arriving map all had no
          # coverage. The bed gained a second map for it. Asserts `moved=true`
          # (the map id changed), `landed=true` (the player is on the requested
          # tile) and `arrived=true` — the destination's *own* parallel event
          # having run, which is what separates the id moving from the map
          # actually loading. See ADR 0004 M6.3l.
          - name: MZ transfer smoke test
            continue-on-error: true
            env:
              MZ_MODE: transfer
            run: ./scripts/mz_boot_check.bash 111

          - name: MZ save smoke test
            continue-on-error: true
            env:
              MZ_MODE: save
            run: ./scripts/mz_boot_check.bash 111

          # Run the battle smoke against the real bed (Lunatic-Core): it ships
          # battlers and a battleback, so the captured Scene_Battle frame shows
          # an actual battle (enemy + battle log) rather than the art-less
          # sample's near-black screen. The step logs `[MV-BTL] reached_battle=
          # <bool>`; a longer timeout lets New Game -> map -> the battle intro
          # play out before the assertion.
          - name: MV battle smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=102 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=30000 --game_dir data/Lunatic-Core --test_play \
                --mv_battle_test=1 --mv_screenshot=ss/mv_battle.png

          - name: MV movement smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=103 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=6000 --game_dir data/mv-sample --test_play \
                --mv_new_game --mv_move_test \
                | tee ss/mv_move.log
              grep -q '\[MV-MOVE\].*moved=true' ss/mv_move.log ||
                { echo "player never moved ([MV-MOVE] moved=true missing)"; exit 1; }

          - name: MV message smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=104 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=15000 --game_dir data/mv-sample --test_play \
                --mv_new_game --mv_message_test --mv_screenshot=ss/mv_message.png

          # Confirm the menu path works: New Game -> map, then open the party
          # menu (Scene_Map's own callMenu) and log `[MV-MENU] reached_menu=
          # <bool>`, capturing the rendered menu. Uses the committed sample
          # (its windowskin frames the menu windows).
          - name: MV menu smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=106 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=15000 --game_dir data/mv-sample --test_play \
                --mv_new_game --mv_menu_test --mv_screenshot=ss/mv_menu.png

          # Confirm the save path works: New Game -> map, then a save+load
          # round-trip through DataManager, logging `[MV-SAVE] saved=.. exists=..
          # loaded=..`. Non-visual, so no screenshot.
          - name: MV save smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=107 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=6000 --game_dir data/mv-sample --test_play \
                --mv_new_game --mv_save_test

          # Confirm the audio path works: New Game -> map, then play the sample's
          # authored SE through the AudioManager->RGSS::Audio bridge and log
          # `[MV-AUDIO] op=.. dispatched=.. asset=..`. Non-visual, so no
          # screenshot. (CI has no audio device, so this checks the op reaches
          # RGSS::Audio and the asset resolves, not audible output.)
          - name: MV audio smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=108 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=6000 --game_dir data/mv-sample --test_play \
                --mv_new_game --mv_audio_test

      # The five MZ smokes above each assert their own frame in isolation (the
      # boot check runs scripts/mz_frame_check.rb --frame on what it captured).
      # The comparisons between modes need all five frames, so they run here,
      # after the parallel group's implicit wait: the message frame against the
      # plain map frame, the menu and battle frames against it, and the
      # post-save frame back on it. Reads only ss/mz_*.png, and skips cleanly
      # when the MZ engine was not fetched and the smokes wrote nothing.
      # Non-blocking, like the MZ smokes it reads.
      - name: MZ frame check
        continue-on-error: true
        if: always()
        run: ruby scripts/mz_frame_check.rb ss

      - name: Upload MV screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-screenshot
          path: ss/mv_title.png
          if-no-files-found: warn

      - name: Upload MV play screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-play-screenshot
          path: ss/mv_play.png
          if-no-files-found: warn

      - name: Upload MV sample screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-sample-screenshot
          path: ss/mv_sample.png
          if-no-files-found: warn

      - name: Upload MV battle screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-battle-screenshot
          path: ss/mv_battle.png
          if-no-files-found: warn

      - name: Upload MV message screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-message-screenshot
          path: ss/mv_message.png
          if-no-files-found: warn

      - name: Upload MV menu screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-menu-screenshot
          path: ss/mv_menu.png
          if-no-files-found: warn

      - name: Upload MZ play screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mz-play-screenshot
          path: ss/mz_play.png
          if-no-files-found: warn

      - name: Upload MZ scene screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mz-scene-screenshots
          path: |
            ss/mz_message.png
            ss/mz_menu.png
            ss/mz_save.png
            ss/mz_battle.png
          if-no-files-found: warn

  # The bc2cpp jobs build the host mruby library with RPGMAKER_BC2CPP=1 on its
  # own, then run the compiler-specific analyses, coverage reports and the
  # Optcarrot checksum benchmark. Keeping this separate from the normal game
  # build makes failures attributable to bc2cpp and ensures the generated
  # compiled gems are actually compiled into libmruby.a.
  #
  # Split three ways so the slow parts run side by side (ADR 0228):
  # `bc2cpp-build` compiles the full libmruby.a; each `bc2cpp-checks` shard
  # builds only the gem-free bootstrap host mrbc (`mruby_host_mrbc`) that every
  # check reads, so the shards start at once instead of waiting on the full
  # build; `bc2cpp` aggregates both and keeps the old status-check name.
  bc2cpp-build:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      RPGMAKER_BC2CPP: "1"
      SCCACHE_GHA_ENABLED: "true"
      ACTIONS_CACHE_SERVICE_V2: "on"
      SCCACHE_GHA_RW_MODE: >-
        ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master')
            && 'READ_WRITE' || 'READ_ONLY' }}

    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # See the `build` job's "Init submodules" step. This job's own
          # `cmake -S .` configure walks the same CMakeLists.txt (SDL2 comes
          # from `find_package`), so it skips 3rd/SDL and 3rd/SDL_mixer too.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: 3rd/SDL 3rd/SDL_mixer
        run: ./scripts/checkout-submodules.bash

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Set up development environment
        run: ./scripts/nix-develop-export-env.bash

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure host build
        run: cmake -S . -B build-bc2cpp -GNinja

      - name: Build host mruby with bc2cpp
        timeout-minutes: 45
        # mruby core (including the three RPGMAKER_BC2CPP-only compiled gems)
        # is built by one `rake` run (cmake/build-mruby.cmake), so ninja's own
        # parallelism never reaches it. `-m` makes rake schedule every
        # prerequisite concurrently -- the three compiled gems' codegen and all
        # C/C++ compiles -- on the runner's cores (ADR 0228). The compilers are
        # the dev shell's CMAKE_<LANG>_COMPILER_LAUNCHER (sccache), passed to
        # rake as CC=/CXX= by CMakeLists.txt.
        env:
          RAKEOPT: -m -j4
        run: cmake --build build-bc2cpp --target mruby_build

      # Right after the build: the sccache server exits after 10 idle minutes,
      # so a later stats step would only report a fresh, empty server.
      - name: sccache stats
        if: always()
        run: sccache --show-stats

  bc2cpp-checks:
    if: ${{ github.event_name != 'issue_comment' }}
    name: bc2cpp-checks (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    # Shards are balanced by measured cost (ADR 0228), not by count. Every
    # check that used to run in the single `bc2cpp` job is listed exactly once;
    # keep it that way when adding one (put a fast check in `fast`).
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: static-dispatch
            checks: |
              # Re-proves every STATIC_DISPATCH_UNREGISTERED name (docs/adr/0203):
              # a new dynamic reference to one is a NoMethodError, so it fails here.
              MRBC="$mrbc" ruby scripts/bc2cpp_static_dispatch_check.rb
          - shard: wired-embedding
            checks: |
              MRBC="$mrbc" ruby scripts/bc2cpp_wired_embedding_check.rb
          - shard: hot-only
            checks: |
              MRBC="$mrbc" ruby scripts/bc2cpp_nomethod_reviewed_check.rb
              BC2CPP_MRUBY_CORE="$core" MRBC="$mrbc" ruby scripts/bc2cpp_hot_only_check.rb
          - shard: registrations
            checks: |
              BC2CPP_MRUBY_CORE="$core" MRBC="$mrbc" ruby scripts/bc2cpp_embedded_ivar_access_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_never_called_registrations_check.rb
          - shard: optcarrot-benchmark
            checks: |
              MRBC="$mrbc" ruby tools/optcarrot_probe/compiled_run.rb 180
          - shard: fast
            checks: |
              ./scripts/bc2cpp_coverage_check.bash build-bc2cpp/mruby
              ./scripts/optcarrot_bc2cpp_coverage_check.bash build-bc2cpp/mruby
              MRBC="$mrbc" ruby scripts/bc2cpp_include_ancestor_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_funcall_argc_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_retclass_devirtualization_check.rb
              BC2CPP_MRUBY_CORE="$core" MRBC="$mrbc" ruby scripts/bc2cpp_hash_each_value_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_module_body_ivar_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_range_each_arity_check.rb
              BC2CPP_MRUBY_CORE="$core" MRBC="$mrbc" ruby scripts/bc2cpp_forwarded_yield_times_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_nilable_retclass_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_unique_class_names_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_class_arg_devirtualization_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_setidx_devirtualization_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_float_math_fastpath_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_array_push_fastpath_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_native_expression_devirt_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_runtime_wiring_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_owner_registration_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_mono_embed_guard_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_symbol_cache_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_const_site_cache_check.rb
              ruby scripts/bc2cpp_embed_guard_exemption_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_native_class_const_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_struct_index_check.rb
              BC2CPP_MRUBY_CORE="$core" MRBC="$mrbc" ruby scripts/bc2cpp_outlined_index_check.rb
              BC2CPP_MRUBY_CORE="$core" MRBC="$mrbc" ruby scripts/bc2cpp_runtime_devirt_check.rb
              BC2CPP_MRUBY_CORE="$core" MRBC="$mrbc" ruby scripts/bc2cpp_inherited_self_devirt_check.rb
              BC2CPP_MRUBY_CORE="$core" MRBC="$mrbc" ruby scripts/bc2cpp_poly_table_check.rb
              BC2CPP_MRUBY_CORE="$core" MRBC="$mrbc" ruby scripts/bc2cpp_eqq_integer_check.rb
              BC2CPP_MRUBY_CORE="$core" MRBC="$mrbc" ruby scripts/bc2cpp_const_lookup_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_poly_accessor_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_owner_class_cache_check.rb
              ruby scripts/bc2cpp_mrbgem_deps_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_integer_const_inline_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_packed_attr_args_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_rescue_live_in_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_rescue_inline_block_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_return_join_check.rb
              MRBC="$mrbc" ruby scripts/bc2cpp_nested_compile_state_check.rb
              BC2CPP_MRUBY_CORE="$core" MRBC="$mrbc" ruby scripts/bc2cpp_closed_world_check.rb

    env:
      RPGMAKER_BC2CPP: "1"
      SCCACHE_GHA_ENABLED: "true"
      ACTIONS_CACHE_SERVICE_V2: "on"
      SCCACHE_GHA_RW_MODE: >-
        ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master')
            && 'READ_WRITE' || 'READ_ONLY' }}

    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # Same submodule set as `bc2cpp-build`, which keeps 3rd/optcarrot
          # for the Optcarrot shards.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: 3rd/SDL 3rd/SDL_mixer
        run: ./scripts/checkout-submodules.bash

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Set up development environment
        run: ./scripts/nix-develop-export-env.bash

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure host build
        run: cmake -S . -B build-bc2cpp -GNinja

      # The same patched sources, build_config.rb and rake rule as the full
      # build's own bootstrap mrbc -- only the gems are left out (ADR 0228).
      - name: Build host bootstrap mrbc
        run: cmake --build build-bc2cpp --target mruby_host_mrbc

      - name: Run ${{ matrix.shard }} checks
        run: |
          mrbc="$(find build-bc2cpp/mruby -maxdepth 6 -type f -name mrbc -path '*/bin/mrbc' -perm -u+x -print -quit)"
          test -n "$mrbc" || { echo "no host bin/mrbc found under build-bc2cpp/mruby" >&2; exit 1; }
          # The checks below quietly SKIP their compiled-code comparison
          # without these, so a missing piece must fail the shard instead.
          core="$PWD/build-bc2cpp/mruby/host/mrbc"
          test -f "$core/lib/libmruby_core.a" && test -d "$core/include" ||
            { echo "no libmruby_core.a with include/ under $core" >&2; exit 1; }
          ${{ matrix.checks }}

  # The single status the old one-job `bc2cpp` reported: success only when the
  # build and every check shard succeeded, so a required check on `bc2cpp`
  # still gates on all of them.
  bc2cpp:
    if: ${{ always() && github.event_name != 'issue_comment' }}
    needs: [bc2cpp-build, bc2cpp-checks]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every bc2cpp job to succeed
        env:
          BUILD: ${{ needs.bc2cpp-build.result }}
          CHECKS: ${{ needs.bc2cpp-checks.result }}
        run: |
          echo "bc2cpp-build: $BUILD, bc2cpp-checks: $CHECKS"
          test "$BUILD" = success && test "$CHECKS" = success

  # Ruby-only checks split out of `build`: none of the nine steps below ever
  # touches the compiled engine binary (they load the mruby-*/mrblib sources
  # directly under CRuby), so unlike everything left in `build`'s `parallel:`
  # group they do not need to wait on `cmake`/`build` -- the native compile
  # that job's own comments call "the long pole". This job skips the C++
  # toolchain entirely: no cmake, no sccache, no RTP/MV/MZ engine downloads,
  # just checkout + the dev shell + the one game download these checks
  # actually read (`download-*.bash` below; see rpg2k_command_soak.rb, the
  # one script here that hard-fails rather than skips when it finds nothing
  # under data/) + the checks themselves. It runs alongside `build`, not
  # after it, so these checks report back in well under a minute instead of
  # queueing behind several minutes of C++ compile first, and `build`'s own
  # `parallel:` group has a few fewer steps competing for its worker slots.
  ruby-checks:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04

    env:
      # See the `build` job for what this is; the same game-archive downloads
      # run here.
      CORS_PROXY_URL: ${{ secrets.CORS_PROXY_URL }}

    steps:
      - uses: actions/checkout@v7
        with:
          # None of the checks in this job touch 3rd/ (they load
          # mruby-*/mrblib sources directly under CRuby, and the nix dev shell
          # no longer pulls submodules either -- see flake.nix's own comment on
          # dropping `self.submodules = true`), so this job initializes no
          # submodule at all rather than the full sixteen `recursive` used to
          # clone.
          submodules: false
          # Quiet fetch + no post-job credential unset walk; see the `build` job.
          show-progress: false
          persist-credentials: false

      # No test262-skip step here either; see the `build` job.

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # See the `build` job: realises the dev shell and exports its
      # environment once so the steps below run their commands directly,
      # with no further `nix` calls.
      - run: ./scripts/nix-develop-export-env.bash

      - name: cache test game
        uses: actions/cache@v6
        id: cache
        with:
          path: data
          key: game-${{ hashFiles('./scripts/download-*.bash', './scripts/gen-mv-sample.py', './scripts/gen-sample-font.py', './data/mv-sample/data/**', './data/mv-sample/img/**', './data/mv-sample/audio/**', './data/mv-sample/fonts/**', './data/mv-sample/js/main.js', './data/mv-sample/js/plugins.js', './data/mv-sample/index.html', './scripts/gen-mz-sample.py', './data/mz-sample/data/**', './data/mz-sample/img/**', './data/mz-sample/audio/**', './data/mz-sample/fonts/**', './data/mz-sample/js/plugins.js', './data/mz-sample/index.html') }}

      - name: Download game
        timeout-minutes: 15
        run: |
          ./scripts/download-nepheshel.bash
          ./scripts/download-mtf-meido-action.bash
          ./scripts/download-opengame-xp.bash
          ./scripts/download-prayforyou.bash
          ./scripts/download-yumenikki.bash
          ./scripts/download-killer-knights.bash
          ./scripts/download-histoire.bash
          ./scripts/download-monodori.bash
          ./scripts/download-wolfrpg-sample.bash

      - parallel:
          # Dynamic Ruby (method_missing, computed send, ...) in the code bc2cpp
          # compiles as a closed world; new offences fail, fixed ones must leave
          # the baseline.
          - name: RPG2k closed-world lint
            run: |
              ruby scripts/rpg2k_closed_world_lint_check.rb
              ruby scripts/rpg2k_closed_world_lint.rb

          # The wio-only mrblib rewrites only run in a wio build, which CI
          # doesn't do; a source edit must not silently break them.
          - name: wio strip scripts still apply
            run: ruby scripts/wio_strip_scripts_check.rb

          # ADR 0217: the compact CP932 tables (and wio's scan encoder) must
          # agree with ADR 0111's pair tables on every 16-bit input.
          - name: CP932 table lookups match the reference
            run: ruby scripts/cp932_tables_check.rb

          # The analysis behind the wio unreachable-method strip (ADR 0218)
          # on a fixture world: every way to reach a method keeps it.
          - name: wio unreachable-method analysis soundness
            run: ruby scripts/wio_unreachable_methods_check.rb

          - name: LCF test-bed smoke check
            run: ruby scripts/lcf_testbed_check.rb

          - name: LCF schema coverage
            run: ruby scripts/lcf_schema_coverage.rb

          # LCF record/section/file fields are read with `[]` only (ADR 0213):
          # method_missing must not come back, no field name may answer as a
          # method, and `[]` must read what the removed dotted access read on
          # real test-bed records.
          - name: LCF bracket field access check
            run: ruby scripts/lcf_bracket_access_check.rb

          - name: RPG2003 battle-command data check
            run: ruby scripts/rpg2k3_battle_command_check.rb

          - name: RPG2003 battle row (front/back) check
            run: ruby scripts/rpg2k3_battle_row_check.rb

          - name: RPG2003 battle gauge (active-time) check
            run: ruby scripts/rpg2k3_battle_gauge_check.rb

          # The interpreter against every event command the downloaded games
          # ship (371k of them), asserting that none raises and none reaches a
          # handler's "I do not know this" arm. The unit checks pin the
          # semantics against hand-written commands; this covers the parameter
          # shapes real games use, which no fixture set reaches.
          - name: RPG2k event-command soak
            run: ruby scripts/rpg2k_command_soak.rb

          - name: RPG XP test-bed smoke check
            run: ruby scripts/rpgxp_testbed_check.rb

          - name: RPG XP script-host smoke check
            run: ruby scripts/rpgxp_script_host_check.rb

          # RPG Maker VX / VX Ace data layer. Commercial editors and RTPs mean
          # there is close to no fetchable open-source test bed for either
          # edition, so this check also builds a full project per edition and
          # drives the loader over it — loose on disk and repacked into the
          # edition's encrypted archive — plus an audit that every field in the
          # data has an accessor in the schema. download-monodori.bash supplies
          # a real one for VX proper: a freeware release packed entirely into
          # Game.rgss2a with no loose Data/, picked up automatically here.
          # download-sanctuary-of-the-ruler.bash is the VX Ace counterpart, but
          # stays a manual/local download (see its own comment) rather than a
          # CI one: at ~400MB it is well past this repo's 100MB CI budget for a
          # downloaded test bed.
          - name: RPG VX / VX Ace data check
            run: ruby scripts/rpgvx_testbed_check.rb

          # WOLF RPG Editor data layer, driven over the editor's own official
          # sample game (download-wolfrpg-sample.bash) -- every BasicData file
          # plus every map in Data/MapData.
          - name: WOLF RPG Editor test-bed check
            run: ruby scripts/wolf_testbed_check.rb

          # WOLF RPG Editor event-command interpreter: drives every auto/
          # parallel Common Event and, for every real map, every event's
          # active page (auto/parallel stepped per frame, Confirm/Touch
          # pages exercised once) over the same sample game, asserting
          # nothing raises or hangs -- this is what caught three real
          # infinite-loop bugs (docs/adr/0065) that the hand-built unit
          # fixtures in mruby-wolf/test/wolf_test.rb never exercised.
          - name: WOLF RPG Editor interpreter soak check
            run: ruby scripts/wolf_interpreter_check.rb

          # Validate the committed MV test-bed database (data/mv-sample). Pure
          # CRuby, no JS engine — a guard against a sample-data regression
          # that would silently break the native MV smokes in the `build` job.
          - name: MV test-bed data check
            run: ruby scripts/mv_testbed_check.rb data/mv-sample

          # The same guard for the MZ bed (data/mz-sample, authored by
          # scripts/gen-mz-sample.py). MZ's boot is fussier than MV's about two
          # things a JSON-shape check cannot see — the ButtonSet sheet's
          # minimum size, which Sprite_Button *asserts*, and the "no effect on
          # passage" flag on the empty tile, without which no wall blocks.
          - name: MZ test-bed data check
            run: ruby scripts/mz_testbed_check.rb data/mz-sample

          # Static, maker-agnostic source scan across every mruby-*/mrblib tree:
          # a bare, unbraced trailing keyword-style hash into Array#push/
          # #unshift/#concat silently pushes nothing at all on this project's
          # mruby (a builtin C-defined method has no declared keyword
          # parameters, so mruby does not fall back to CRuby's "no keyword
          # params declared -> treat it as one positional Hash" conversion),
          # with no exception anywhere to catch it -- a class of bug the
          # CRuby-hosted checks below cannot see at all, since they run these
          # same sources unchanged under CRuby. Found via
          # Interpreter#do_move_event silently no-op'ing (Nepheshel map 23
          # event 29's own HiddenDoor investigation); see
          # changelog.d/move-event-queue-bare-hash-push.fixed.md.
          - name: mruby bare-hash-push check
            run: ruby scripts/mruby_bare_hash_push_check.rb

          # Unit check for the Wio bc2cpp flash-overflow report's map/ld parsing
          # (scripts/wio_overflow_report.rb, ADR 0152) against a hand-built map
          # with known numbers -- the real `wio-bc2cpp` job exercises it too,
          # but only after a multi-minute ARM cross-build, so this pins the
          # arithmetic without one.
          - name: wio overflow report check
            run: ruby scripts/wio_overflow_report_check.rb

          - name: wio dropped-gems check
            run: ruby scripts/wio_dropped_gems_check.rb

          - name: RPG2k game-logic checks
            run: |
              ruby scripts/rpg2k_logic_check.rb
              ruby scripts/rpg2k_scene_check.rb
              ruby scripts/rpg2k_render_check.rb

          # The iPod nano 7G map-walk export (scripts/export_nano7_map.rb, ADR
          # 61): runs the exporter over real test-bed maps and re-parses
          # map.bin/tiles.bin against the invariants the on-device C reader
          # relies on. This port has no CI build and no emulator, so this is
          # the only automated coverage it has -- and it is what catches an
          # exporter/reader format drift, or the chipset colour key leaking
          # back into the atlas, without a device.
          - name: iPod nano 7G map export check
            run: ruby scripts/export_nano7_map_check.rb

          # The join of the two check kinds above: real test-bed databases
          # (LCF test-bed smoke check's data) driven through the real
          # Game::Interpreter, so a rule only genuine game data violates gets
          # caught. Its first subject is Nepheshel's companion swaps — the
          # party-roster bug of ADR 0030 passed every fixture check. Skips
          # with exit 0 when no game has been downloaded.
          - name: RPG2k test-bed logic check
            run: ruby scripts/rpg2k_testbed_logic_check.rb

          # The mruby-rgss mrbtest suite (mruby-rgss/test/test.rb) run under
          # CRuby through the RGSS compatibility layer
          # (scripts/rgss_cruby_compat.rb). In the build job the same file runs
          # inside the built mruby (the mruby_test ctest); here it guards the
          # RGSS behavioural contract with no build, and the coverage reporter
          # below can finally measure the RGSS mrblib lines the suite reaches.
          - name: RGSS mrbtest suite under CRuby
            run: ruby scripts/rgss_cruby_test_check.rb

      # How much of the Ruby engine the checks above actually reach. It re-runs
      # them (concurrently, like the group above) with CRuby's Coverage stdlib
      # switched on and reports the line coverage of `mruby-*/mrblib` per gem
      # and per file — see ADR 0049 and docs/coverage.md. Report-only as far as
      # the *number* goes: it lands in the job summary and in an artifact, and
      # no floor is enforced (`--min-line-rate` exists for when one is wanted).
      # The step itself is not `continue-on-error`, so a reporter that breaks —
      # or a check that fails only on this second, coverage-instrumented run —
      # is visible rather than a quietly missing report.
      - name: Ruby coverage report
        run: ruby scripts/coverage_report.rb

      # `always()`: the reporter writes its files before it exits non-zero on a
      # failed check, so the report is still worth publishing on a red run.
      - name: Upload Ruby coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ruby-coverage
          path: |
            coverage/lcov.info
            coverage/coverage.json
          if-no-files-found: warn

  # `/preview` command gate. Cloudflare previews are opt-in per pull request:
  # they are published when someone with write access comments `/preview` on the
  # PR, not automatically on every push to every PR. This job resolves that
  # comment into the head commit the preview should build and acknowledges the
  # command with a 👀 reaction, so it is visible that the run started.
  #
  # `issue_comment` runs on the base repo with access to the repository secrets
  # even when the pull request comes from a fork, so the author check below is
  # the security boundary: only OWNER / MEMBER / COLLABORATOR comments get past
  # it. Anyone else's `/preview` is ignored — no build, no deploy.
  preview-gate:
    if: >-
      ${{ github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/preview')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                      github.event.comment.author_association) }}
    # Two `gh api` calls and nothing else — no checkout, no compiler, no build
    # tools — so this runs on the small `ubuntu-slim` image (1 CPU, 5 GB RAM,
    # 15-minute job cap) rather than a full-fat runner. `gh` and `jq` ship with
    # the image. This is exactly the "issue operations / short-running job"
    # shape that label is meant for, and it bills at a lower rate.
    runs-on: ubuntu-slim
    permissions:
      # Read the PR to find its head commit, and write the 👀 reaction on the
      # comment. The reaction goes through `/issues/comments/{id}/reactions`,
      # but this job only ever runs on a pull request's conversation comment
      # (see the `if` above), and GitHub authorises those against the pull
      # request the comment belongs to — `issues: write` is not enough, the
      # POST 403s without `pull-requests: write`.
      pull-requests: write
    outputs:
      head-sha: ${{ steps.pr.outputs.head-sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Resolve the pull request head
        id: pr
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '"head-sha=\(.head.sha)"' >> "$GITHUB_OUTPUT"

      - name: Acknowledge the command
        # The reaction is only a visible "the run started" hint, and this job is
        # what gates the preview build and deploy. Don't let a failed ack cost
        # someone their preview.
        continue-on-error: true
        run: |
          gh api --silent -X POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes

  wasm:
    # Builds the page for ordinary CI (push / pull request / manual run) and,
    # on a `/preview` comment, for the commit that comment asked to preview.
    # `preview-gate` is skipped outside the comment flow — which would skip this
    # job along with it — so the condition spells both cases out.
    needs: preview-gate
    if: >-
      ${{ !cancelled()
          && (github.event_name != 'issue_comment'
              || needs.preview-gate.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      # A `/preview` comment can ask for a fork's branch to be built, so keep
      # the token read-only here; `preview-gate` limits who may ask.
      contents: read
    env:
      # Cache emcc compilations across runs. sccache (used by the native build)
      # does not understand emcc, so the wasm build uses ccache instead, which
      # wraps emcc as a plain compiler. nixpkgs sets EM_CONFIG via the
      # environment, so emcc does not pass --em-config on the command line and
      # ccache does not bail out with "Multiple input files".
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # See the `build` job for what this is.
      CORS_PROXY_URL: ${{ secrets.CORS_PROXY_URL }}
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # See the `build` job's "Init submodules" step -- CMakeLists.txt's
          # `if(EMSCRIPTEN)` branch gets SDL2/SDL2_mixer from Emscripten's own
          # ports (`-sUSE_SDL=2`), never from 3rd/SDL or 3rd/SDL_mixer, and
          # nothing here reads 3rd/optcarrot.
          submodules: false
          # The PR head for a `/preview` comment; empty everywhere else, which
          # is checkout's default of "the ref that triggered the workflow".
          ref: ${{ needs.preview-gate.outputs.head-sha }}
          # Quiet fetch + no post-job credential unset walk; see the `build` job.
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: 3rd/SDL 3rd/SDL_mixer 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      # No test262-skip step here either; see the `build` job.

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # See the `build` job: realises the dev shell and exports its
      # environment once so the steps below — including the concurrent
      # `background: true` ones — run their commands directly, with no
      # further `nix` calls and therefore no store-lock contention between
      # them.
      - run: ./scripts/nix-develop-export-env.bash

      # Fetch + build the MIT MV engine into the committed sample so it can be
      # bundled into the page as a one-click preset (WASM_SAMPLE_DIR below).
      # Like the `build` job's downloads, this is network-bound work that feeds
      # nothing in the configure step, so it runs as a `background: true` step
      # and overlaps the cache restores and `emcmake cmake` below instead of
      # holding them up. WASM_SAMPLE_DIR is only consumed at *link* time (it
      # becomes an emcc `--preload-file`, see CMakeLists.txt), and configure
      # merely resolves the path of the committed data/mv-sample directory, so
      # the barrier before `build` is early enough. The script is idempotent and
      # writes only inside data/ (git-ignored engine files plus its
      # data/.mv-corescript clone), so nothing here races the concurrent steps.
      - name: Build MV sample engine
        id: mv-sample
        background: true
        timeout-minutes: 10
        run: ./scripts/download-mv-corescript.bash

      # Instrument samples for the TiMidity decoder the port is built with
      # (-sSDL2_MIXER_FORMATS in CMakeLists.txt). They are packaged into
      # index.data at link time by -DWASM_MIDI_PATCHES=ON below, so this is
      # awaited by the pre-link barrier rather than the configure.
      - name: Download MIDI patches
        id: freepats
        background: true
        timeout-minutes: 10
        run: ./scripts/download-freepats.bash

      # The fallback UI font, packaged into index.data at link time by
      # -DWASM_DEFAULT_FONT=ON below (so the pre-link barrier awaits it, not the
      # configure). Without it a project loaded into the page that ships no font
      # of its own renders every window at the bitmap font's fixed 12px.
      - name: Download default font
        id: default-font
        background: true
        timeout-minutes: 5
        run: ./scripts/download-default-font.bash

      # Keyed on the toolchain pin (flake.*), not github.run_id: the cached
      # system libraries only change when the Emscripten/Nix pin does, so a
      # run_id key -- unique every run, never an exact hit -- was saving a
      # brand-new full copy of ~/.emscripten_cache on every single push/PR
      # and never reusing any of them, flooding
      # github.com/<repo>/actions/caches until GitHub's 10GB-per-repo cap
      # started evicting older, still-useful caches (Nix store, RTP, wine
      # prefix, game data) to make room. This key now matches "Restore and
      # cache Nix store" above and gets a real exact-match hit on every run
      # until the toolchain pin moves.
      - uses: actions/cache@v6
        with:
          path: ~/.emscripten_cache
          key: ${{ runner.os }}-emcc-${{ hashFiles('flake.*') }}
          restore-keys: ${{ runner.os }}-emcc-

      # Same run_id problem as the Emscripten cache above, but ccache's
      # contents legitimately evolve with source changes, so it cannot use a
      # toolchain-pin key the way that cache does. This used to key on
      # github.sha instead, capping growth to one new cache per commit rather
      # than one per workflow *run* -- but on a repo this commit-heavy, "one
      # per commit" is still a fresh multi-hundred-MB entry on nearly every
      # push, almost none of which ever gets an exact-match hit again (the
      # next commit has a different sha), so they just piled up as dead
      # weight -- flooding github.com/<repo>/actions/caches and evicting the
      # Nix/RTP/wine/game caches above the same way the old emcc key did.
      # Rotate on a week instead: every push in the same
      # ISO week exact-matches the same key (ccache updates locally but the
      # post-job save step is a no-op on an exact-match restore, since
      # actions/cache cannot overwrite an existing entry), and
      # `restore-keys` falls back to the most recent prior week's entry once
      # the week rolls over. That bounds this to ~52 entries/year while still
      # refreshing ccache's contents regularly.
      - name: Cache period
        id: cache-period
        run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore and cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: wasm-ccache-${{ steps.cache-period.outputs.value }}
          restore-keys: wasm-ccache-

      # Emscripten builds its system libraries (libc/libc++, and the -fexceptions
      # variant this project forces) on the first emcc call, which costs ~50s of
      # the configure step. The nixpkgs emscripten setup hook points EM_CACHE at
      # an ephemeral temp dir, so that work is thrown away every run and the
      # cached ~/.emscripten_cache is never written. Override EM_CACHE on the
      # command itself (after the hook runs) so the libraries are built once and
      # restored on later runs. It must be set for both configure and build,
      # since emcc runs in both.
      - name: cmake
        # CMAKE_<LANG>_COMPILER_LAUNCHER is initialised from the environment at
        # configure time and stored in CMakeCache.txt, so setting ccache here is
        # enough for it to wrap emcc during the build step too. This overrides
        # the sccache launcher the devShell exports (sccache cannot cache emcc).
        # WASM_SAMPLE_DIR bakes the MV sample into the page at /game_sample.
        run: |
          env EM_CACHE="$HOME/.emscripten_cache" \
            CMAKE_C_COMPILER_LAUNCHER=ccache \
            CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            emcmake cmake -S . -B wasm-build -GNinja \
            -DWASM_SAMPLE_DIR=data/mv-sample \
            -DWASM_MIDI_PATCHES=ON \
            -DWASM_DEFAULT_FONT=ON
          # cmake/emscripten-probe-cache.cmake records which branch it took. It
          # falls back to probing whenever the Emscripten version moved, which
          # is correct but costs ~100s, and the only other symptom is a slow
          # step -- easy to read as noise. Say so instead. A warning, not an
          # error: the fallback builds the same thing, it just wants a
          # regeneration.
          status="$(cat wasm-build/emscripten-probe-cache.status 2>/dev/null \
            || echo 'missing')"
          echo "Emscripten probe cache: $status"
          case "$status" in
            applied*) ;;
            *) echo "::warning::the Emscripten probe pre-seed did not apply" \
                 "($status), so the wasm configure probed the toolchain the" \
                 "slow way. Regenerate cmake/emscripten-probe-cache.cmake --" \
                 "see the header of that file." ;;
          esac

      # Prove the pre-seeded answers still match what the toolchain reports. The
      # version guard in the seed cannot see a sysroot that changed underneath
      # the same Emscripten release, so this re-probes for real and diffs. That
      # is the ~110s configure the seed exists to avoid, so it runs alongside
      # the build instead of in front of it and costs no critical path; the
      # barrier further down is what turns a drift into a failed job. It writes
      # only to mktemp directories, so it cannot race the build.
      - name: Check the Emscripten probe cache
        id: probe-cache
        background: true
        run: |
          env EM_CACHE="$HOME/.emscripten_cache" \
            ./scripts/check_emscripten_probe_cache.bash

      # Barrier: the link step packages data/mv-sample, the MIDI patch set and
      # the default font into index.data, so all three must be in place before
      # the build starts. A failed background fetch surfaces here and fails the
      # job, exactly as it did when this ran inline.
      - name: Wait for the MV sample engine, MIDI patches and default font
        wait: [mv-sample, freepats, default-font]

      - name: build
        run: |
          ccache --zero-stats
          env EM_CACHE="$HOME/.emscripten_cache" \
            cmake --build wasm-build

      # A page that lost its patch set does not fail the build, it just goes
      # quiet: MIDI is where nearly all RPG2000 BGM lives, and without the
      # instruments a .mid does not even load. The preload's file table lands in
      # index.js, so the deployed page can be asked directly whether it carries
      # them rather than trusting that the flag above still reached the link.
      - name: Check the page carries the MIDI patch set
        run: |
          if ! grep -q '/timidity/timidity.cfg' wasm-build/timidity.js; then
            echo "::error::the wasm page has no MIDI patch set packaged, so" \
              "every .mid BGM/ME would be silent. Check the freepats download" \
              "and -DWASM_MIDI_PATCHES=ON in the cmake step above."
            exit 1
          fi
          echo "MIDI patch set present:"
          ls -la wasm-build/timidity*.data

      # Cloudflare Pages, where `/preview` deploys, refuses any file over
      # 25 MiB, and nothing before this notices: the build succeeds, the page
      # works locally and on GitHub Pages (100 MiB per file), and only the
      # preview deploy fails — which is how the patch set sat in index.data
      # breaking every preview for a day. scripts/pack-timidity-data.py splits
      # the patches to stay under that ceiling; this asserts the result, on
      # exactly the files the deploy jobs publish.
      - name: Check no published file exceeds Cloudflare's 25 MiB limit
        run: |
          limit=$((25 * 1024 * 1024))
          status=0
          for f in wasm-build/index.html wasm-build/index.js \
                   wasm-build/index.wasm wasm-build/index.wasm.map \
                   wasm-build/index.data wasm-build/timidity.js \
                   wasm-build/timidity*.data; do
            [ -f "$f" ] || continue
            size="$(stat -c%s "$f")"
            printf '%-34s %6.1f MiB\n' "${f#wasm-build/}" \
              "$(echo "$size" | awk '{print $1/1048576}')"
            if [ "$size" -gt "$limit" ]; then
              echo "::error::${f#wasm-build/} is over Cloudflare Pages' 25 MiB" \
                "per-file limit, so /preview cannot deploy this page."
              status=1
            fi
          done
          exit $status

      - name: ccache stats
        if: always()
        # `if: always()` can also land here with a background fetch still in
        # flight, when the barrier above failed.
        run: |
          {
            echo "## ccache stats — wasm"
            echo ""
            echo '```'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Barrier: a drifted probe cache means the page below was configured with
      # stale answers, so surface it before the artifact is published.
      - name: Wait for the probe-cache check
        wait: [probe-cache]

      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          # index.wasm.map lets the deployed page symbolicate wasm stack traces
          # (the build links with -gsource-map); it is optional but harmless to
          # ship. All paths sit under wasm-build/, so the artifact stores them at
          # its root (index.html, index.js, index.wasm[.map]) — ready to publish
          # as-is.
          #
          # timidity.js and its timidity*.data packages carry the MIDI patch set
          # (ADR 0031). The page loads timidity.js ahead of the runtime, so
          # dropping them here would not fail the deploy — it would just publish
          # a page whose .mid BGM is silent.
          path: |
            wasm-build/index.html
            wasm-build/index.js
            wasm-build/index.wasm
            wasm-build/index.wasm.map
            wasm-build/index.data
            wasm-build/timidity.js
            wasm-build/timidity*.data

  wio:
    # Build all three Wio Terminal (SAMD51) firmwares with PlatformIO. This is
    # the external check for the port: this environment cannot cross-build or
    # flash the board, so CI compiles it. `wio` is the bring-up firmware -- the
    # display + input HAL and the Arduino sketch, with the mruby interpreter
    # layered on in a later slice (see app/wio/README.md and
    # docs/adr/0005-wio-terminal-port.md). `wio_walk` is the minimal,
    # non-mruby map-walk firmware over the shared engine the iPod nano 7G app
    # runs (docs/adr/0091). `wio_sd_upload` is the throwaway serial-to-SD
    # loader (app/wio/README.md's "No SD card reader?" section). The nano side
    # of the shared walk engine has no CI toolchain at all, so this job is the
    # only place any of the three firmwares is compiled -- the `wio-renode`
    # job below additionally boots them (docs/adr/0094).
    #
    # Temporarily disabled (along with `wio-renode` and `wio-bc2cpp` below)
    # until the bc2cpp cross-build path is more stable.
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # LVGL is vendored as a submodule and linked into the firmware.
          # PlatformIO's own `wio`/`wio_walk`/`wio_sd_upload` envs never
          # reference 3rd/SDL, 3rd/SDL_mixer or 3rd/optcarrot (see
          # scripts/checkout-submodules.bash), so this job skips them too.
          submodules: false
          # Quiet fetch + no post-job credential unset walk; see the `build` job.
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: 3rd/SDL 3rd/SDL_mixer 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        # -q keeps pip to warnings and errors: the resolver's per-package
        # "Collecting/Downloading/Installing" chatter says nothing a green step
        # does not already say.
        run: pip install -q --disable-pip-version-check --upgrade platformio

      - name: Build firmware
        run: |
          pio run -e wio 2>&1 | tee wio-build.log
          pio run -e wio_walk 2>&1 | tee -a wio-build.log
          pio run -e wio_sd_upload 2>&1 | tee -a wio-build.log

      # Turns the flash/RAM usage `pio run` already printed above into a job-
      # summary table -- this project's own ADR 91+ series tracks the Wio
      # Terminal's tight flash/SRAM budget closely enough that CI should
      # surface it on every run. if: always() so a failed build still shows
      # whichever environments got far enough to link before it died.
      - name: wio size report
        if: always()
        run: ruby scripts/wio_size_report.rb wio-build.log

  maix:
    # Build the Maix Amigo (Kendryte K210) port, PSP-pipeline style: the P0
    # hello-world + LCD firmware with PlatformIO (see app/maix/README.md),
    # plus the `maix` mruby cross-build (build_config.rb, driven by
    # scripts/maix_mruby_build.bash) -- the interpreter the firmware links
    # in a later slice, built here so a patch or gem that stops
    # cross-compiling breaks CI the way the `psp` job does for its EBOOT.
    # The `maix-smoke` job below boots the firmware under Renode.
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # The mruby cross-build needs 3rd/mruby, 3rd/uni-algo, 3rd/stb,
          # 3rd/lvgl, 3rd/quickjs, 3rd/mruby-marshal, 3rd/mruby-stringio,
          # 3rd/mruby-onig-regexp (the host half configures it) and
          # 3rd/mgem-list -- everything else (3rd/SDL, 3rd/SDL_mixer,
          # 3rd/effekseer, 3rd/gflags, 3rd/ng-log, 3rd/inicpp, 3rd/optcarrot)
          # goes unused by this job's PlatformIO envs and build_config.rb's
          # `maix` cross-build, so the step below skips them.
          submodules: false
          # Quiet fetch + no post-job credential unset walk; see the `build` job.
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: >-
            3rd/SDL 3rd/SDL_mixer 3rd/effekseer 3rd/gflags 3rd/ng-log
            3rd/inicpp 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install ruby/rake/gperf/bison
        # The mruby cross-build is driven by rake; gperf and bison regenerate
        # mruby-compiler's lexer/grammar when a patch touches either source
        # (patches/mruby-defined-keyword.patch does) -- same reason the `psp`
        # job installs them.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ruby rake gperf bison

      - name: Cache PlatformIO
        # This is also what installs the Kendryte riscv64 toolchain
        # build_config.rb's maix cross build prefers
        # (~/.platformio/packages/toolchain-kendryte210), so the mruby
        # objects and the firmware link use the same compiler.
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        # -q keeps pip to warnings and errors: the resolver's per-package
        # "Collecting/Downloading/Installing" chatter says nothing a green step
        # does not already say.
        run: pip install -q --disable-pip-version-check --upgrade platformio

      - name: Build P0 firmware
        # Installs the Kendryte platform + toolchain the cross-build below
        # resolves from ~/.platformio (build_config.rb prefers it), and
        # proves the bare toolchain produces a binary on its own.
        run: pio run -e maix_amigo

      - name: Upload P0 firmware
        # Uploaded immediately, before any later `pio run` below: separate
        # invocations prune each other's build directories (confirmed by a
        # real CI run -- the first env's firmware.bin was gone at artifact
        # time), so each env's outputs go safe the moment they exist, under
        # their own artifact name. The binaries: flash a .bin with kflash
        # (or boot/GDB an .elf) -- the PSP pipeline's EBOOT artifact, same
        # idea.
        uses: actions/upload-artifact@v7
        with:
          name: maix-amigo-firmware
          path: |
            .pio/build/maix_amigo/firmware.bin
            .pio/build/maix_amigo/firmware.elf
          if-no-files-found: error

      - name: Build maix mruby cross lib + uni-algo
        # The interpreter and Unicode tables the maix_rgss_boot firmware
        # links below (platformio.ini's MAIX_MRUBY_BUILD_DIR /
        # MAIX_UNIALGO_LIB_DIR pair). Same shape as the `psp` job's EBOOT
        # driving its own cross-build: a patch/gem that stops
        # cross-compiling breaks this job, not just the emulator one.
        run: |
          scripts/maix_mruby_build.bash
          scripts/maix_unialgo_build.bash

      - name: Build mruby-linking firmware
        # Links libmruby.a + libuni-algo.a + LVGL and boots the interpreter
        # (see app/maix/README.md) -- the link itself is the measurement:
        # pio prints the RAM/flash use, and the map below carries symbols.
        env:
          MAIX_MRUBY_BUILD_DIR: ${{ github.workspace }}/build-maix-mruby/maix
          MAIX_UNIALGO_LIB_DIR: ${{ github.workspace }}/build-maix-unialgo
        run: pio run -e maix_rgss_boot

      - name: Upload mruby-linking firmware
        # Same prune-proofing as the P0 upload above: safe immediately.
        uses: actions/upload-artifact@v7
        with:
          name: maix-rgss-boot-firmware
          path: |
            .pio/build/maix_rgss_boot/firmware.bin
            .pio/build/maix_rgss_boot/firmware.elf
            .pio/build/maix_rgss_boot/firmware.map
          if-no-files-found: error

      - name: Check game data matches its generator
        # data/maix-hello is committed (CI has no business regenerating
        # test data with unpinned tools); this fails if the generator and
        # the data drift apart, pointing at the one to re-run. README.md is
        # hand-authored, not generated, so it is excluded from the diff.
        run: |
          ruby scripts/gen-maix-hello-game.rb /tmp/maixhello-check
          diff -r -x README.md /tmp/maixhello-check data/maix-hello && echo "maix-hello in sync"

      - name: Build game firmware
        # Boots data/maix-hello to its title screen (see app/maix/README.md):
        # display, input, interpreter, flash-resident game, one main_loop
        # per Arduino loop() iteration.
        env:
          MAIX_MRUBY_BUILD_DIR: ${{ github.workspace }}/build-maix-mruby/maix
          MAIX_UNIALGO_LIB_DIR: ${{ github.workspace }}/build-maix-unialgo
        run: pio run -e maix_game

      - name: Upload game firmware
        # Same prune-proofing as the uploads above: safe immediately.
        uses: actions/upload-artifact@v7
        with:
          name: maix-game-firmware
          path: |
            .pio/build/maix_game/firmware.bin
            .pio/build/maix_game/firmware.elf
            .pio/build/maix_game/firmware.map
          if-no-files-found: error

      - name: Build SD-boot game firmware
        # Same game firmware but reading game data from the microSD card
        # (/sd/maixgame) instead of the flash-embedded copy (see the
        # maix_game_sd environment): proves the SD-backed newlib layer and
        # the GAME_DIR switch compile -- runtime proof needs a physical
        # card (Renode models no SD controller).
        env:
          MAIX_MRUBY_BUILD_DIR: ${{ github.workspace }}/build-maix-mruby/maix
          MAIX_UNIALGO_LIB_DIR: ${{ github.workspace }}/build-maix-unialgo
        run: pio run -e maix_game_sd

      - name: Upload SD-boot game firmware
        # Same prune-proofing as the uploads above: safe immediately.
        uses: actions/upload-artifact@v7
        with:
          name: maix-game-sd-firmware
          path: |
            .pio/build/maix_game_sd/firmware.bin
            .pio/build/maix_game_sd/firmware.elf
            .pio/build/maix_game_sd/firmware.map
          if-no-files-found: error

      - name: Compile SD syscall layer
        # maix_sd_syscalls.cxx is gate-off by default (see the file), so this
        # rebuilds the boot env once with MAIX_WITH_SD to prove the real code
        # compiles -- runtime proof needs a physical card (Renode models no
        # SD controller). Placed after the uploads: like every other second
        # invocation, it may prune the build dirs it does not need.
        env:
          MAIX_MRUBY_BUILD_DIR: ${{ github.workspace }}/build-maix-mruby/maix
          MAIX_UNIALGO_LIB_DIR: ${{ github.workspace }}/build-maix-unialgo
          PLATFORMIO_BUILD_FLAGS: -DMAIX_WITH_SD
        run: pio run -e maix_rgss_boot

      - name: Build SD uploader
        # Throwaway serial-to-SD loader (see app/maix/README.md): no LVGL,
        # no mruby, just Maixduino SD over SPI0. Uploaded immediately like
        # every other env, for the same prune-proofing reason.
        run: pio run -e maix_sd_upload

      - name: Upload SD uploader
        uses: actions/upload-artifact@v7
        with:
          name: maix-sd-upload-firmware
          path: |
            .pio/build/maix_sd_upload/firmware.bin
            .pio/build/maix_sd_upload/firmware.elf
          if-no-files-found: error

  maix-smoke:
    # Headless run checks for the Maix Amigo firmwares: boot the mruby-linking
    # maix_rgss_boot firmware under stock Renode (which ships the K210 SoC
    # description -- dual RV64, UARTHS, CLINT, PLIC -- so no from-source
    # emulator build the way `wio-renode` needs) and look for the bring-up
    # markers: REACHED setup()/loop() hooks plus the mrb_open/eval lines the
    # firmware's mruby probe prints over its Serial. Then boot the P0
    # maix_amigo firmware the same way with LCD capture on, and replay its
    # ST7789 stream into a framebuffer pixel check (see app/maix/README.md
    # "LCD capture"). Asserts all of it.
    needs: maix
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Only scripts/ + app/maix/renode/ are read here (the firmware is
          # rebuilt below, the emulator is downloaded) -- nothing from 3rd/.
          submodules: false
          show-progress: false
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Download firmware
        # The maix_rgss_boot ELF the `maix` job linked (plus its map) --
        # PSP-smoke's EBOOT download, same idea. No PlatformIO or rebuild
        # here: the boot script only needs setup/loop symbol addresses,
        # which come from riscv64-unknown-elf-nm below.
        uses: actions/download-artifact@v8
        with:
          name: maix-rgss-boot-firmware
          path: firmware

      - name: Install riscv nm
        # scripts/maix_renode_boot.bash resolves setup()/loop() addresses
        # with riscv64-unknown-elf-nm (PATH first, PlatformIO's toolchain
        # as fallback -- absent in this job by design, so PATH must hit).
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q binutils-riscv64-unknown-elf

      - name: Cache Renode
        uses: actions/cache@v6
        with:
          # Keep in sync with the download below (single place stating the
          # pinned release); the key also hashes the boot inputs, so a
          # script/repl/model change re-runs against a fresh extract.
          path: /tmp/maix-renode
          key: renode-maix-${{ runner.os }}-1.17.0-${{ hashFiles('app/maix/renode/**', 'scripts/maix_renode_boot.bash') }}

      - name: Download Renode
        # Stock release binary (linux-portable needs no .NET install); the
        # K210 platform description it carries is what gets booted, so unlike
        # `wio-renode` nothing is compiled here. The tree stays whole: the
        # `renode` binary only runs next to its own platforms/scripts/dlls.
        # (Version duplicated from the cache key above -- keep them in sync.)
        run: |
          if [ ! -x /tmp/maix-renode/renode_1.17.0-portable/renode ]; then
            mkdir -p /tmp/maix-renode
            curl -fsSL -o /tmp/maix-renode/renode.tar.gz \
              https://github.com/renode/renode/releases/download/v1.17.0/renode-1.17.0.linux-portable.tar.gz
            tar xzf /tmp/maix-renode/renode.tar.gz -C /tmp/maix-renode
          fi
          /tmp/maix-renode/renode_1.17.0-portable/renode --version

      - name: Boot firmware under Renode
        run: |
          elf="$(find firmware -name firmware.elf | head -n 1)"
          test -n "$elf" || { echo "::error::no firmware.elf in artifact:"; find firmware; exit 1; }
          out="$(RENODE_BIN=/tmp/maix-renode/renode_1.17.0-portable/renode MAIX_SPI_LOG="$GITHUB_WORKSPACE/maix-spi-rgss.log" scripts/maix_renode_boot.bash "$elf")"
          echo "$out"
          echo "$out" | grep -q "REACHED setup()" || { echo "::error::did not reach setup()"; exit 1; }
          echo "$out" | grep -q "REACHED loop()" || { echo "::error::did not reach loop()"; exit 1; }
          echo "$out" | grep -q "mrb_open ok" || { echo "::error::mruby did not open"; exit 1; }
          echo "$out" | grep -q "eval -> maix-ruby-alive" || { echo "::error::mruby eval failed"; exit 1; }

      - name: Check red framebuffer
        # The boot firmware paints solid red through LVGL itself before the
        # pumps above return (see app/maix/README.md): the capture from that
        # same run must decode to a red screen. Red arrives byte-swapped
        # (the driver's SWAP_16), hence 00f8, not f800. 480x320 (not
        # 320x240) and a lower fraction since app/maix/maix_display.cxx's
        # panel-centering fix (PR #1747): the LVGL canvas is still 320x240,
        # now legitimately centered in the full 480x320 panel with a
        # cleared margin around it, diluting the red fraction of the whole
        # captured frame. Measured directly under this same Renode setup
        # (scripts/maix_renode_boot.bash) after that fix: match=0.375,
        # distinct=2 -- both thresholds below with headroom, not at the
        # exact measured value.
        run: |
          python3 scripts/maix_lcd_decode.py maix-spi-rgss.log maix-frame-rgss.ppm \
            --expect-color 00f8 --min-fraction 0.35 --min-colors 2 --expect-size 480x320

      - name: Download P0 firmware
        uses: actions/download-artifact@v8
        with:
          name: maix-amigo-firmware
          path: firmware-p0

      - name: Capture LCD frame under Renode
        # Option C (see app/maix/README.md "LCD capture"): the DMA hook
        # replays each LCD transfer into $MAIX_SPI_LOG with its live DC bit
        # while the P0 firmware (which actually inits the panel, unlike the
        # mruby boot above) runs, then the decoder below replays the ST7789
        # stream into a framebuffer and checks it pixel by pixel.
        run: |
          elf="$(find firmware-p0 -name firmware.elf | head -n 1)"
          test -n "$elf" || { echo "::error::no P0 firmware.elf in artifact:"; find firmware-p0; exit 1; }
          RENODE_BIN=/tmp/maix-renode/renode_1.17.0-portable/renode \
          MAIX_SPI_LOG="$GITHUB_WORKSPACE/maix-spi.log" \
            scripts/maix_renode_boot.bash "$elf" 00:00:08

      - name: Decode LCD capture
        # Exits nonzero (failing the job) when the frame is not a blue
        # 320x240 screen carrying white text: the MAIX-LCD line it prints
        # is the human-readable record.
        run: |
          python3 scripts/maix_lcd_decode.py maix-spi.log maix-frame.ppm \
            --expect-color 001f --min-fraction 0.45 --min-colors 3 --expect-size 320x240

      - name: Download game firmware
        uses: actions/download-artifact@v8
        with:
          name: maix-game-firmware
          path: firmware-game

      - name: Boot game to title under Renode
        # The payoff slice: a real (if tiny) game boots to its title screen
        # -- scene marker on Serial plus the title pixels below. The game
        # lives in flash (app/maix/embed_game.py), so no SD card is needed,
        # which is also why this works at all under Renode.
        run: |
          elf="$(find firmware-game -name firmware.elf | head -n 1)"
          test -n "$elf" || { echo "::error::no game firmware.elf in artifact:"; find firmware-game; exit 1; }
          out="$(RENODE_BIN=/tmp/maix-renode/renode_1.17.0-portable/renode MAIX_SPI_LOG="$GITHUB_WORKSPACE/maix-spi-game.log" scripts/maix_renode_boot.bash "$elf" 00:00:10)"
          echo "$out"
          echo "$out" | grep -q "maix-game: boot ok" || { echo "::error::game did not boot"; exit 1; }
          echo "$out" | grep -q "scene: RPG2k::Scene::Title" || { echo "::error::never reached title"; exit 1; }

      - name: Check title framebuffer
        # Teal background (byte-swapped on the wire, hence 1004), white
        # border and menu text, window shades: at least four distinct
        # colors or the title UI did not really draw. 480x320 (not
        # 320x240) and a lower fraction for the same panel-centering
        # reason as the "Check red framebuffer" step above -- measured
        # directly under this same Renode setup: match=0.339, distinct=8.
        run: |
          python3 scripts/maix_lcd_decode.py maix-spi-game.log maix-frame-game.ppm \
            --expect-color 1004 --min-fraction 0.30 --min-colors 4 --expect-size 480x320

  wio-renode:
    # Boots the three firmwares the `wio` job above compiles under Renode
    # (docs/adr/0094-wio-terminal-renode-emulator.md), far enough to prove
    # the CPU actually runs its own setup()/loop() rather than only
    # compiling -- this is ADR 94 P5's "does this run in CI" question,
    # answered for the parts that are fast and bounded (P1-P3). It also runs
    # the ILI9341 display peripheral's own regression test
    # (app/wio/renode/lcd_smoke_test.resc), an actual pixel-correctness
    # check, not just a boot check.
    #
    # Not covered here: a full firmware-driven render (wio_walk reading a
    # real SD card and drawing an actual map tile). Both wio and wio_walk's
    # tile/frame push goes through SPIClass's DMA-driven bulk transfer
    # (Adafruit_ZeroDMA), which this platform does not model yet (P2's
    # DMAC gap, app/wio/renode/README.md) -- a real, understood, separate
    # piece of work, not a performance concern like the two bugs below were.
    #
    # Temporarily disabled (see `wio` job above) until the bc2cpp cross-build
    # path is more stable.
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # LVGL is vendored as a submodule and linked into the firmware. Same
          # PlatformIO envs (wio/wio_walk/wio_sd_upload) as the `wio` job, so
          # the same submodules go unused here; see its "Init submodules" step.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: 3rd/SDL 3rd/SDL_mixer 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-dotnet@v6
        with:
          # Building Renode from source (below) needs the SDK; the portable
          # release binary this repo's own dev docs point at for P1/P2-only
          # use bundles just the runtime, which is not enough to compile a
          # new peripheral into it.
          dotnet-version: "8.0.x"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install -q --disable-pip-version-check --upgrade platformio

      - name: Build firmware
        run: |
          pio run -e wio
          pio run -e wio_walk
          pio run -e wio_sd_upload

      - name: Install mtools/dosfstools/ImageMagick
        # mtools/dosfstools: scripts/wio_renode_sdcard.bash's own smoke test
        # below. ImageMagick: reading pixels back out of the ILI9341 model's
        # PNG dump.
        run: sudo apt-get update -q && sudo apt-get install -y -q mtools dosfstools imagemagick

      - name: Cache the Renode build
        id: renode-cache
        uses: actions/cache@v6
        with:
          path: /tmp/wio-renode-build
          # Keyed on the pinned commit scripts/wio_renode_build.bash checks
          # out and on the peripheral sources it copies in -- either
          # changing invalidates the cache; nothing else does, so this is a
          # cache hit on almost every run.
          key: wio-renode-${{ runner.os }}-${{ hashFiles('scripts/wio_renode_build.bash', 'app/wio/renode/peripherals/**') }}

      - name: Build Renode with the Wio Terminal peripherals
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: scripts/wio_renode_build.bash /tmp/wio-renode-build

      - name: Boot each firmware under Renode
        env:
          RENODE_BIN: /tmp/wio-renode-build/renode-src/renode
        run: |
          "$RENODE_BIN" --version
          for env in wio wio_walk wio_sd_upload; do
            echo "::group::$env"
            out="$(scripts/wio_renode_boot.bash ".pio/build/$env/firmware.elf" "00:00:00.300")"
            echo "$out"
            echo "$out" | grep -q "REACHED setup()" || { echo "::error::$env did not reach setup()"; exit 1; }
            echo "$out" | grep -q "REACHED loop()" || { echo "::error::$env did not reach loop()"; exit 1; }
            echo "::endgroup::"
          done

      - name: ILI9341 display peripheral regression test
        env:
          RENODE_BIN: /tmp/wio-renode-build/renode-src/renode
        run: |
          rm -f /tmp/wio_lcd_smoke_test.png
          "$RENODE_BIN" --disable-gui --console --plain \
            -e "include @app/wio/renode/lcd_smoke_test.resc" -e "quit" < /dev/null
          # apt's "imagemagick" package on ubuntu-24.04 is IM6, which has no
          # `magick` binary at all (that unified CLI is IM7-only, a separate
          # package); IM7 installs, in turn, without the `convert` name.
          # Support either.
          im_convert=convert
          command -v magick >/dev/null 2>&1 && im_convert=magick
          check() {
            local got
            got="$("$im_convert" /tmp/wio_lcd_smoke_test.png -format '%[pixel:p{'"$1"'}]' info:)"
            [ "$got" = "$2" ] || { echo "::error::pixel {$1} was $got, expected $2"; exit 1; }
          }
          check "8,0" "srgb(255,0,0)"   # inside the CASET/PASET window, red row
          check "8,1" "srgb(0,0,255)"   # inside the window, blue row
          check "20,0" "srgb(0,0,0)"    # outside the window, untouched

      - name: SD card image tooling smoke test
        # scripts/wio_renode_sdcard.bash itself, not a firmware boot (see
        # the job comment for why the full SD-backed boot is out of scope
        # here): builds a real FAT image and confirms mtools can read back
        # what it wrote.
        run: |
          mkdir -p /tmp/wio_renode_sdcard_check
          echo hello > /tmp/wio_renode_sdcard_check_input.txt
          scripts/wio_renode_sdcard.bash /tmp/wio_renode_sdcard_check \
            /tmp/wio_renode_sdcard_check_input.txt:/RPG2kWalk/test.txt
          mdir -i /tmp/wio_renode_sdcard_check/sdcard.img ::/RPG2kWalk | grep -q test

  m5stack:
    # Build the M5Stack Core (ESP32) P1 HAL bring-up firmware with
    # PlatformIO (see app/m5stack/README.md, docs/adr/0157). Unlike Wio/Maix,
    # espressif32 ships this board natively, so there is no custom
    # boards/*.json step here -- the same reason this job has no counterpart
    # to maix's own "add_amigo_variant.py" step. app/m5stack is its own
    # standalone PlatformIO project (not another environment in the repo
    # root's platformio.ini -- see that directory's own platformio.ini for
    # why: it builds Arduino as an ESP-IDF component, which takes over the
    # project root's CMakeLists.txt and cannot honor build_src_filter,
    # both fatal to sharing the root project the way Wio/Maix do), so every
    # `pio` command here runs with app/m5stack as its working directory.
    #
    # Disabled: this job (and `m5stack-qemu` below, which needs its firmware
    # artifact) does not currently run in CI.
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # LVGL is vendored as a submodule and linked into the firmware; see
          # the `wio` job's "Init submodules" step for what else this build
          # never touches.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: 3rd/SDL 3rd/SDL_mixer 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-m5stack-${{ runner.os }}-${{ hashFiles('app/m5stack/platformio.ini', 'app/m5stack/sdkconfig.defaults') }}
          restore-keys: pio-m5stack-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install -q --disable-pip-version-check --upgrade platformio

      - name: Build firmware
        working-directory: app/m5stack
        run: pio run -e m5stack

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: m5stack-firmware
          path: |
            app/m5stack/.pio/build/m5stack/firmware.bin
            app/m5stack/.pio/build/m5stack/firmware.elf
            app/m5stack/.pio/build/m5stack/bootloader.bin
            app/m5stack/.pio/build/m5stack/partitions.bin

  m5stack-qemu:
    # Boots the m5stack firmware the job above compiles under Espressif's own
    # QEMU fork (docs/adr/0157-m5stack-core-qemu-emulator.md), the same
    # "does this run in CI" question wio-renode answers for the Wio Terminal.
    # Asserts the real bar: the firmware's own setup() actually ran (LVGL +
    # TFT_eSPI + button HAL init) and loop() scanned the buttons --
    # scripts/m5stack_qemu_boot.bash greps the real "m5stack: setup
    # complete" and "Keys: ..." lines out of the QEMU serial log, not just a
    # boot banner. Getting here needed app/m5stack's own platformio.ini to
    # build Arduino as an ESP-IDF component rather than PlatformIO's default
    # precompiled-libs mode -- see the ADR's "Status, revised" section.
    #
    # Also builds QEMU from source with app/m5stack/qemu/patches/
    # (scripts/m5stack_qemu_build.bash) -- Espressif's own prebuilt release
    # cannot carry either of this fork's new downstream devices -- and
    # checks two things beyond "the firmware ran": the actual rendered
    # ILI9341 framebuffer (m5stack-display.patch), the same way wio-renode's
    # own ILI9341 pixel checks answer it for the Wio Terminal; and a FACES
    # kit Gamepad Face's buttons actually reaching RGSS::Input's bitmask
    # through a simulated I2C device (m5stack-gamepad.patch).
    needs: m5stack
    # Disabled along with `m5stack` above.
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: m5stack-firmware
          path: app/m5stack/.pio/build/m5stack

      - name: Install esptool, QEMU's build deps
        run: |
          pip install -q --disable-pip-version-check esptool
          sudo apt-get update -q && sudo apt-get install -y -q \
            ninja-build meson pkg-config libglib2.0-dev libpixman-1-dev libgcrypt20-dev libslirp-dev

      - name: Cache the QEMU build
        id: qemu-cache
        uses: actions/cache@v6
        with:
          path: /tmp/m5stack-qemu-build
          # Keyed on the pinned tag scripts/m5stack_qemu_build.bash checks
          # out and on the patch it applies -- either changing invalidates
          # the cache; nothing else does, so this is a cache hit on almost
          # every run (mirrors wio-renode's own Renode build cache).
          key: m5stack-qemu-build-${{ runner.os }}-${{ hashFiles('scripts/m5stack_qemu_build.bash', 'app/m5stack/qemu/patches/**') }}

      - name: Build QEMU with M5Stack display support
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: scripts/m5stack_qemu_build.bash /tmp/m5stack-qemu-build

      - name: Boot under QEMU
        env:
          M5STACK_QEMU_BIN: /tmp/m5stack-qemu-build/build/qemu-system-xtensa
          M5STACK_DISPLAY_DUMP: /tmp/m5stack_display.ppm
        run: scripts/m5stack_qemu_boot.bash app/m5stack/.pio/build/m5stack

      - name: Verify the display actually rendered
        # A plain "the dump file exists" check (scripts/m5stack_qemu_boot.bash's
        # own bar) only proves the device was reachable, not that real pixels
        # landed in it -- an all-white (or otherwise uniform) framebuffer would
        # still pass that bar. This additionally confirms the firmware's own
        # LVGL "Keys: A B C" label actually drew: a majority-white background
        # (LVGL's default screen bg) plus a real second color for the label
        # text itself.
        run: |
          python3 - <<'EOF'
          import collections

          path = "/tmp/m5stack_display.ppm"
          with open(path, "rb") as f:
              magic = f.readline().strip()
              dims = f.readline().split()
              maxval = f.readline().strip()
              assert magic == b"P6", f"unexpected PPM magic {magic!r}"
              width, height = (int(x) for x in dims)
              assert maxval == b"255"
              data = f.read()

          assert len(data) == width * height * 3, (
              f"short read: {len(data)} bytes for a {width}x{height} frame"
          )

          counts = collections.Counter(
              data[i:i + 3] for i in range(0, len(data), 3)
          )
          total = width * height
          white = counts[b"\xff\xff\xff"]
          non_white = total - white

          print(f"{path}: {width}x{height}, {len(counts)} distinct colors, "
                f"{white} white / {non_white} non-white pixels")

          assert len(counts) > 1, "framebuffer is a single uniform color"
          assert white > total * 0.5, (
              f"expected a majority-white LVGL background, got {white}/{total}"
          )
          assert non_white > 0, "no non-background (label text) pixels found"
          EOF

      - name: Boot under QEMU with a Gamepad Face attached
        # A second boot, not folded into the one above: M5STACK_GAMEPAD_STATE
        # simulates a FACES kit Gamepad Face reporting Up+Start held for the
        # whole run (0x7e -- active low, bit0 and bit7 clear; see
        # hw/i2c/esp32_faces_gamepad.c's own header comment in
        # app/m5stack/qemu/patches/m5stack-gamepad.patch for the bit layout)
        # via this fork's own downstream I2C device, exercised through the
        # real HAL's real I2C probe+read (mruby-rgss/src/m5stack.cxx), not a
        # unit test of the device in isolation.
        env:
          M5STACK_QEMU_BIN: /tmp/m5stack-qemu-build/build/qemu-system-xtensa
          M5STACK_GAMEPAD_STATE: "7e"
          M5STACK_QEMU_CACHE_DIR: /tmp/m5stack-qemu-gamepad
        run: scripts/m5stack_qemu_boot.bash app/m5stack/.pio/build/m5stack

      - name: Verify the Gamepad Face input was actually read
        # scripts/m5stack_qemu_boot.bash's own exit code only proves the
        # firmware reached loop() -- not that the specific buttons this step
        # injected made it all the way through I2C probe -> read -> bit
        # decode -> RGSS key mask -> the "Keys: ..." status line. Check the
        # real serial log for exactly that, the same "does it actually show
        # up" bar the display check above holds itself to.
        run: |
          log=/tmp/m5stack-qemu-gamepad/serial.log
          keys_line="$(grep '^Keys:' "$log" | tail -1)"
          echo "$keys_line"
          [ -n "$keys_line" ] || { echo "::error::no Keys: line in $log"; exit 1; }
          echo "$keys_line" | grep -qw "Up" || { echo "::error::Up not reported (Gamepad Face D-pad not read)"; exit 1; }
          echo "$keys_line" | grep -qw "Start" || { echo "::error::Start not reported (Gamepad Face Select/Start not read)"; exit 1; }

  wio-bc2cpp:
    # The `wio_rgss_boot` firmware is the only build that exercises
    # RPGMAKER_BC2CPP=1 (build_config.rb) and, baseline and bc2cpp alike, the
    # only one that overflows the real 507904-byte FLASH region -- which is why
    # it has never been built in CI: it needs a from-scratch MRUBY_TARGET=wio
    # cross-build plus a standalone ARM uni-algo (platformio.ini's own comment
    # on the env). scripts/wio_bc2cpp_measure.bash produces both configurations'
    # links, and scripts/wio_overflow_report.rb turns their linker maps -- `ld`
    # writes a complete firmware.map even when it refuses to emit the ELF -- into
    # the A/B overflow statistics the ADR 0104-0144 series has so far recorded by
    # hand. See docs/adr/0152.
    #
    # Advisory: overflowing is the expected, currently-unfixable outcome, so the
    # report runs under `if: always()` and never fails the job on the number. The
    # job fails only if the cross-build itself breaks (a patch that stops
    # applying, a toolchain change) or the report tooling breaks.
    #
    # Temporarily disabled (see `wio` job above) until the bc2cpp cross-build
    # path is more stable.
    if: false
    runs-on: ubuntu-24.04
    # Two ARM cross-builds on a cache miss; well under the 360-minute runner
    # default the other jobs rely on, but enough to not cut a real build short.
    timeout-minutes: 180
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # The wio mruby cross-build needs 3rd/mruby, 3rd/uni-algo, 3rd/lvgl,
          # 3rd/mruby-marshal, 3rd/mruby-stringio, 3rd/mruby-onig-regexp and
          # 3rd/mgem-list -- plus 3rd/quickjs and 3rd/stb, which rake's own
          # bootstrap "host" sub-build (mrbc) needs regardless of the target:
          # rpg_maker_gems only gates mruby-mvjs behind `single_format_only`
          # (build_config.rb's `%w[psp wio maix]`), and conf.name is "host"
          # for that sub-build, never one of those three -- confirmed for
          # real by the `psp` job's own "fatal error: quickjs.h: No such file
          # or directory" failure compiling mruby-mvjs's mvcanvas.cxx there.
          # Everything else (3rd/SDL, 3rd/SDL_mixer, 3rd/effekseer,
          # 3rd/gflags, 3rd/ng-log, 3rd/inicpp, 3rd/optcarrot) goes genuinely
          # unused, so the step below skips only those.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: >-
            3rd/SDL 3rd/SDL_mixer 3rd/effekseer 3rd/gflags 3rd/ng-log
            3rd/inicpp 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install ruby/rake/gperf/bison
        # The mruby cross-build is driven by rake; gperf and bison regenerate
        # mruby-compiler's lexer/grammar when a patch touches either source
        # (patches/mruby-defined-keyword.patch does), the same reason the psp
        # job installs them -- both were confirmed missing by a real run there.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ruby rake gperf bison

      - name: Cache PlatformIO
        # This is also what installs the pinned arm-none-eabi 14.2.1 toolchain
        # build_config.rb's wio cross build prefers (~/.platformio/packages/
        # toolchain-gccarmnoneeabi), so the mruby objects and the firmware link
        # use the same compiler.
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install -q --disable-pip-version-check --upgrade platformio

      - name: Compute wio cross-build cache key
        id: wio-cache-key
        run: |
          {
            for path in \
              build_config.rb \
              tools/bc2cpp \
              mruby-lcf-compiled \
              mruby-rgss-compiled \
              mruby-rpg2k-compiled \
              mruby-rgss \
              mruby-lcf \
              mruby-rpg2k \
              app/wio/hal-wio-io \
              patches \
              platformio.ini \
              3rd/mruby \
              3rd/mgem-list; do
              if git rev-parse --verify "HEAD:$path" >/dev/null 2>&1; then
                printf '%s ' "$path"
                git rev-parse "HEAD:$path"
              fi
            done
          } | sha256sum | awk '{print "digest=" $1}' >> "$GITHUB_OUTPUT"

      - name: Cache the wio cross-build
        # A hit is provably current: the key hashes Git tree IDs for every input
        # that feeds the generated libmruby.a, so any change produces a different
        # key and a clean rebuild. Computing it before the cache action avoids
        # hashFiles failing when the cache action evaluates its post-job key.
        # That is deliberately the guard against the stale-build failure mode
        # docs/adr/0142/0143 document -- scripts/wio_bc2cpp_measure.bash
        # also wipes each variant's build dir before building it -- and the two
        # links always re-run, so the maps reflect the current app/LVGL too.
        uses: actions/cache@v6
        with:
          path: /tmp/wio-bc2cpp
          key: wio-bc2cpp-${{ runner.os }}-${{ steps.wio-cache-key.outputs.digest }}

      - name: Build baseline + bc2cpp wio_rgss_boot
        run: scripts/wio_bc2cpp_measure.bash /tmp/wio-bc2cpp

      - name: wio bc2cpp flash overflow report
        if: always()
        run: |
          ruby scripts/wio_overflow_report.rb \
            baseline:/tmp/wio-bc2cpp/baseline/firmware.map \
            bc2cpp:/tmp/wio-bc2cpp/bc2cpp/firmware.map

  nano7-qemu:
    # A real ARM Cortex-A8 instruction stream for the iPod nano 7G walk app
    # (docs/adr/0103), complementing app/nano7/host's native-host build
    # (docs/adr/0102, the `nano7_host_smoke` ctest in the `build` job below):
    # builds app/nano7/rpg2k_walk/rpg2k_walk.c itself with the same
    # arm-none-eabi-gcc -mcpu=cortex-a8 NanoApps' own sdk/hb_app.mk uses,
    # boots it under qemu-system-arm's `cortex-a8` CPU model on the
    # `realview-pb-a8` machine -- a real PL110 display controller QEMU
    # already ships, not a new peripheral written for this repo the way
    # `wio-renode` above needed two -- and checks both that the real PL110
    # framebuffer shows a real rendered map (screendump, pixel-checked, the
    # same way `wio-renode`'s lcd_smoke_test checks its own display model)
    # and that the Cortex-A8 PMU's cycle counter gives a genuine, working
    # per-frame cost signal (printed, not asserted on -- see the ADR for why
    # that's a comparative signal rather than a pass/fail threshold).
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # No submodule this job needs: it links only this repo's own
          # app/nano7 and app/shared/rpg2k_walk sources against a bare-metal
          # shim, nothing from 3rd/.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi qemu-system-arm unar

      - name: Download Nepheshel
        run: ./scripts/download-nepheshel.bash

      - name: Export a real map
        run: |
          mkdir -p /tmp/nano7_qemu_export
          ruby scripts/export_nano7_map.rb --target nano7 \
            data/Nepheshel206beta/Nepheshel206Nbeta 1 /tmp/nano7_qemu_export

      - name: Build the Cortex-A8 image
        run: |
          scripts/nano7_qemu_build.bash \
            /tmp/nano7_qemu_export/map.bin /tmp/nano7_qemu_export/tiles.bin \
            /tmp/nano7_walk_qemu.elf

      - name: Boot under QEMU and screendump the real PL110 framebuffer
        run: |
          scripts/nano7_qemu_run.bash /tmp/nano7_walk_qemu.elf \
            /tmp/nano7_qemu_frame.ppm /tmp/nano7_qemu_uart.log

      - name: Check the rendered frame and print the cycle-count log
        run: |
          grep "NANO7-QEMU" /tmp/nano7_qemu_uart.log || true
          ruby scripts/nano7_qemu_smoke_check.rb /tmp/nano7_qemu_frame.ppm /tmp/nano7_qemu_uart.log

  psp:
    # Build the PSP EBOOT bring-up with the pspdev toolchain. Like the Wio job,
    # this is the external check for the port's HAL: this environment cannot
    # cross-build or flash a PSP, so CI compiles it. Builds the LVGL display +
    # input HAL and the entry-point sketch into EBOOT.PBP; the mruby interpreter
    # is layered on in a later slice (see app/psp/README.md and
    # docs/adr/0010-psp-port.md).
    #
    # Gated on the `changes` job above: this build (and the two smoke jobs
    # below that need its EBOOT) only runs when app/psp itself changed, or on
    # a manual `workflow_dispatch` run, which always builds everything.
    needs: changes
    if: >-
      ${{ github.event_name != 'issue_comment' &&
          (github.event_name == 'workflow_dispatch' || needs.changes.outputs.psp == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # app/psp/CMakeLists.txt add_subdirectory()s only 3rd/lvgl and
          # 3rd/uni-algo, and its psp mruby cross-build (build_config.rb) pulls
          # in 3rd/mruby, 3rd/mruby-marshal, 3rd/mruby-onig-regexp,
          # 3rd/mruby-stringio, 3rd/mgem-list (cmake/build-mruby.cmake, shared
          # with the desktop build) and 3rd/stb (mruby-rgss's stbi_load_from_memory
          # decode path, STBI_NO_STDIO below). It also needs 3rd/quickjs: rake's
          # own bootstrap "host" sub-build (mrbc) always builds mruby-mvjs
          # (rpg_maker_gems only gates that gem behind `single_format_only`,
          # and conf.name is "host" there, never "psp") -- confirmed for real
          # by a CI run failing on "fatal error: quickjs.h: No such file or
          # directory" compiling mruby-mvjs's mvcanvas.cxx. It never touches
          # 3rd/SDL, 3rd/SDL_mixer, 3rd/gflags, 3rd/ng-log, 3rd/effekseer or
          # 3rd/inicpp.
          submodules: false
          # Quiet fetch + no post-job credential unset walk; see the `build` job.
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: >-
            3rd/SDL 3rd/SDL_mixer 3rd/gflags 3rd/ng-log
            3rd/effekseer 3rd/inicpp 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      - name: Download Unicode mapping tables
        # mruby-lcf/cp932_to_unicode.rb and mruby-rgss/gen_shinonome_data.rb
        # (both rake-time code generators, run as part of the psp mruby
        # cross-build below) read $cp932_table / $jis0208_table -- normally
        # set by the nix devshell's fetchurl derivations (flake.nix), which
        # this bare-container job does not have. scripts/native-build-without-nix.bash
        # solves the same gap for a non-nix host build the same way: download
        # and verify against the flake's own sha256 pins, so the build
        # consumes the same bytes Nix would hand it, not a lookalike.
        run: |
          mkdir -p .native-build-tables
          fetch_table() {
            local url="$1" dest="$2" want="$3"
            curl -fsSL -o "$dest" "$url"
            local got
            got="$(python3 -c 'import hashlib,base64,sys; print(base64.b64encode(hashlib.sha256(open(sys.argv[1],"rb").read()).digest()).decode())' "$dest")"
            if [ "$got" != "$want" ]; then
              echo "hash mismatch for $dest" >&2
              echo "  flake.nix pins $want" >&2
              echo "  downloaded     $got" >&2
              exit 1
            fi
          }
          fetch_table \
            'https://www.unicode.org/Public/MAPPINGS/VENDORS/MICSFT/WindowsBestFit/bestfit932.txt' \
            .native-build-tables/bestfit932.txt \
            'JhTP6jXDyGxB0zGYeTqEykTt7jzw7gATphpD+6Ts4zE='
          fetch_table \
            'https://www.unicode.org/Public/MAPPINGS/OBSOLETE/EASTASIA/JIS/JIS0208.TXT' \
            .native-build-tables/JIS0208.TXT \
            'HFcYcEV/Gcl3IGMfqD7kkVSalroUNtoSlnhqZ9hjLoc='

      - name: Build EBOOT (pspdev container)
        # The pspdev image ships psp-gcc, cmake and the psp-cmake wrapper (which
        # points CMake at the pspdev toolchain and provides create_pbp_file), but
        # not Ruby and not a native (x86_64) compiler: the psp mruby cross-build
        # (build_config.rb's `psp` MRuby::CrossBuild) is driven by `rake`,
        # invoked from a CMake custom command (app/psp/CMakeLists.txt) exactly
        # the way the desktop/wasm builds drive it from the root CMakeLists.txt
        # -- but those run inside the nix devshell, which provides both; this
        # container does not. Install them before configuring. The image's
        # final stage is Alpine (github.com/pspdev/pspdev's own Dockerfile, not
        # the archived pspdev/pspdev-docker repo, which is Ubuntu-based but
        # unrelated to what actually publishes the pspdev/pspdev:latest tag) --
        # apk, not apt-get. build-base is needed alongside psp-gcc: rake's
        # MRuby::CrossBuild also builds a native "host" mruby (to produce mrbc,
        # which then compiles the target .rb sources to bytecode), and that
        # half runs the ambient `gcc`, not psp-gcc -- confirmed missing by a
        # real CI run ("sh: gcc: not found") once Ruby alone was installed;
        # `git` is for scripts/build_psp_fixup_imports.bash, below. `gperf`
        # and `bison` regenerate mruby-compiler's lexer/grammar
        # (mrbgems/mruby-compiler/core/{keywords,parse.y} -> lex.def/
        # y.tab.c) whenever a patch touches either source -- normally a
        # no-op since the checked-in generated files are already newer, but
        # patches/mruby-defined-keyword.patch touches both, and this bare
        # container has neither tool by default (confirmed missing by a real
        # CI run, "sh: gperf: not found", once that patch first shipped).
        #
        # That script replaces $PSPDEV/bin/psp-fixup-imports (a host tool
        # `cmake --build` invokes automatically after linking, as part of
        # `create_pbp_file`, and resolves through that same variable) with a
        # patched build before configuring. This image exports
        # PSPDEV=/usr/local/pspdev, so that is the path it lands on here --
        # see the script and patches/
        # psp-fixup-imports-jal-relocation-aware.patch for why: the stock tool
        # silently mis-links several of this EBOOT's own genuine PSP imports,
        # which is what stops it booting to completion under PPSSPP-headless
        # (see docs/adr/0047-psp-memory-budget.md's P1).
        #
        # Pull the image up front with -q: an implicit pull from `docker run`
        # prints a per-layer download/extract progress block, which `-q`
        # reduces to the resolved digest.
        run: |
          docker pull -q pspdev/pspdev:latest
          docker run --rm -v "$PWD:/src" -w /src \
            -e cp932_table=/src/.native-build-tables/bestfit932.txt \
            -e jis0208_table=/src/.native-build-tables/JIS0208.TXT \
            pspdev/pspdev:latest sh -euc '
            apk add --no-cache ruby ruby-rake build-base git gperf bison
            bash scripts/build_psp_fixup_imports.bash
            psp-cmake -S app/psp -B build-psp
            cmake --build build-psp -j"$(nproc)"
          '

      - name: Upload EBOOT
        uses: actions/upload-artifact@v7
        with:
          name: psp-eboot
          path: build-psp/EBOOT.PBP
          if-no-files-found: error

  psp-smoke:
    # Headless run check for the PSP EBOOT: boot it under PPSSPP (software
    # renderer) and look for the bring-up markers it writes via sceIoWrite --
    # RPG2K_PSP_BOOT (a libc-free string literal, emitted before any init) and
    # the per-second RPG2K_PSP_BRINGUP heartbeat. This exercises the EBOOT on an
    # emulator, beyond the compile-only `psp` job. The emulator is nixpkgs'
    # `packages.ppsspp` (see flake.nix) carrying one local patch, so it no
    # longer matches what cache.nixos.org has prebuilt for the pinned channel
    # -- every `nix build '.#ppsspp'` compiles PPSSPP from source rather than
    # substituting a closure. The Nix store cache below (same
    # `cache-nix-action` step every other job in this file uses) is what turns
    # that from a from-source PPSSPP compile on every run into a one-time cost,
    # replacing the hand-rolled tree cache PPSSPP used to be built from.
    #
    # BLOCKING: this used to run with continue-on-error while PPSSPP's headless
    # HLE only partially implemented pspsdk's libc stdio (printf/strlen
    # resolved to firmware stubs), which the EBOOT's markers lean on, making
    # capture flaky even when the EBOOT itself booted fine. The ten-bug trail
    # in app/psp/README.md (five of them PPSSPP HLE/interpreter bugs, patched
    # in patches/ and applied via this flake's own `packages.ppsspp`) fixed
    # that, and the frame loop now runs for the whole timeout window (thousands
    # of BRINGUP heartbeats per run), so the job asserts both markers and
    # gates the build alongside `psp`.
    needs: psp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # flake.nix / flake.lock are all this job reads from the checkout --
          # they are what pin the emulator -- so no submodules here (and hence
          # no test262-skip step; see the `build` job). Same two quiet-checkout
          # settings as every other checkout in this workflow.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Download EBOOT
        uses: actions/download-artifact@v8
        with:
          name: psp-eboot
          path: eboot

      - uses: nixbuild/nix-quick-install-action@v35

      # The patched `ppsspp` (see flake.nix) no longer matches nixpkgs'
      # prebuilt closure, so every `nix build` here compiles PPSSPP from
      # source -- a multi-minute C++ build -- unless the result is cached.
      # Keyed on the patch alongside flake.*: the patch changes PPSSPP's
      # output hash without touching either flake file, and a key that missed
      # that would silently keep restoring the pre-patch closure's build
      # instead of ever caching the patched one.
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-ppsspp-${{ runner.os }}-${{ hashFiles('flake.*', 'patches/ppsspp-lwmutex-workarea-validate.patch') }}
          restore-prefixes-first-match: nix-ppsspp-${{ runner.os }}-

      - name: Fetch PPSSPP
        # `packages.ppsspp` is nixpkgs' default (non-Qt) build, which configures
        # with -DHEADLESS=ON and ships `bin/ppsspp-headless`; see flake.nix. The
        # emulator finds its assets relative to its own store path, so unlike
        # the old source tree it can be run from anywhere.
        run: nix build -L --out-link ppsspp '.#ppsspp'

      - name: Run headless smoke test
        run: |
          EBOOT="$GITHUB_WORKSPACE/eboot/EBOOT.PBP"
          ls -l "$EBOOT"
          # The bring-up writes its markers with sceIoWrite(fd 1 and 2); PPSSPP
          # logs those, but below the default headless level, so --log is needed
          # to surface them (plain printf is an unimplemented HLE import under
          # PPSSPP). --timeout ends the otherwise-infinite bring-up loop; `|| true`
          # keeps its non-zero exit from masking the assertion below.
          # (--screenshot is a compare-against input in headless, not an output.)
          #
          # --log makes the emulator trace every HLE call, so the output goes to
          # the log file rather than the console: the whole file is uploaded as
          # the `psp-smoke` artifact below, and the lines that decide this step
          # (the markers, or the tail when they are missing) are echoed here.
          ./ppsspp/bin/ppsspp-headless --log --graphics=software --timeout=15 \
            "$EBOOT" > "$GITHUB_WORKSPACE/headless.log" 2>&1 || true
          echo "=== asserting the EBOOT booted and pumped frames ==="
          # RPG2K_PSP_BOOT proves it booted with output captured; RPG2K_PSP_BRINGUP
          # (the per-second heartbeat) additionally proves the frame loop runs --
          # required separately, because BRINGUP was unreachable for weeks while
          # the boot crashed before the first heartbeat, so a BOOT-only grep
          # would have passed a build that never pumped a frame.
          if grep -q 'RPG2K_PSP_BOOT' "$GITHUB_WORKSPACE/headless.log" &&
             grep -q 'RPG2K_PSP_BRINGUP' "$GITHUB_WORKSPACE/headless.log"; then
            # Every RPG2K_PSP_* marker, not just BOOT/BRINGUP: the
            # PRE_MRUBY_OPEN/MRUBY_OPEN pair (mrb_open()'s own memory/timing
            # cost, docs/adr/0047-psp-memory-budget.md) and GAME_START/
            # GAME_READY/GAME_STOP are otherwise only visible by pulling the
            # `psp-smoke` artifact's full headless.log, which needs GitHub API
            # access this job's own log does not. -10 covers every one-shot
            # marker (there are at most a handful) plus a few BRINGUP
            # heartbeats.
            grep -E 'RPG2K_PSP_[A-Z_]+' "$GITHUB_WORKSPACE/headless.log" \
              | head -10
          else
            echo "boot or bring-up marker missing from the emulator log; last 100 lines:"
            tail -100 "$GITHUB_WORKSPACE/headless.log"
            exit 1
          fi

      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: psp-smoke
          path: headless.log
          if-no-files-found: warn

  psp-smoke-game:
    # Same idea as `psp-smoke`, but with a real RPG2k project placed at the
    # EBOOT's fixed Memory Stick path (app/psp/main.cxx's kGameDir,
    # "ms0:/PSP/GAME/rpg2k") instead of nothing. `psp-smoke` above only ever
    # exercises the idle HAL screen -- no game is ever detected there, so
    # RPG2K_PSP_GAME_READY never fires and RPG2K_PSP_BRINGUP's scene= is
    # always "none". This is the first CI job to boot a real game through the
    # PSP build and capture what docs/adr/0047-psp-memory-budget.md's P1/P1b
    # actually need: real device memory numbers for "the database and map
    # tree loaded, Scene::Title built" (GAME_READY) and for steady-state
    # Title (BRINGUP's scene=RPG2k::Scene::Title). This job also drops a
    # `.psp_ci_new_game` marker file next to Nepheshel's own data --
    # app/psp/main.cxx checks for it and, only when present, sets
    # RPG2K_NEW_GAME true instead of its normal hardcoded false, which makes
    # Scene::Title auto-select "New Game" with no input needed (the same
    # mechanism src/main.cxx's own --rpg2k_new_game already drives on
    # desktop). That reaches Scene::Map for real numbers too, not just
    # Title -- Menu/Battle still need either a compile-time RPG2K_NEW_GAME
    # replacement (a specific map/troop id, say) or real input scripting,
    # neither of which exists yet, so this job's scope stops at Map.
    #
    # Nepheshel is the same RPG2000 test-bed the desktop `build` job's own
    # "RPG2k real-game boot smoke test" step already downloads and boots, so
    # no new fixture is introduced.
    #
    # Getting the game to where the EBOOT looks for it took one wrong turn
    # worth recording: a `--memstick=DIR` flag looked right from PPSSPP's own
    # source (Headless.cpp checks `cmdLineOptions.memStick.has_value()`), but
    # the first real run showed PPSSPP's arg parser never consuming it as a
    # flag at all -- it treated the whole `--memstick=...` string as another
    # positional boot target and tried (and failed) to run it as one,
    # confirmed by the emulator's own log ("Test init failed for
    # --memstick=...", right next to the real EBOOT's own "Test timeout").
    # hrydgard/ppsspp#20552 ("Allow Linux to change memstick directory") backs
    # this up: as of this writing Linux headless has no working way to
    # redirect the memstick location at all. What *is* real, quoted straight
    # from Headless.cpp's own default-path branch (taken whenever no memstick
    # override applies): non-Windows, non-Android headless runs default
    # `g_Config.memStickDirectory` to `$HOME/.ppsspp`, creating it if it does
    # not exist. So instead of trying to redirect it, this job just writes
    # Nepheshel into that same default location ahead of time.
    #
    # continue-on-error: true for now. `psp-smoke` above used to run the same
    # way while PPSSPP's headless HLE was still catching up (see its own
    # comment) and was promoted once proven stable; this job is the same
    # starting point for a real game specifically, which is new ground the
    # idle path never covered, and Nepheshel's download host has its own
    # known intermittency (see scripts/download-nepheshel.bash's neighbors'
    # comments) unrelated to the EBOOT itself. Promote once this has run
    # green for a while.
    needs: [psp, psp-smoke]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Download EBOOT
        uses: actions/download-artifact@v8
        with:
          name: psp-eboot
          path: eboot

      - uses: nixbuild/nix-quick-install-action@v35

      # Same cache key as `psp-smoke`'s identically-named step, so this job
      # (which `needs: psp-smoke` and so always starts after it) reuses the
      # Nix store that step already populated instead of compiling PPSSPP
      # from source a second time.
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-ppsspp-${{ runner.os }}-${{ hashFiles('flake.*', 'patches/ppsspp-lwmutex-workarea-validate.patch') }}
          restore-prefixes-first-match: nix-ppsspp-${{ runner.os }}-

      - name: Fetch PPSSPP
        run: nix build -L --out-link ppsspp '.#ppsspp'

      - name: Download Nepheshel
        # unar (download-nepheshel.bash's own unpacker) is a devShell package
        # (flake.nix), and this job never enters the full devShell the way
        # `nix-develop-export-env.bash` does for the desktop `build` job --
        # pulling that whole closure in just for one archive tool would be
        # wasteful here (and a bare `nixpkgs#unar` would resolve against
        # whatever nixpkgs the ambient Nix registry defaults to, not this
        # flake's own pinned one), so just apt-get the one package this needs,
        # the same way the `android` job below installs its one-off `gperf`.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q unar
          ./scripts/download-nepheshel.bash

      - name: Place Nepheshel at the EBOOT's fixed Memory Stick path
        # $HOME/.ppsspp is headless's own default memstick root on Linux (see
        # this job's own top comment) -- created it here ahead of time with
        # the game already in place, rather than after the emulator creates
        # it, so there is no race with PPSSPP's own first-run setup.
        run: |
          memstick="$HOME/.ppsspp"
          gamedir="$memstick/PSP/GAME/rpg2k"
          mkdir -p "$gamedir"
          cp -r data/Nepheshel206beta/Nepheshel206Rbeta/. "$gamedir/"
          # app/psp/main.cxx's own opt-in: only this marker's presence flips
          # RPG2K_NEW_GAME true, so Scene::Title auto-selects New Game and
          # this run reaches Scene::Map instead of sitting on the title
          # screen -- see this job's own top comment.
          touch "$gamedir/.psp_ci_new_game"

      - name: Run headless with a real game
        run: |
          EBOOT="$GITHUB_WORKSPACE/eboot/EBOOT.PBP"
          ls -l "$EBOOT"
          # Longer timeout than psp-smoke's idle-path 15s: a real database
          # and map tree load (RPG_RT.ldb/.lmt) is real work the idle path
          # never does.
          # $status, not `|| true` on the invocation itself: a signal-killed
          # exit (128 + signal number -- 139 for the SIGSEGV docs/adr/0047-
          # psp-memory-budget.md's P1c hit) must not be silently absorbed
          # the way it was there -- that run segfaulted partway through
          # Scene::Map and still reported success because only the marker-
          # presence asserts below gated the job, with nothing checking
          # whether the emulator itself survived. Checked as "$status" -ge
          # 128, not "$status" -ne 0: a plain --timeout completion (this
          # EBOOT never calls the syscall a real Headless.cpp test-success
          # exit would want) is expected to exit nonzero on its own and
          # must not be flagged as if it were a crash.
          set +e
          ./ppsspp/bin/ppsspp-headless --log --graphics=software --timeout=45 \
            "$EBOOT" > "$GITHUB_WORKSPACE/headless-game.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ge 128 ]; then
            echo "::warning::ppsspp-headless was killed by signal $((status - 128)) (exit $status) -- see docs/adr/0047-psp-memory-budget.md's P1c"
          fi
          echo "=== asserting the EBOOT booted, found the game, and pumped frames ==="
          if grep -q 'RPG2K_PSP_BOOT' "$GITHUB_WORKSPACE/headless-game.log" &&
             grep -q 'RPG2K_PSP_GAME_START RPG2k ok' "$GITHUB_WORKSPACE/headless-game.log" &&
             grep -q 'RPG2K_PSP_BRINGUP' "$GITHUB_WORKSPACE/headless-game.log"; then
            # 30, not 20: the .psp_ci_new_game marker (see this job's own top
            # comment) makes Title auto-select New Game, which adds the
            # [RPG2k-MAP] transition line and a run of BRINGUP heartbeats
            # tagged scene=RPG2k::Scene::Map worth seeing in the job's own
            # log, not just the uploaded artifact.
            grep -E 'RPG2K_PSP_[A-Z_]+|\[RPG2k-MAP\]' "$GITHUB_WORKSPACE/headless-game.log" \
              | head -30
          else
            echo "boot, game-start or bring-up marker missing; last 150 lines:"
            tail -150 "$GITHUB_WORKSPACE/headless-game.log"
            exit 1
          fi

      - name: Upload real-game smoke-test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: psp-smoke-game
          path: headless-game.log
          if-no-files-found: warn

  android:
    # Build the Android debug APK (app/android). Like the Wio/PSP jobs, this is
    # the external check for the port: cross-compiles mruby, LVGL,
    # SDL2/SDL2_mixer, gflags, ng-log, uni-algo and quickjs-ng for arm64-v8a
    # and packages them into a real APK via Gradle. It does not itself run the
    # APK -- the `android-smoke` job below does that, on an emulator -- see
    # app/android/README.md and docs/adr/0058-android-port.md.
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # 3rd/SDL and 3rd/SDL_mixer (vendored -- Android has no system SDL2
          # package) plus every submodule the desktop build also needs.
          submodules: recursive
          # Quiet fetch + no post-job credential unset walk; see the `build` job.
          show-progress: false
          persist-credentials: false

      - name: Download Unicode mapping tables
        # See the identical step in the `psp` job above -- same two rake-time
        # code generators, same $cp932_table/$jis0208_table gap outside the nix
        # devshell.
        run: |
          mkdir -p .native-build-tables
          fetch_table() {
            local url="$1" dest="$2" want="$3"
            curl -fsSL -o "$dest" "$url"
            local got
            got="$(python3 -c 'import hashlib,base64,sys; print(base64.b64encode(hashlib.sha256(open(sys.argv[1],"rb").read()).digest()).decode())' "$dest")"
            if [ "$got" != "$want" ]; then
              echo "hash mismatch for $dest" >&2
              echo "  flake.nix pins $want" >&2
              echo "  downloaded     $got" >&2
              exit 1
            fi
          }
          fetch_table \
            'https://www.unicode.org/Public/MAPPINGS/VENDORS/MICSFT/WindowsBestFit/bestfit932.txt' \
            .native-build-tables/bestfit932.txt \
            'JhTP6jXDyGxB0zGYeTqEykTt7jzw7gATphpD+6Ts4zE='
          fetch_table \
            'https://www.unicode.org/Public/MAPPINGS/OBSOLETE/EASTASIA/JIS/JIS0208.TXT' \
            .native-build-tables/JIS0208.TXT \
            'HFcYcEV/Gcl3IGMfqD7kkVSalroUNtoSlnhqZ9hjLoc='

      # gperf/bison regenerate mruby-compiler's lexer/grammar when a patch
      # touches either source (see the `psp` job's identical comment); ubuntu
      # runners ship bison but not gperf.
      - run: sudo apt-get update -q && sudo apt-get install -y -q gperf

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;27.2.12479018" "cmake;3.22.1" \
            --sdk_root="$ANDROID_HOME"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: app/android
        # ANDROID_NDK_HOME is set here, not via this step's own `env:` block:
        # ${{ env.* }} only resolves workflow/job-level `env:` entries, not the
        # runner image's own preinstalled ANDROID_HOME -- exporting it from
        # $ANDROID_HOME inside the shell is what actually sees the runner's
        # real SDK path.
        env:
          cp932_table: ${{ github.workspace }}/.native-build-tables/bestfit932.txt
          jis0208_table: ${{ github.workspace }}/.native-build-tables/JIS0208.TXT
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-smoke:
    # Boot the APK `android` just built, for real, on an emulator -- the same
    # idea as `psp-smoke`/`psp-smoke-game` for the PSP EBOOT, closing the gap
    # the `android` job's own comment used to describe. The app ships
    # arm64-v8a native libraries only (app/android/app/build.gradle's
    # `abiFilters`), and GitHub-hosted Linux runners only get KVM
    # acceleration for an x86/x86_64 guest -- an arm64-v8a system image runs
    # fully software-emulated and is far too slow to boot in a CI job -- so
    # this targets an x86_64 `google_apis` image instead and leans on the
    # Android Emulator's own ARM-binary translation (bundled with Google
    # APIs images from API 28 on, which not by coincidence is also this
    # app's own `minSdk` floor -- see that field's own comment) to run the
    # arm64-v8a .so unmodified rather than needing a second, x86_64 native
    # build.
    #
    # This is a *boot-and-crash* check, not a performance measurement: an
    # x86_64-hosted, ARM-translated emulator's frame times mean nothing next
    # to the C330 numbers ADR 58 and docs/android-perf-followups.md track --
    # those still need a real device (see docs/android-perf-followups.md's
    # "How to measure" section). What this job catches instead is the class
    # of bug the `android` job's compile-only check cannot: a runtime crash,
    # a missing asset lookup, a native abort that only shows up once
    # Dalvik/ART actually loads the .so and SDL's Java glue drives main() --
    # exactly the shape of the three real bugs ADR 58's Consequences section
    # found by hand before any device or emulator was available to this port.
    #
    # New and unproven, like `psp-smoke-game` was at first (see its own
    # comment above): `continue-on-error: true` until this has run green for
    # a while, since ARM-translation availability is an emulator/system-image
    # detail this job does not control and CI emulators are a known source of
    # first-boot flakiness.
    needs: android
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      # See the `build` job for what this is -- the same Nepheshel download
      # runs here, and without it this job hits the real upstream host
      # directly instead of the CORS proxy's R2 cache `build`/`ruby-checks`/
      # `wasm` route their own Nepheshel downloads through.
      CORS_PROXY_URL: ${{ secrets.CORS_PROXY_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Only scripts/android_smoke_check.bash, scripts/download-
          # nepheshel.bash and this workflow file are read here -- no
          # submodules, same reasoning as `psp-smoke`.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: android-debug-apk
          path: apk

      - name: Download Nepheshel
        # Same fixture and installer the desktop `build` job and
        # `psp-smoke-game` already use; see the latter's own comment for why
        # this is a plain apt-get rather than the full nix devShell.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q unar
          ./scripts/download-nepheshel.bash

      - name: Enable KVM group perms
        # Standard boilerplate for reactivecircus/android-emulator-runner on
        # a GitHub-hosted Linux runner: /dev/kvm exists but is root-only
        # until a udev rule opens it to the `kvm` group the runner user is
        # already in.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api30-google_apis-x86_64

      - name: Boot the APK and walk it to the map scene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          # -no-snapshot-save alongside the AVD cache above: this job never
          # wants to persist a mid-boot snapshot back into the cached image,
          # only the empty-AVD creation cost.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-snapshot-save
          disable-animations: true
          script: ./scripts/android_smoke_check.bash

      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-smoke
          path: |
            android-smoke-logcat.txt
            android-smoke-full-logcat.txt
            android-smoke-screenshot.png
          if-no-files-found: warn

  flake:
    if: ${{ github.event_name != 'issue_comment' }}
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # `nix build`'s own `?submodules=1` walk (below) reads these off the
          # local checkout, so unlike the other jobs this one genuinely needs
          # them on disk -- but `packages.build` compiles the same
          # CMakeLists.txt as the `build` job, which `find_package(SDL2)`s a
          # nixpkgs package rather than building 3rd/SDL or 3rd/SDL_mixer, and
          # nothing here reads 3rd/optcarrot either. See the `build` job's
          # "Init submodules" step.
          submodules: false
          # Quiet fetch + no post-job credential unset walk; see the `build` job.
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: 3rd/SDL 3rd/SDL_mixer 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      # This is the one job that still fetches submodules (`?submodules=1` on
      # the `nix build` below), and the walk covers every entry of every nested
      # `.gitmodules` — so drop quickjs-ng's unused test262 entry rather than
      # cloning tc39/test262 to satisfy it.
      - name: Skip the quickjs test262 submodule
        run: ./scripts/skip-quickjs-test262.bash
        env:
          CLONE_TEST262: ${{ vars.CLONE_TEST262 }}

      # The opt-out (`CLONE_TEST262=1`) leaves the submodule registered, so it
      # has to be materialised for the walk to find it.
      - name: Materialize quickjs test262 submodule for the flake build
        if: ${{ vars.CLONE_TEST262 == '1' }}
        run: git -C 3rd/quickjs -c submodule.test262.update=checkout submodule update --init --depth 1 test262

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix') }}

      # `?submodules=1` is what puts the submodule sources in the store copy of
      # this flake, which `packages.build` compiles. It is asked for here rather
      # than declared in flake.nix, so that only this job pays for the walk --
      # the three jobs that enter the dev shell build the checkout itself and
      # never read nix's copy of it (see the comment in flake.nix).
      #
      # Piped through the same ref-noise filter every `nix` call in this
      # workflow uses (see e.g. scripts/nix-develop-export-env.bash): fetching
      # the flake with submodules makes nix fetch each one with `refs/*:refs/*`
      # and print a `* [new ref]` line per ref, ~15k of them ahead of the first
      # build log line. Merging stderr into stdout is what lets one filter see
      # both; `-L`'s build logs stay untouched, they are prefixed with the
      # derivation name rather than looking like fetch output.
      - name: Build flake
        run: nix build -L '.?submodules=1#build' 2>&1 | ./scripts/drop-git-fetch-noise.bash

  # Publish the WebAssembly page to GitHub Pages on every push to master. The
  # build carries no pthreads/SharedArrayBuffer, so it needs no COOP/COEP
  # headers and serves fine from Pages. Requires Settings → Pages → "Build and
  # deployment" → Source = "GitHub Actions" to be enabled once for the repo.
  deploy-pages:
    needs: wasm
    # `!cancelled()` is load-bearing, not decoration. A skip propagates down the
    # whole `needs` chain, not just one link: `preview-gate` is skipped outside
    # the `/preview` flow, and although `wasm` opts out of that with its own
    # `!cancelled()` and runs to success, this job inherited the skip through it
    # and never published. Every condition below was satisfied on those runs —
    # it never got to evaluate them. A status-check function is what overrides
    # the inherited skip, so the `wasm` result has to be spelled out explicitly
    # once it is there (that is what `!cancelled()` gives up).
    if: >-
      ${{ !cancelled() && needs.wasm.result == 'success'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialise deploys so an older run can't overwrite a newer one; let the
    # in-progress publish finish rather than cancelling it half-written.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download wasm page
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: site

      # The full changelog lives in CHANGELOG.md at the repo root; render it
      # into site/changelog/ as a sub-page rather than shipping raw Markdown.
      # Checked out to its own path (not "."), since a default checkout here
      # would `git clean` the site/ directory just downloaded above. Only
      # CHANGELOG.md and the render script are needed, not the whole tree, so
      # sparse checkout keeps this a few-second step even though deploy-pages
      # otherwise never checks out the repo.
      - name: Fetch CHANGELOG.md
        uses: actions/checkout@v7
        with:
          path: changelog-src
          sparse-checkout: |
            CHANGELOG.md
            scripts/render-changelog-page.bash
          sparse-checkout-cone-mode: false
          show-progress: false
          persist-credentials: false
      - name: Render the changelog to HTML
        run: ./changelog-src/scripts/render-changelog-page.bash changelog-src/CHANGELOG.md site/changelog

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Publish a Cloudflare Pages preview deployment on request, so a pull request's
  # build gets a shareable URL before it merges. Comment `/preview` on the PR to
  # trigger it (see `preview-gate` above for who may). Requires two repo secrets
  # — CLOUDFLARE_API_TOKEN (a token with the "Cloudflare Pages: Edit"
  # permission) and CLOUDFLARE_ACCOUNT_ID — and a Cloudflare Pages project named
  # "rpg-maker-clone" (create it once in the dashboard as a "Direct Upload"
  # project). See docs/deploy.md for the one-time setup.
  preview-cloudflare:
    # `preview-gate` only succeeds on a `/preview` comment, so depending on it
    # is what keeps this job out of ordinary push / pull-request runs.
    needs: [ preview-gate, wasm ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Two `/preview` comments in a row would otherwise race to publish the same
    # Pages project; queue them per PR instead. Not cancel-in-progress — a
    # cancelled upload leaves a half-written deployment.
    concurrency:
      group: cloudflare-preview-${{ github.event.issue.number }}
      cancel-in-progress: false
    # Job-level env can read secrets (job-level `if` cannot), so expose whether
    # Cloudflare is configured to a step that gates the deploy. This keeps the
    # job green when the optional Cloudflare setup hasn't been done yet, instead
    # of failing on a missing secret.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set — skipping the preview deployment. See docs/deploy.md for the one-time setup."
          fi
      # `/preview` is an explicit request, so say something when it cannot be
      # honoured rather than leaving the comment answered by a 👀 and nothing
      # else.
      - name: Report the missing setup on the PR
        if: steps.creds.outputs.configured != 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cloudflare-preview
          number: ${{ github.event.issue.number }}
          message: |
            ### ⚡ Cloudflare Pages preview

            `/preview` cannot run: the `CLOUDFLARE_API_TOKEN` /
            `CLOUDFLARE_ACCOUNT_ID` repository secrets are not set. See
            `docs/deploy.md` for the one-time setup.
      - name: Download wasm page
        if: steps.creds.outputs.configured == 'true'
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: site

      # Same changelog sub-page as `deploy-pages` (see its comment above), so
      # a reviewer can check the rendered CHANGELOG.md in the preview before
      # it ships. `ref` matches what the `wasm` job built (the PR head, not
      # this event's own ref) so the preview always renders the same commit it
      # deployed. Checked out to its own path, not "." -- a default checkout
      # here would `git clean` the site/ directory just downloaded above.
      - name: Fetch CHANGELOG.md
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preview-gate.outputs.head-sha }}
          path: changelog-src
          sparse-checkout: |
            CHANGELOG.md
            scripts/render-changelog-page.bash
          sparse-checkout-cone-mode: false
          show-progress: false
          persist-credentials: false
      - name: Render the changelog to HTML
        if: steps.creds.outputs.configured == 'true'
        run: ./changelog-src/scripts/render-changelog-page.bash changelog-src/CHANGELOG.md site/changelog

      - name: Deploy preview to Cloudflare Pages
        id: cf
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Any --branch other than the project's production branch is published
          # as a preview. `pr-<number>` is used rather than the PR's own branch
          # name so a fork branch that happens to be called master cannot land
          # on the production deployment, and so each PR keeps a stable
          # preview URL across repeated `/preview` runs.
          command: >-
            pages deploy site
            --project-name=rpg-maker-clone
            --branch=pr-${{ github.event.issue.number }}
            --commit-hash=${{ needs.preview-gate.outputs.head-sha }}
            --commit-dirty=true
      - name: Comment preview URL on the PR
        if: ${{ steps.cf.outputs.deployment-url != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cloudflare-preview
          number: ${{ github.event.issue.number }}
          message: |
            ### ⚡ Cloudflare Pages preview

            | | |
            | --- | --- |
            | **Preview URL** | ${{ steps.cf.outputs.deployment-url }} |
            | **Commit** | ${{ needs.preview-gate.outputs.head-sha }} |

            Open the link and load an RPG Maker project with the on-page loader.
            Comment `/preview` again to publish a fresh build.
