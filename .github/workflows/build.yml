# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04

    env:
      SCCACHE_GHA_ENABLED: "true"
      ACTIONS_CACHE_SERVICE_V2: "on"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - run: nix develop -c echo test

      - name: cache rtp
        uses: actions/cache@v6
        id: rtp-cache
        with:
          path: scripts/*.zip
          key: rtp-${{ hashFiles('./scripts/rtp*_install.bash') }}
          restore-keys: rtp-

      - name: cache test game
        uses: actions/cache@v6
        id: cache
        with:
          path: data
          key: game-${{ hashFiles('./scripts/download-*.bash', './scripts/gen-mv-sample.py', './data/mv-sample/data/**', './data/mv-sample/img/**', './data/mv-sample/js/main.js', './data/mv-sample/js/plugins.js', './data/mv-sample/index.html') }}

      # The native compile is the long pole. Everything that does not feed the
      # compiler — the RTP/game/MV downloads (network-bound) and pre-commit
      # (lint) — is launched as a `background: true` step so it overlaps the
      # build instead of running strictly before/after it. Each download script
      # is idempotent (it skips work already present, e.g. on a cache hit), so
      # the steps run unconditionally and no-op when their data is in place;
      # that keeps them safe to `wait` on below (a skipped `if:` step is avoided
      # so the wait always has a real step to join). Every write lands on a
      # git-ignored path (build/, data/*, scripts/*.zip, the fetched MV engine
      # files), so nothing here can race pre-commit's tracked-file `git diff`.
      - name: Download RTP
        id: dl-rtp
        background: true
        run: |
          nix develop -c ./scripts/rtp_install.bash
          nix develop -c ./scripts/rtp_xp_install.bash

      - name: Download game
        id: dl-game
        background: true
        run: |
          nix develop -c ./scripts/download-nepheshel.bash
          nix develop -c ./scripts/download-mtf-meido-action.bash
          nix develop -c ./scripts/download-opengame-xp.bash

      - name: Download MV test game
        id: dl-mv
        background: true
        run: nix develop -c ./scripts/download-lunatic-core.bash

      - name: Build MV sample engine
        id: dl-mv-sample
        background: true
        run: nix develop -c ./scripts/download-mv-corescript.bash

      - name: pre-commit
        id: pre-commit
        background: true
        env:
          SKIP: nixfmt
        run: |
          nix develop -c pre-commit run -a || (
            git diff --exit-code ;
            false
          )

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: cmake
        run: |
          nix develop -c cmake -S . -B build -GNinja

      - name: build
        run: |
          nix develop -c cmake --build build

      - name: sccache stats
        if: always()
        run: |
          {
            echo "## sccache stats"
            echo ""
            echo '```'
            nix develop -c sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Barrier: block until lint and every download have finished before the
      # checks that consume them. A failed background step (e.g. pre-commit)
      # surfaces here and fails the job, exactly as it did when these ran inline.
      - name: Wait for lint and downloads
        wait: [pre-commit, dl-rtp, dl-game, dl-mv, dl-mv-sample]

      - name: Prepare screenshot dir
        run: mkdir -p ss

      # Every post-build check is independent and each is a separate, mostly
      # IO-/timeout-bound process that reads the (now built) binary and the
      # downloaded data read-only, so they run concurrently in one `parallel`
      # group (implicit wait at the end). The MV smoke tests stay non-blocking
      # (continue-on-error) while the MV runtime is brought up; the required
      # checks (LCF / RPG XP / RPG2k / ctest) fail the group — and the job — if
      # they fail. Each MV run uses `xvfb-run -a` (auto-picked display) and a
      # distinct screenshot path, so the concurrent runs never collide.
      - parallel:
          - name: LCF test-bed smoke check
            run: nix develop -c ruby scripts/lcf_testbed_check.rb

          - name: RPG XP test-bed smoke check
            run: nix develop -c ruby scripts/rpgxp_testbed_check.rb

          - name: RPG2k game-logic checks
            run: |
              nix develop -c ruby scripts/rpg2k_logic_check.rb
              nix develop -c ruby scripts/rpg2k_scene_check.rb
              nix develop -c ruby scripts/rpg2k_render_check.rb

          - name: test
            run: |
              nix develop -c cmake --build build -t test

          - name: MV boot smoke test
            continue-on-error: true
            run: |
              nix develop -c xvfb-run -a timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=5000 --game_dir data/Lunatic-Core \
                --mv_screenshot=ss/mv_title.png

          - name: MV sample smoke test
            continue-on-error: true
            run: |
              nix develop -c xvfb-run -a timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=5000 --game_dir data/mv-sample \
                --mv_new_game --mv_screenshot=ss/mv_sample.png

          - name: MV battle smoke test
            continue-on-error: true
            run: |
              nix develop -c xvfb-run -a timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=6000 --game_dir data/mv-sample \
                --mv_battle_test=1 --mv_screenshot=ss/mv_battle.png

          - name: MV movement smoke test
            continue-on-error: true
            run: |
              nix develop -c xvfb-run -a timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=6000 --game_dir data/mv-sample \
                --mv_new_game --mv_move_test

          - name: MV message smoke test
            continue-on-error: true
            run: |
              nix develop -c xvfb-run -a timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=6000 --game_dir data/mv-sample \
                --mv_new_game --mv_message_test --mv_screenshot=ss/mv_message.png

      - name: Upload MV screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-screenshot
          path: ss/mv_title.png
          if-no-files-found: warn

      - name: Upload MV sample screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-sample-screenshot
          path: ss/mv_sample.png
          if-no-files-found: warn

      - name: Upload MV battle screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-battle-screenshot
          path: ss/mv_battle.png
          if-no-files-found: warn

      - name: Upload MV message screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-message-screenshot
          path: ss/mv_message.png
          if-no-files-found: warn

  wasm:
    runs-on: ubuntu-24.04
    env:
      # Cache emcc compilations across runs. sccache (used by the native build)
      # does not understand emcc, so the wasm build uses ccache instead, which
      # wraps emcc as a plain compiler. nixpkgs sets EM_CONFIG via the
      # environment, so emcc does not pass --em-config on the command line and
      # ccache does not bail out with "Multiple input files".
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: ~/.emscripten_cache
          key: ${{ runner.os }}-emcc-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-emcc-

      - name: Restore and cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: wasm-ccache-${{ github.run_id }}
          restore-keys: wasm-ccache-

      # Emscripten builds its system libraries (libc/libc++, and the -fexceptions
      # variant this project forces) on the first emcc call, which costs ~50s of
      # the configure step. The nixpkgs emscripten setup hook points EM_CACHE at
      # an ephemeral temp dir, so that work is thrown away every run and the
      # cached ~/.emscripten_cache is never written. Override EM_CACHE on the
      # command itself (after the hook runs) so the libraries are built once and
      # restored on later runs. It must be set for both configure and build,
      # since emcc runs in both.
      # Fetch + build the MIT MV engine into the committed sample so it can be
      # bundled into the page as a one-click preset (WASM_SAMPLE_DIR below).
      - name: Build MV sample engine
        run: nix develop -c ./scripts/download-mv-corescript.bash

      - name: cmake
        # CMAKE_<LANG>_COMPILER_LAUNCHER is initialised from the environment at
        # configure time and stored in CMakeCache.txt, so setting ccache here is
        # enough for it to wrap emcc during the build step too. This overrides
        # the sccache launcher the devShell exports (sccache cannot cache emcc).
        # WASM_SAMPLE_DIR bakes the MV sample into the page at /game_sample.
        run: |
          nix develop -c env EM_CACHE="$HOME/.emscripten_cache" \
            CMAKE_C_COMPILER_LAUNCHER=ccache \
            CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            emcmake cmake -S . -B wasm-build -GNinja \
            -DWASM_SAMPLE_DIR=data/mv-sample

      - name: build
        run: |
          nix develop -c ccache --zero-stats
          nix develop -c env EM_CACHE="$HOME/.emscripten_cache" \
            cmake --build wasm-build

      - name: ccache stats
        if: always()
        run: |
          {
            echo "## ccache stats — wasm"
            echo ""
            echo '```'
            nix develop -c ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          # index.wasm.map lets the deployed page symbolicate wasm stack traces
          # (the build links with -gsource-map); it is optional but harmless to
          # ship. All paths sit under wasm-build/, so the artifact stores them at
          # its root (index.html, index.js, index.wasm[.map]) — ready to publish
          # as-is.
          path: |
            wasm-build/index.html
            wasm-build/index.js
            wasm-build/index.wasm
            wasm-build/index.wasm.map
            wasm-build/index.data

  wio:
    # Build the Wio Terminal (SAMD51) bring-up firmware with PlatformIO. This is
    # the external check for the port's HAL: this environment cannot cross-build
    # or flash the board, so CI compiles it. Builds the display + input HAL and
    # the Arduino sketch; the mruby interpreter is layered on in a later slice
    # (see app/wio/README.md and docs/adr/0005-wio-terminal-port.md).
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # LVGL is vendored as a submodule and linked into the firmware.
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e wio

  psp:
    # Build the PSP EBOOT bring-up with the pspdev toolchain. Like the Wio job,
    # this is the external check for the port's HAL: this environment cannot
    # cross-build or flash a PSP, so CI compiles it. Builds the LVGL display +
    # input HAL and the entry-point sketch into EBOOT.PBP; the mruby interpreter
    # is layered on in a later slice (see app/psp/README.md and
    # docs/adr/0010-psp-port.md).
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # LVGL is vendored as a submodule and linked into the EBOOT.
          submodules: recursive

      - name: Build EBOOT (pspdev container)
        # The pspdev image ships psp-gcc, cmake and the psp-cmake wrapper (which
        # points CMake at the pspdev toolchain and provides create_pbp_file).
        run: |
          docker run --rm -v "$PWD:/src" -w /src pspdev/pspdev:latest sh -euc '
            psp-cmake -S app/psp -B build-psp
            cmake --build build-psp -j"$(nproc)"
          '

      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: psp-eboot
          path: build-psp/EBOOT.PBP
          if-no-files-found: error

  psp-smoke:
    # Headless run check for the PSP EBOOT: boot it under PPSSPP (software
    # renderer) and look for the bring-up markers it writes via sceIoWrite --
    # RPG2K_PSP_BOOT (a libc-free string literal, emitted before any init) and
    # the per-second RPG2K_PSP_BRINGUP heartbeat. This exercises the EBOOT on an
    # emulator, beyond the compile-only `psp` job. PPSSPP is built from source
    # (no stable prebuilt headless binary) and cached by tag, so only the first
    # run pays the build cost.
    #
    # NON-BLOCKING (continue-on-error): PPSSPP's headless HLE only partially
    # implements pspsdk's libc stdio (printf/strlen resolve to firmware stubs),
    # which the EBOOT's markers lean on, so capture can be flaky under the
    # emulator even though the EBOOT builds and boots. The required gate is the
    # `psp` build; this job stays informational (its log is uploaded) until the
    # emulator path is solid.
    needs: psp
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      PPSSPP_TAG: v1.17.1
    steps:
      - name: Download EBOOT
        uses: actions/download-artifact@v4
        with:
          name: psp-eboot
          path: eboot

      - name: Install PPSSPP build deps
        # PPSSPP compiles its GL/Vulkan backends even for HEADLESS: its bundled
        # GLEW pulls in GL/glu.h, so libglu is required on top of libgl. Vulkan
        # and fontconfig headers are needed for the SDL/Linux frontend it links.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libsdl2-dev libvulkan-dev \
            libfontconfig1-dev zlib1g-dev

      # Restore/save are split so a failed (partial) build is never cached: the
      # save runs only on success. The build step below always runs and lets
      # ninja finish incrementally on top of whatever the restore brought back.
      - name: Restore PPSSPP cache
        id: cache-ppsspp
        uses: actions/cache/restore@v6
        with:
          path: ppsspp
          key: ppsspp-${{ env.PPSSPP_TAG }}-headless-v2-${{ runner.os }}

      - name: Build PPSSPP headless
        run: |
          if [ ! -d ppsspp/.git ]; then
            git clone --recursive --depth 1 -b "$PPSSPP_TAG" \
              https://github.com/hrydgard/ppsspp
          fi
          cmake -S ppsspp -B ppsspp/build -GNinja \
            -DHEADLESS=ON -DUNITTEST=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build ppsspp/build --target PPSSPPHeadless -j"$(nproc)"

      - name: Save PPSSPP cache
        if: success() && steps.cache-ppsspp.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ppsspp
          key: ppsspp-${{ env.PPSSPP_TAG }}-headless-v2-${{ runner.os }}

      - name: Run headless smoke test
        run: |
          EBOOT="$GITHUB_WORKSPACE/eboot/EBOOT.PBP"
          ls -l "$EBOOT"
          cd ppsspp
          # Capture the exact supported flags/renderers for reference.
          echo "=== PPSSPPHeadless --help ==="
          ./build/PPSSPPHeadless --help 2>&1 | head -80 || true
          # Run from the PPSSPP tree so it finds its assets/ (fonts, etc.).
          # --timeout ends the otherwise-infinite bring-up loop; a non-zero exit
          # from the timeout must not mask the heartbeat check, hence `|| true`.
          # The bring-up writes its markers with sceIoWrite(fd 1 and 2); PPSSPP
          # logs those, but below the default headless level, so --log is needed
          # to surface them (plain printf is an unimplemented HLE import under
          # PPSSPP). --timeout ends the otherwise-infinite bring-up loop; `|| true`
          # keeps its non-zero exit from masking the assertion below.
          # (--screenshot is a compare-against input in headless, not an output.)
          echo "=== run ==="
          ./build/PPSSPPHeadless --log --graphics=software --timeout=15 \
            "$EBOOT" 2>&1 | tee "$GITHUB_WORKSPACE/headless.log" || true
          echo "=== asserting the EBOOT booted (and ideally pumped frames) ==="
          # RPG2K_PSP_BOOT proves it booted with output captured; RPG2K_PSP_BRINGUP
          # (the per-second heartbeat) additionally proves the frame loop runs.
          grep -qE 'RPG2K_PSP_(BOOT|BRINGUP)' "$GITHUB_WORKSPACE/headless.log"

      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psp-smoke
          path: headless.log
          if-no-files-found: warn

  flake:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # quickjs-ng pins a nested `test262` submodule with `update = none`, so the
      # recursive checkout above skips it. `nix build '.?submodules=1'` still
      # recurses into every nested submodule and fails to fetch test262 when it
      # is absent, so materialise it here (shallow). It is only needed to satisfy
      # nix's recursive fetch; nothing in the build uses it.
      - name: Materialize quickjs test262 submodule for the flake build
        run: git -C 3rd/quickjs -c submodule.test262.update=checkout submodule update --init --depth 1 test262

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix') }}

      - name: Build flake
        run: nix build -L '.#build'

  # Publish the WebAssembly page to GitHub Pages on every push to master. The
  # build carries no pthreads/SharedArrayBuffer, so it needs no COOP/COEP
  # headers and serves fine from Pages. Requires Settings → Pages → "Build and
  # deployment" → Source = "GitHub Actions" to be enabled once for the repo.
  deploy-pages:
    needs: wasm
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialise deploys so an older run can't overwrite a newer one; let the
    # in-progress publish finish rather than cancelling it half-written.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download wasm page
        uses: actions/download-artifact@v7
        with:
          name: wasm
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Publish a Cloudflare Pages preview deployment for every pull request, so the
  # branch's build gets a shareable URL before it merges. Requires two repo
  # secrets — CLOUDFLARE_API_TOKEN (a token with the "Cloudflare Pages: Edit"
  # permission) and CLOUDFLARE_ACCOUNT_ID — and a Cloudflare Pages project named
  # "rpg-maker-clone" (create it once in the dashboard as a "Direct Upload"
  # project). See docs/deploy.md for the one-time setup.
  preview-cloudflare:
    needs: wasm
    # Only PRs from branches in this repo — forks and Dependabot can't read the
    # secrets, so skip them instead of failing the job.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Job-level env can read secrets (job-level `if` cannot), so expose whether
    # Cloudflare is configured to a step that gates the deploy. This keeps the
    # PR green when the optional Cloudflare setup hasn't been done yet, instead
    # of failing the required check on a missing secret.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set — skipping the preview deployment. See docs/deploy.md for the one-time setup."
          fi
      - name: Download wasm page
        if: steps.creds.outputs.configured == 'true'
        uses: actions/download-artifact@v7
        with:
          name: wasm
          path: site
      - name: Deploy preview to Cloudflare Pages
        id: cf
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Any --branch other than the project's production branch is published
          # as a preview; the PR head branch is never master, so this is always
          # a preview deployment.
          command: >-
            pages deploy site
            --project-name=rpg-maker-clone
            --branch=${{ github.head_ref }}
            --commit-hash=${{ github.event.pull_request.head.sha }}
            --commit-dirty=true
      - name: Comment preview URL on the PR
        if: ${{ steps.cf.outputs.deployment-url != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cloudflare-preview
          message: |
            ### ⚡ Cloudflare Pages preview

            | | |
            | --- | --- |
            | **Preview URL** | ${{ steps.cf.outputs.deployment-url }} |
            | **Commit** | ${{ github.event.pull_request.head.sha }} |

            Open the link and load an RPG Maker project with the on-page loader.
