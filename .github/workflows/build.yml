# CI for rpg-maker-clone: native and browser builds, bc2cpp, the device
# firmwares and their emulator smokes, and the Pages / Cloudflare deploys.
#
# Conventions used throughout:
# - Every checkout is quiet (`show-progress: false`) and drops its persisted
#   credentials: nothing below runs an authenticated git command.
# - Only `preview-gate`, `wasm` and `preview-cloudflare` take part in the
#   `/preview` flow; every other job opts out with
#   `github.event_name != 'issue_comment'`.
# - Display-using smokes take a distinct `--server-num`, never `-a`, whose
#   display probe is not atomic. Each step names its own number.
#
# Background on the device and emulator jobs lives in docs/ci.md and the
# per-port READMEs under app/.

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Builds each PR merged onto the latest master, plus the PRs queued ahead of
  # it. Without this trigger a queued PR never gets its required checks.
  merge_group:
    types: [ checks_requested ]

  # `/preview` on a pull request publishes a Cloudflare Pages preview.
  issue_comment:
    types: [ created ]

  workflow_dispatch:

# A new push to a pull request supersedes the run for its previous commit.
# Everything else gets a unique group and is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filters for jobs that should skip when their inputs did not change.
  # `workflow_dispatch` ignores the psp filter (see the psp jobs' `if:`).
  changes:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04
    outputs:
      psp: ${{ steps.filter.outputs.psp }}
      # Docs, changelog fragments and markdown cannot change a compiled result.
      code: ${{ steps.filter.outputs.code }}
      # On a pull request these device jobs run only when their own files changed.
      android: ${{ steps.filter.outputs.android }}
      maix: ${{ steps.filter.outputs.maix }}
      nano7: ${{ steps.filter.outputs.nano7 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          show-progress: false
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            psp:
              - 'app/psp/**'
              - '.github/workflows/build.yml'
            code:
              - '**'
              - '!docs/**'
              - '!changelog.d/**'
              - '!**/*.md'
              - '.github/**'
            android:
              - 'app/android/**'
              - 'scripts/android_smoke_check.bash'
              - 'CMakeLists.txt'
              - 'cmake/**'
              - 'build_config.rb'
              - '.github/workflows/build.yml'
            maix:
              - 'app/maix/**'
              - 'app/shared/**'
              - 'scripts/maix/**'
              - 'scripts/gen/maix-hello-game.rb'
              - 'build_config.rb'
              - '.github/workflows/build.yml'
            nano7:
              - 'app/nano7/**'
              - 'app/shared/**'
              - 'scripts/nano7/**'
              - 'scripts/export_nano7_map*.rb'
              - 'scripts/stage_nano7_walk_app.bash'
              - 'scripts/download/nepheshel.bash'
              - '.github/workflows/build.yml'

  # Native desktop build, its test suite, and the in-game smokes.
  build:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04

    env:
      SCCACHE_GHA_ENABLED: "true"
      ACTIONS_CACHE_SERVICE_V2: "on"
      # sccache writes one cache blob per compilation unit, so only a push to
      # master may write; other triggers read master's warm cache.
      SCCACHE_GHA_RW_MODE: >-
        ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master')
            && 'READ_WRITE' || 'READ_ONLY' }}
      # Routes the game-archive downloads through the CORS proxy's R2 cache
      # (docs/cors-proxy.md). Empty in forks, where URLs pass through unchanged.
      CORS_PROXY_URL: ${{ secrets.CORS_PROXY_URL }}

    steps:
      - uses: nixbuild/nix-quick-install-action@v35

      # Cache keys hash repository files, so checkout must finish before restores.
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # Submodules are initialized below so this job skips 3rd/SDL,
          # 3rd/SDL_mixer and 3rd/optcarrot.
          submodules: false
          show-progress: false
          persist-credentials: false

      # Cache actions stay in the foreground: background JavaScript actions
      # read GITHUB_EVENT_PATH, which the runner truncates while steps run.
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
        timeout-minutes: 15
      - name: cache rtp
        uses: actions/cache@v6
        id: rtp-cache
        with:
          path: scripts/*.zip
          key: rtp-${{ hashFiles('./scripts/rtp/*install.bash') }}
          restore-keys: rtp-
        timeout-minutes: 10
      - name: cache wine prefix
        uses: actions/cache@v6
        id: wine-prefix-cache
        with:
          # The RTP installers skip the wine install once ~/.wine is populated.
          path: ~/.wine
          key: wine-prefix-${{ hashFiles('./scripts/rtp/*install.bash') }}
          restore-keys: wine-prefix-
        timeout-minutes: 10
      - name: cache test game
        uses: actions/cache@v6
        id: cache
        with:
          path: data
          key: game-${{ hashFiles('./scripts/download/*.bash', './scripts/gen/mv-sample.py', './scripts/gen/sample-font.py', './data/mv-sample/data/**', './data/mv-sample/img/**', './data/mv-sample/audio/**', './data/mv-sample/fonts/**', './data/mv-sample/js/main.js', './data/mv-sample/js/plugins.js', './data/mv-sample/index.html', './scripts/gen/mz-sample.py', './data/mz-sample/data/**', './data/mz-sample/img/**', './data/mz-sample/audio/**', './data/mz-sample/fonts/**', './data/mz-sample/js/plugins.js', './data/mz-sample/index.html') }}
        timeout-minutes: 10

      # The vendored SDL submodules are linked only by the Android build; here
      # CMake finds the nix devshell's SDL2. See scripts/checkout-submodules.bash.
      - name: Init submodules
        env:
          SKIP_SUBMODULES: 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      # Realises the dev shell and exports PATH, compiler launchers, etc. into
      # $GITHUB_ENV and $GITHUB_PATH, so later steps run commands directly.
      - run: ./scripts/nix/develop-export-env.bash

      # The native compile is the long pole. The downloads and pre-commit run as
      # `background: true` steps that overlap it. Each download is idempotent,
      # so the steps run unconditionally. Every write lands on a git-ignored
      # path, so nothing races pre-commit's `git diff`.
      - name: Download RTP
        id: dl-rtp
        background: true
        timeout-minutes: 20
        run: |
          ./scripts/rtp/install.bash
          ./scripts/rtp/2003_install.bash
          ./scripts/rtp/xp_install.bash
          ./scripts/rtp/vx_install.bash
          ./scripts/rtp/vxace_install.bash

      - name: Download game
        id: dl-game
        background: true
        timeout-minutes: 15
        run: |
          ./scripts/download/nepheshel.bash
          ./scripts/download/mtf-meido-action.bash
          ./scripts/download/opengame-xp.bash
          ./scripts/download/prayforyou.bash
          ./scripts/download/yumenikki.bash
          ./scripts/download/killer-knights.bash
          ./scripts/download/histoire.bash

      - name: Download MV test game
        id: dl-mv
        background: true
        timeout-minutes: 10
        run: ./scripts/download/lunatic-core.bash

      - name: Build MV sample engine
        id: dl-mv-sample
        background: true
        timeout-minutes: 10
        run: ./scripts/download/mv-corescript.bash

      - name: Fetch MZ corescript
        id: dl-mz-sample
        background: true
        timeout-minutes: 10
        run: ./scripts/download/mz-corescript.bash

      - name: cache freepats
        uses: actions/cache@v6
        id: freepats-cache
        with:
          path: assets/.freepats
          key: freepats-${{ hashFiles('./scripts/download/freepats.bash') }}
        timeout-minutes: 10

      # Not committed (~32 MiB). Without them the `timidity_patches` check
      # skips and any .mid the smoke tests touch plays silence.
      - name: Download MIDI patches
        id: dl-freepats
        background: true
        timeout-minutes: 10
        run: ./scripts/download/freepats.bash

      # Fallback UI font for projects that ship none. Not committed (~1.7 MiB).
      - name: Download default font
        id: dl-default-font
        background: true
        timeout-minutes: 5
        run: ./scripts/download/default-font.bash

      - name: pre-commit
        id: pre-commit
        background: true
        env:
          SKIP: nixfmt
        run: |
          pre-commit run -a || (
            git diff --exit-code ;
            false
          )

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      # The devshell's sccache has no read-only GHA mode, so compile through
      # the action's own sccache instead.
      - name: Use the sccache from sccache-action
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=$SCCACHE_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=$SCCACHE_PATH" >> "$GITHUB_ENV"

      # ENABLE_TIME_REPORT adds -ftime-report-details so the log feeds the
      # compile-time report step below.
      - name: cmake
        run: |
          cmake -S . -B build -GNinja -DENABLE_TIME_REPORT=ON

      - name: build
        run: |
          cmake --build build 2>&1 | tee build.log

      - name: sccache stats
        if: always()
        run: |
          {
            echo "## sccache stats"
            echo ""
            echo '```'
            sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `if: always()` so a failed build still reports where its time went.
      - name: compile-time report
        if: always()
        run: ruby scripts/compile_time_report.rb build.log

      # Barrier: lint and every download must finish before the checks below.
      # A failed background step fails the job here.
      - name: Wait for lint and downloads
        wait:
          [pre-commit, dl-rtp, dl-game, dl-mv, dl-mv-sample, dl-mz-sample,
           dl-freepats, dl-default-font]

      - name: Prepare screenshot dir
        run: mkdir -p ss

      # Post-build checks run concurrently in one `parallel` group. The runner
      # caps concurrency at about a dozen, so the long MZ play-out modes are
      # listed first to claim a slot as soon as the barrier opens.
      #
      # Required steps fail the group and the job. The MV smokes and the MZ
      # runtime bring-up are non-blocking (continue-on-error).
      - parallel:
          - name: MZ battle smoke test
            continue-on-error: true
            env:
              MZ_MODE: battle
            run: ./scripts/mz/boot_check.bash 111

          # Reaching Scene_Battle is weaker than a fight working. This mode plays
          # the fight out and asserts `damaged=true ended=true`.
          - name: MZ battle-play smoke test
            continue-on-error: true
            env:
              MZ_MODE: battle_play
            run: ./scripts/mz/boot_check.bash 111

          # Common events, both kinds: parallel (Game_CommonEvent) and
          # Call Common Event (a nested child interpreter).
          # A random encounter from the map's encounter list, on map 2 (map 1
          # must stay encounter-free for the move probe).
          - name: MZ encounter smoke test
            continue-on-error: true
            env:
              MZ_MODE: encounter
            run: ./scripts/mz/boot_check.bash 111

          - name: MZ common event smoke test
            continue-on-error: true
            env:
              MZ_MODE: common
            run: ./scripts/mz/boot_check.bash 111

          # Scene_Equip, asserting `stronger=true`: the slot filling is not
          # enough, the displayed number must change too.
          - name: MZ equip smoke test
            continue-on-error: true
            env:
              MZ_MODE: equip
            run: ./scripts/mz/boot_check.bash 111

          - name: MZ menu smoke test
            continue-on-error: true
            env:
              MZ_MODE: menu
            run: ./scripts/mz/boot_check.bash 111

          # Opens the menu, uses a Potion, and unwinds. Asserts `healed`, `used`
          # and `returned`.
          - name: MZ menu-play smoke test
            continue-on-error: true
            env:
              MZ_MODE: menu_play
            run: ./scripts/mz/boot_check.bash 111

          # The encrypted-assets path: assets are XHR'd and decrypted in JS, so
          # it is a different loading path from the plain bed. The encrypted
          # project is derived here, not committed.
          - name: MZ encrypted-assets smoke test
            continue-on-error: true
            run: ./scripts/mz/encrypted_check.bash 113

          # Shows a message and a two-way choice, then picks the second entry.
          # `picked=false` means the choice was never made.
          - name: MZ message-play smoke test
            continue-on-error: true
            env:
              MZ_MODE: message_play
            run: ./scripts/mz/boot_check.bash 111

          # Sprite-based MV animations (`frames` array), not Effekseer. Asserts
          # `mv=true` and `played=true`; the frame check proves the art drew.
          - name: MZ animation smoke test
            continue-on-error: true
            env:
              MZ_MODE: animation
            run: ./scripts/mz/boot_check.bash 111

          - name: test
            run: |
              cmake --build build -t test

          # Boots the real RPG2000/2003 test bed past the title into the map.
          # The CRuby host checks cannot catch mruby/CRuby divergence.
          - name: RPG2k real-game boot smoke test
            run: ./scripts/rpg2k/boot_check.bash 109

          # Guards the RPG2000 map scene's per-frame mruby allocation rate
          # against a ceiling taken from this scene's baseline (docs/profiling.md).
          - name: RPG2k per-frame allocation regression check
            env:
              SERVER_NUM: 122
            run: ./scripts/rpg2k/alloc_regression_check.rb

          # RPG XP: each pass runs its own engine on a reserved display, so the
          # passes overlap instead of adding up. The editor bed runs script
          # host, battle and save. Pray for You (released, Game.rgssad only)
          # runs script host alone. See rpgxp_boot_check.bash.
          - name: RPG XP real-game boot smoke test (script host, editor bed)
            env:
              RPGXP_BOOT_PASS: script_host
            run: |
              ./scripts/rpgxp/boot_check.bash 112 \
                data/OpenGame.exe/Testbed/XP

          - name: RPG XP real-game boot smoke test (battle, editor bed)
            env:
              RPGXP_BOOT_PASS: battle
            run: |
              ./scripts/rpgxp/boot_check.bash 113 \
                data/OpenGame.exe/Testbed/XP

          - name: RPG XP real-game boot smoke test (save, editor bed)
            env:
              RPGXP_BOOT_PASS: save
            run: |
              ./scripts/rpgxp/boot_check.bash 114 \
                data/OpenGame.exe/Testbed/XP

          - name: RPG XP real-game boot smoke test (script host, Pray for You)
            env:
              RPGXP_BOOT_PASS: script_host
            run: |
              ./scripts/rpgxp/boot_check.bash 115 \
                data/PrayforYou

          # Packs the same bed with and without a title graphic inside the
          # encrypted archive, and asserts the engine finds it only when present.
          - name: RGSSAD packed-asset smoke test
            run: ./scripts/rgssad/asset_check.bash 120

          # MV screenshot and play steps. MV captures read back the WebGL FBO
          # every frame, which costs time roughly proportional to the 816x624
          # canvas, hence the longer budgets.
          - name: MV boot smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=100 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=15000 --game_dir data/Lunatic-Core --test_play \
                --mv_screenshot=ss/mv_title.png

          # New Game, then hold a direction. Passes only on `[MV-MOVE] moved=true`,
          # since a clean exit alone let a stuck-tileset regression through.
          - name: MV real-game play smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=105 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=20000 --game_dir data/Lunatic-Core --test_play \
                --mv_new_game --mv_move_test --mv_screenshot=ss/mv_play.png \
                | tee ss/mv_play.log
              grep -q '\[MV-MOVE\].*moved=true' ss/mv_play.log ||
                { echo "player never moved ([MV-MOVE] moved=true missing)"; exit 1; }

          - name: MV sample smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=101 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=15000 --game_dir data/mv-sample --test_play \
                --mv_new_game --mv_screenshot=ss/mv_sample.png

          # RPG Maker MZ play smoke on the committed data/mz-sample project, via
          # the native surfaceless-EGL renderer. Asserts the boot reaches a real
          # scene, New Game reaches the start map, and the player moves.
          - name: MZ play smoke test
            continue-on-error: true
            run: ./scripts/mz/boot_check.bash 111

          # The rest of the MZ in-game paths. Each mode asserts its own success line.
          - name: MZ message smoke test
            continue-on-error: true
            env:
              MZ_MODE: message
            run: ./scripts/mz/boot_check.bash 111

          # Leaves the start map. Asserts the map id changed, the player landed,
          # and the destination's own parallel event ran.
          - name: MZ transfer smoke test
            continue-on-error: true
            env:
              MZ_MODE: transfer
            run: ./scripts/mz/boot_check.bash 111

          - name: MZ save smoke test
            continue-on-error: true
            env:
              MZ_MODE: save
            run: ./scripts/mz/boot_check.bash 111

          # Battle against the real bed: Lunatic-Core ships battlers and a
          # battleback, so the frame shows an actual battle.
          - name: MV battle smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=102 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=30000 --game_dir data/Lunatic-Core --test_play \
                --mv_battle_test=1 --mv_screenshot=ss/mv_battle.png

          - name: MV movement smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=103 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=6000 --game_dir data/mv-sample --test_play \
                --mv_new_game --mv_move_test \
                | tee ss/mv_move.log
              grep -q '\[MV-MOVE\].*moved=true' ss/mv_move.log ||
                { echo "player never moved ([MV-MOVE] moved=true missing)"; exit 1; }

          - name: MV message smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=104 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=15000 --game_dir data/mv-sample --test_play \
                --mv_new_game --mv_message_test --mv_screenshot=ss/mv_message.png

          # Opens the party menu from Scene_Map and logs `[MV-MENU] reached_menu=`.
          - name: MV menu smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=106 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=15000 --game_dir data/mv-sample --test_play \
                --mv_new_game --mv_menu_test --mv_screenshot=ss/mv_menu.png

          # Save and load round-trip through DataManager. Non-visual.
          - name: MV save smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=107 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=6000 --game_dir data/mv-sample --test_play \
                --mv_new_game --mv_save_test

          # Plays the sample's SE through AudioManager -> RGSS::Audio. CI has no
          # audio device, so this checks the op dispatches, not that it is audible.
          - name: MV audio smoke test
            continue-on-error: true
            run: |
              ./scripts/quiet_alsa.bash \
                xvfb-run --server-num=108 timeout 120 ./build/rpg_maker_clone \
                --timeout_ms=6000 --game_dir data/mv-sample --test_play \
                --mv_new_game --mv_audio_test

      # Runs after the parallel group's implicit wait: compares the five MZ
      # frames the smokes above wrote. Skips cleanly if none were written.
      - name: MZ frame check
        continue-on-error: true
        if: always()
        run: ruby scripts/mz/frame_check.rb ss

      - name: Upload MV screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-screenshot
          path: ss/mv_title.png
          if-no-files-found: warn

      - name: Upload MV play screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-play-screenshot
          path: ss/mv_play.png
          if-no-files-found: warn

      - name: Upload MV sample screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-sample-screenshot
          path: ss/mv_sample.png
          if-no-files-found: warn

      - name: Upload MV battle screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-battle-screenshot
          path: ss/mv_battle.png
          if-no-files-found: warn

      - name: Upload MV message screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-message-screenshot
          path: ss/mv_message.png
          if-no-files-found: warn

      - name: Upload MV menu screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-menu-screenshot
          path: ss/mv_menu.png
          if-no-files-found: warn

      - name: Upload MZ play screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mz-play-screenshot
          path: ss/mz_play.png
          if-no-files-found: warn

      - name: Upload MZ scene screenshots
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mz-scene-screenshots
          path: |
            ss/mz_message.png
            ss/mz_menu.png
            ss/mz_save.png
            ss/mz_battle.png
          if-no-files-found: warn

  # Closed-world bc2cpp build of the sealed RPG2000/2003 desktop host: the four
  # *-compiled gems are generated and compiled into a native libmruby.a with C++
  # exceptions on. Not a cross library: the generated code throws, and the maix
  # cross build uses -fno-exceptions. The RISC-V cross-compile is covered by the `maix` job.
  # `bc2cpp` aggregates this job under the old status-check name.
  bc2cpp-build:
    if: ${{ github.event_name != 'issue_comment' && needs.changes.outputs.code == 'true' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      RUBY_YJIT_ENABLE: "1"

    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # Same submodule set as the `maix` job.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: >-
            3rd/effekseer 3rd/gflags 3rd/ng-log
            3rd/inicpp 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-bc2cpp-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-bc2cpp-${{ runner.os }}-

      - name: Set up development environment
        # The bc2cpp shell skips the game, graphics and Wine closures.
        run: ./scripts/nix/develop-export-env.bash .#bc2cpp

      - name: Verify host Ruby JIT
        run: ruby -e 'abort "YJIT is unavailable or disabled" unless RubyVM::YJIT.enabled?; puts RUBY_DESCRIPTION'

      # Persisted across runs. Entries are keyed on content digests, so a stale
      # restore is recomputed rather than trusted (docs/ci.md, "Scan cache").
      - name: Cache bc2cpp scan cache
        uses: actions/cache@v6
        with:
          path: build/bc2cpp-cache
          key: bc2cpp-scan-cache-${{ hashFiles('tools/bc2cpp/*.rb') }}
          restore-keys: bc2cpp-scan-cache-

      # Full-core libmruby used by the behavioural checks. Takes about two
      # minutes, and depends only on the mruby pins and the build scripts.
      - name: Key for the full-core libmruby cache
        id: full-core-key
        run: |
          echo "mruby=$(git rev-parse HEAD:3rd/mruby)" >> "$GITHUB_OUTPUT"
          echo "stringio=$(git rev-parse HEAD:3rd/mruby-stringio)" >> "$GITHUB_OUTPUT"
      - name: Cache the full-core libmruby build
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bc2cpp-full
          key: bc2cpp-full-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.*') }}-${{ steps.full-core-key.outputs.mruby }}-${{ steps.full-core-key.outputs.stringio }}-${{ hashFiles('scripts/bc2cpp/fixture_runtime.rb', 'scripts/mruby/**', 'scripts/bc2cpp/*.bash', 'patches/mruby*.patch') }}

      - name: Build the closed-world mruby with bc2cpp
        timeout-minutes: 45
        # `-m` lets rake run every prerequisite concurrently.
        env:
          RAKEOPT: -m -j4
        # The devshell exports LD=ld, which would link mrbc without libc. quiet_run prints the build's
        # output only when it fails (docs/ci.md, "Quiet output").
        run: env -u LD scripts/ci/quiet_run.bash scripts/bc2cpp/closed_build.bash "$GITHUB_WORKSPACE/build-closed-bc2cpp"

      - name: Check the compiled gems are in the closed-world build
        run: |
          for gem in mruby-lcf-compiled mruby-rgss-compiled mruby-rpg2k-compiled mruby-core-compiled; do
            ls build-closed-bc2cpp/closed/mrbgems/$gem/*_gen.cpp
          done
          ls -l build-closed-bc2cpp/closed/lib/libmruby.a
          # libmruby must carry the C++ exception wrapper, since the generated code throws.
          ar t build-closed-bc2cpp/closed/lib/libmruby.a | grep -qx 'error-cxx.o'
          nm build-closed-bc2cpp/closed/lib/libmruby.a 2>/dev/null | grep -q ' U __cxa_throw$'

      - name: Prepare shared check libraries
        run: |
          mrbc=$(find "$GITHUB_WORKSPACE/build-closed-bc2cpp/host" -path '*/bin/mrbc' -type f -print -quit)
          [ -n "$mrbc" ] || { echo "::error::no host mrbc in build-closed-bc2cpp"; exit 1; }
          echo "MRBC=$mrbc" >> "$GITHUB_ENV"
          env -u LD BC2CPP_FULL_BUILD_DIR="$RUNNER_TEMP/bc2cpp-full" ruby -r ./scripts/bc2cpp/fixture_runtime -e 'abort "full-core mruby unavailable" unless Bc2cppFixtureRuntime.full_or_build'
          echo "BC2CPP_MRUBY_FULL=$RUNNER_TEMP/bc2cpp-full/host" >> "$GITHUB_ENV"

      - name: Check bc2cpp registrations
        run: ruby scripts/ci/check_registry.rb

      # Facts for the binding-split check: libclang extraction of every RGSS
      # native binding, cached across runs. Entries are keyed on everything the
      # extractor reads (Nix pin, mruby headers, RGSS sources and repo headers,
      # generated build headers from build-closed-bc2cpp, the extractor itself)
      # — but not on the classifier scripts, so a classifier-only change
      # re-runs the check against fresh-or-identical facts. A hit skips `nix
      # develop .#clang` and libclang entirely.
      - name: Key for the native binding facts cache
        id: binding-facts-key
        run: |
          echo "mruby=$(git rev-parse HEAD:3rd/mruby)" >> "$GITHUB_OUTPUT"
          echo "unialgo=$(git rev-parse HEAD:3rd/uni-algo)" >> "$GITHUB_OUTPUT"
          echo "build=$(find build-closed-bc2cpp/closed/include build-closed-bc2cpp/closed/mrbgems/mruby-rgss -type f 2>/dev/null | sort | xargs -r sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache native binding facts
        id: binding-facts
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/binding-facts
          key: binding-facts-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.*') }}-${{ steps.binding-facts-key.outputs.mruby }}-${{ steps.binding-facts-key.outputs.unialgo }}-${{ hashFiles('mruby-rgss/src/**', 'include/**', 'scripts/native/binding_facts.py') }}-${{ steps.binding-facts-key.outputs.build }}
          restore-keys: binding-facts-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Extract native binding facts
        if: steps.binding-facts.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/binding-facts"
          RGSS_MRUBY_BUILD_DIR=build-closed-bc2cpp/host nix develop .#clang -c python3 scripts/native/binding_facts.py --config host --out "$RUNNER_TEMP/binding-facts/facts_host.json"
          RGSS_MRUBY_BUILD_DIR=build-closed-bc2cpp/host nix develop .#clang -c python3 scripts/native/binding_facts.py --config closed --out "$RUNNER_TEMP/binding-facts/facts_closed.json"
          RGSS_MRUBY_BUILD_DIR=build-closed-bc2cpp/host nix develop .#clang -c python3 scripts/native/binding_facts.py --config emscripten --out "$RUNNER_TEMP/binding-facts/facts_emscripten.json"
      # Four workers fill the 4-vCPU runner. Longer checks start first so a
      # large fixture does not land on the last worker. timed_checks prints
      # each log and propagates failures.
      - name: Run bc2cpp checks
        timeout-minutes: 30
        run: |
          unset LD
          ruby scripts/ci/timed_checks.rb > "$RUNNER_TEMP/bc2cpp-checks.sh" <<'CHECKS'
          # ci:parallel begin 4
          ruby scripts/bc2cpp/type_check.rb --no-sends
          ruby scripts/bc2cpp/sealed_host_check.rb
          ruby scripts/bc2cpp/ir_context_results_check.rb
          ruby scripts/bc2cpp/block_iterator_direct_check.rb
          ruby scripts/bc2cpp/explicit_block_arg_direct_check.rb
          ruby scripts/bc2cpp/stack_block_check.rb
          ruby scripts/bc2cpp/ensure_nested_rescue_check.rb
          ruby scripts/bc2cpp/array_new_block_check.rb
          ruby scripts/bc2cpp/class_method_block_check.rb
          ruby scripts/bc2cpp/entry_header_check.rb
          ruby scripts/bc2cpp/unregistered_verify_check.rb
          ruby scripts/bc2cpp/yield_c_boundary_check.rb
          ruby scripts/bc2cpp/module_function_scope_check.rb
          ruby scripts/bc2cpp/escape_receiver_flow_check.rb
          ruby scripts/bc2cpp/skipped_direct_call_check.rb
          ruby scripts/bc2cpp/array_literal_block_check.rb
          ruby scripts/bc2cpp/send_arg_facts_check.rb
          ruby scripts/bc2cpp/constant_typing_check.rb
          ruby scripts/bc2cpp/base_section_check.rb --output build-closed-bc2cpp/base_rbs --jobs 4 build-closed-bc2cpp/closed
          RGSS_MRUBY_BUILD_DIR=build-closed-bc2cpp/host ruby scripts/native/binding_split.rb check --facts "$RUNNER_TEMP/binding-facts"
          ruby scripts/bc2cpp/stack_tuples_check.rb
          ruby scripts/bc2cpp/block_self_world_check.rb
          ruby scripts/bc2cpp/outside_owner_call_check.rb
          ruby scripts/bc2cpp/static_owner_dispatch_check.rb
          ruby scripts/bc2cpp/owner_set_direct_check.rb
          ruby scripts/bc2cpp/static_dispatch_scan_check.rb
          ruby scripts/bc2cpp/frozen_literal_persist_check.rb
          ruby scripts/bc2cpp/constructor_overloads_check.rb
          ruby scripts/bc2cpp/ir_argument_types_check.rb
          ruby scripts/bc2cpp/shared_generation_check.rb
          ruby scripts/bc2cpp/define_method_check.rb
          ruby scripts/bc2cpp/generic_block_return_check.rb
          ruby scripts/bc2cpp/ir_block_protocols_check.rb
          ruby scripts/bc2cpp/block_yielders_check.rb
          ruby scripts/bc2cpp/type_check_run_check.rb
          ruby scripts/bc2cpp/block_yield_types_check.rb
          ruby scripts/bc2cpp/type_check_iterate_check.rb
          ruby scripts/bc2cpp/rbs_mixin_contracts_check.rb
          ruby scripts/bc2cpp/self_call_override_contracts_check.rb
          ruby scripts/bc2cpp/explicit_receiver_override_contracts_check.rb
          ruby scripts/bc2cpp/module_includer_bound_check.rb
          ruby scripts/bc2cpp/lcf_join_array_check.rb
          ruby scripts/bc2cpp/alias_method_check.rb
          ruby scripts/bc2cpp/frozen_hash_lookup_check.rb
          ruby scripts/bc2cpp/record_hash_update_check.rb
          ruby scripts/bc2cpp/record_nilable_read_check.rb
          ruby scripts/bc2cpp/constructor_optionals_check.rb
          ruby scripts/bc2cpp/operator_sends_check.rb
          ruby scripts/bc2cpp/setter_receiver_filter_check.rb
          ruby scripts/bc2cpp/exact_arith_check.rb
          ruby scripts/bc2cpp/element_picks_check.rb
          ruby scripts/bc2cpp/sealed_hash_stores_check.rb
          ruby scripts/bc2cpp/nilable_class_tests_check.rb
          ruby scripts/bc2cpp/optional_arg_pools_check.rb
          ruby scripts/bc2cpp/audit_pins_check.rb
          ruby scripts/bc2cpp/setter_name_closure_check.rb
          ruby scripts/bc2cpp/ir_ivar_types_check.rb
          ruby scripts/bc2cpp/ivar_candidates_check.rb
          ruby scripts/bc2cpp/nonlocal_return_candidate_check.rb
          ruby scripts/bc2cpp/immediate_ivars_check.rb
          ruby scripts/bc2cpp/placement_harness_check.rb
          ruby scripts/bc2cpp/ir_entry_seeds_check.rb
          ruby scripts/bc2cpp/self_new_leaf_check.rb
          ruby scripts/bc2cpp/sealed_int16_local_check.rb
          ruby scripts/bc2cpp/freeze_fold_check.rb
          ruby scripts/bc2cpp/callee_return_fold_check.rb
          ruby scripts/bc2cpp/range_compare_fold_check.rb
          ruby scripts/bc2cpp/constant_proofs_check.rb
          ruby scripts/bc2cpp/arm_prune_capture_check.rb
          ruby scripts/bc2cpp/block_receiver_proof_check.rb
          ruby scripts/bc2cpp/upvar_walks_check.rb
          ruby scripts/bc2cpp/irep_tree_check.rb
          ruby scripts/bc2cpp/ir_binary_operands_check.rb
          ruby scripts/bc2cpp/param_trace_elements_check.rb
          ruby scripts/bc2cpp/arm_prune_block_check.rb
          ruby scripts/bc2cpp/param_fold_check.rb
          ruby scripts/bc2cpp/ir_blocks_check.rb
          ruby scripts/bc2cpp/decided_branch_check.rb
          ruby scripts/bc2cpp/arm_prune_check.rb
          ruby scripts/bc2cpp/plain_yielder_check.rb
          ruby scripts/bc2cpp/struct_receiver_check.rb
          ruby scripts/bc2cpp/receiver_origin_join_check.rb
          ruby scripts/bc2cpp/constant_argument_sites_check.rb
          ruby scripts/bc2cpp/dynamic_names_probe_check.rb
          ruby scripts/bc2cpp/native_member_tables_check.rb
          ruby scripts/bc2cpp/native_callbacks_check.rb
          ruby scripts/bc2cpp/io_open_check.rb
          ruby scripts/bc2cpp/bytecode_ir_constants_check.rb
          ruby scripts/bc2cpp/ir_soundness_classes_check.rb
          ruby scripts/bc2cpp/numeric_roots_reaching_check.rb
          ruby scripts/bc2cpp/game_variables_receiver_check.rb
          ruby scripts/bc2cpp/core_facts_rbs_check.rb --require-mruby
          ruby scripts/bc2cpp/trace_merge_check.rb
          ruby scripts/bc2cpp/ir_trace_evidence_check.rb
          ruby scripts/bc2cpp/base_section_regen_check.rb
          ruby scripts/bc2cpp/promote_candidates_check.rb
          ruby scripts/bc2cpp/native_core_direct_wired_check.rb
          ruby scripts/bc2cpp/ir_join_soundness_check.rb
          ruby scripts/bc2cpp/enum_target_flow_check.rb
          ruby scripts/bc2cpp/name_argument_flow_check.rb
          ruby scripts/bc2cpp/def_value_flow_check.rb
          ruby scripts/bc2cpp/symbol_flow_check.rb
          ruby scripts/bc2cpp/loop_element_writes_check.rb
          ruby scripts/bc2cpp/native_core_candidates_check.rb
          ruby scripts/bc2cpp/native_format_types_check.rb
          ruby scripts/bc2cpp/decided_fold_count_check.rb
          ruby scripts/bc2cpp/class_bodies_check.rb
          # ci:parallel end
          CHECKS
          source "$RUNNER_TEMP/bc2cpp-checks.sh"


  # Aggregate `bc2cpp` status check. Keeps the name of the old one-job `bc2cpp`,
  # so a required check on it needs no settings change.
  bc2cpp:
    if: ${{ always() && github.event_name != 'issue_comment' }}
    needs: [changes, bc2cpp-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the bc2cpp build to succeed
        env:
          CODE: ${{ needs.changes.outputs.code }}
          BUILD: ${{ needs.bc2cpp-build.result }}
        run: |
          echo "code: $CODE, bc2cpp-build: $BUILD"
          # A skipped build is fine only when no code changed.
          [ "$BUILD" = success ] || { [ "$CODE" != true ] && [ "$BUILD" = skipped ]; }

  # Ruby-only checks. They load the mruby-*/mrblib sources under CRuby, so
  # they never need the C++ toolchain or the engine binary and run alongside
  # `build` instead of behind it.
  ruby-checks:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04

    env:
      CORS_PROXY_URL: ${{ secrets.CORS_PROXY_URL }}
      # The checks run under CRuby, where YJIT still helps (docs/ci.md).
      RUBY_YJIT_ENABLE: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          # Only 3rd/mruby is read: tools/bc2cpp/native_names.rb derives its
          # operator table from 3rd/mruby/lib/mruby/presym.rb.
          submodules: false
          show-progress: false
          persist-credentials: false

      # Shallow, and only the gems the closed-world closure reads
      # (compiled_gems.rb bc2cpp_rake_dependencies).
      - name: Init mruby submodules
        run: git submodule update --init --depth 1 3rd/mruby 3rd/mruby-stringio 3rd/mruby-marshal 3rd/mruby-onig-regexp

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - run: ./scripts/nix/develop-export-env.bash

      - name: cache test game
        uses: actions/cache@v6
        id: cache
        with:
          path: data
          key: game-${{ hashFiles('./scripts/download/*.bash', './scripts/gen/mv-sample.py', './scripts/gen/sample-font.py', './data/mv-sample/data/**', './data/mv-sample/img/**', './data/mv-sample/audio/**', './data/mv-sample/fonts/**', './data/mv-sample/js/main.js', './data/mv-sample/js/plugins.js', './data/mv-sample/index.html', './scripts/gen/mz-sample.py', './data/mz-sample/data/**', './data/mz-sample/img/**', './data/mz-sample/audio/**', './data/mz-sample/fonts/**', './data/mz-sample/js/plugins.js', './data/mz-sample/index.html') }}

      - name: Download game
        timeout-minutes: 15
        run: |
          ./scripts/download/nepheshel.bash
          ./scripts/download/mtf-meido-action.bash
          ./scripts/download/opengame-xp.bash
          ./scripts/download/prayforyou.bash
          ./scripts/download/yumenikki.bash
          ./scripts/download/killer-knights.bash
          ./scripts/download/histoire.bash
          ./scripts/download/monodori.bash
           ./scripts/download/wolfrpg-sample.bash

      - name: Cache bc2cpp scan cache
        uses: actions/cache@v6
        with:
          path: build/bc2cpp-cache
          key: bc2cpp-scan-cache-${{ hashFiles('tools/bc2cpp/*.rb') }}
          restore-keys: bc2cpp-scan-cache-

      - parallel:
          # Dynamic Ruby in code bc2cpp compiles as a closed world. New offences
          # fail, and fixed ones must leave the baseline.
          - name: RPG2k closed-world lint
            run: |
              ruby scripts/rpg2k/closed_world_lint_check.rb
              ruby scripts/rpg2k/closed_world_lint.rb
              ruby scripts/bc2cpp/lint_crosscheck_check.rb

          # Whole-program fixed points run under a hard round limit.
          - name: bc2cpp fixpoint bounds
            run: ruby scripts/bc2cpp/fixpoint_check.rb

          # Only C's own family is poisoned by an outside `@name` in its instance methods.
          - name: bc2cpp outside Ruby ivar scopes
            run: ruby scripts/bc2cpp/outside_ruby_ivar_scopes_check.rb

          # RGSS::Tts exists only in the desktop build.
          - name: RGSS::Tts only in the build that can back it
            run: ruby scripts/tts_limited_check.rb

          - name: CP932 table lookups match the reference
            run: ruby scripts/cp932_tables_check.rb

          - name: LCF schema coverage
            run: ruby scripts/lcf/schema_coverage.rb

          - name: RPG2003 battle-command data check
            run: ruby scripts/rpg2k3/battle_command_check.rb

          - name: RPG2003 battle row (front/back) check
            run: ruby scripts/rpg2k3/battle_row_check.rb

          - name: RPG2003 battle gauge (active-time) check
            run: ruby scripts/rpg2k3/battle_gauge_check.rb

          # Over the WOLF RPG Editor's official sample game.
          - name: WOLF RPG Editor test-bed check
            run: ruby scripts/wolf/testbed_check.rb

          # Drives every Common Event and every map event page, asserting that
          # nothing raises or hangs. Caught three infinite loops that the
          # hand-built unit fixtures missed.
          - name: WOLF RPG Editor interpreter soak check
            run: ruby scripts/wolf/interpreter_check.rb

          # A bare trailing keyword-style hash into Array#push/#unshift/#concat
          # silently pushes nothing on this mruby, with no exception to catch.
          # CRuby-hosted checks cannot see it, so this is a static scan.
          - name: mruby bare-hash-push check
            run: ruby scripts/mruby/bare_hash_push_check.rb

          - name: bc2cpp native, RBS and definer checks
            run: |
              ruby scripts/bc2cpp/name_strings_check.rb
              ruby scripts/bc2cpp/numeric_flow_speed_check.rb
              ruby scripts/bc2cpp/element_type_check.rb
              ruby scripts/bc2cpp/core_facts_rbs_check.rb
              ruby scripts/bc2cpp/base_rbs_check.rb
              ruby scripts/bc2cpp/foreign_definers_cache_check.rb
              ruby scripts/bc2cpp/native_api_lists_parity_check.rb

          - name: RPG2k game-logic checks
            run: |
              # The .lsd save, checked field by field against the live state.
              ruby scripts/rpg2k/lsd_authoritative_check.rb
              # Native pan lock, in-flight pan, and a moving picture with a Float opacity target.
              ruby scripts/rpg2k/lsd_pan_picture_check.rb
              # Typed save read path, plus saves this engine did not write: mismatches
              # become logged empty slots, and corruption never crashes.
              ruby scripts/lcf_save_typed_check.rb
              ruby scripts/rpg2k/lsd_adversarial_check.rb

      # Runs the host-side checks (the CHECKS list in scripts/coverage/report.rb)
      # under CRuby's Coverage stdlib. Report-only: no floor is enforced.
      # --require-needs fails if a test bed is missing. See docs/coverage.md.
      - name: Ruby coverage report
        run: ruby scripts/coverage/report.rb --require-needs

      # Publish even on a red run: the reporter writes its files before exiting non-zero.
      - name: Upload Ruby coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ruby-coverage
          path: |
            coverage/lcov.info
            coverage/coverage.json
          if-no-files-found: warn

  # `/preview` gate. Cloudflare previews are opt-in: a write-access maintainer
  # comments `/preview` on a PR. This job resolves the PR head and acknowledges
  # the command with a 👀 reaction.
  #
  # issue_comment runs with base-repo secrets even for fork PRs, so the author
  # check in `if:` is the security boundary.
  preview-gate:
    if: >-
      ${{ github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/preview')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
                      github.event.comment.author_association) }}
    # Only two `gh api` calls, so the small ubuntu-slim image is enough.
    runs-on: ubuntu-slim
    permissions:
      # The 👀 reaction on a PR conversation comment needs pull-requests: write;
      # issues: write alone returns 403.
      pull-requests: write
    outputs:
      head-sha: ${{ steps.pr.outputs.head-sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
    steps:
      - name: Resolve the pull request head
        id: pr
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '"head-sha=\(.head.sha)"' >> "$GITHUB_OUTPUT"

      - name: Acknowledge the command
        # A failed reaction must not cost the preview, which this job gates.
        continue-on-error: true
        run: |
          gh api --silent -X POST \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID/reactions" \
            -f content=eyes

  # Browser build (Emscripten). Also serves the `/preview` flow for the PR head.
  wasm:
    # Outside the comment flow, preview-gate is skipped and would skip this job
    # too, so the condition spells out both cases.
    needs: preview-gate
    if: >-
      ${{ !cancelled()
          && (github.event_name != 'issue_comment'
              || needs.preview-gate.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      # A /preview can build a fork's branch, so the token stays read-only.
      contents: read
    env:
      # ccache wraps emcc as a plain compiler. sccache does not understand emcc.
      # nixpkgs sets EM_CONFIG in the environment, so ccache does not bail out.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CORS_PROXY_URL: ${{ secrets.CORS_PROXY_URL }}
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # CMake's `if(EMSCRIPTEN)` branch takes SDL from Emscripten's ports, so no
          # vendored SDL or optcarrot is read.
          submodules: false
          # The PR head for a /preview; empty elsewhere, which means the triggering ref.
          ref: ${{ needs.preview-gate.outputs.head-sha }}
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # Background steps below run commands directly, with no `nix` calls,
      # so there is no store-lock contention between them.
      - run: ./scripts/nix/develop-export-env.bash

      # Fetches and builds the MIT MV engine into the committed sample, for the
      # one-click preset. It is packaged at link time, so the barrier before
      # `build` is early enough.
      - name: Build MV sample engine
        id: mv-sample
        background: true
        timeout-minutes: 10
        run: ./scripts/download/mv-corescript.bash

      - name: cache freepats
        uses: actions/cache@v6
        id: freepats-cache
        with:
          path: assets/.freepats
          key: freepats-${{ hashFiles('./scripts/download/freepats.bash') }}
        timeout-minutes: 10

      # Instrument samples for the TiMidity decoder (-sSDL2_MIXER_FORMATS).
      # Packaged into index.data at link time (-DWASM_MIDI_PATCHES=ON).
      - name: Download MIDI patches
        id: freepats
        background: true
        timeout-minutes: 10
        run: ./scripts/download/freepats.bash

      # Packaged at link time (-DWASM_DEFAULT_FONT=ON). Without it, a project
      # with no font of its own renders in the 12px bitmap font.
      - name: Download default font
        id: default-font
        background: true
        timeout-minutes: 5
        run: ./scripts/download/default-font.bash

      # Keyed on the toolchain pin rather than run_id: a unique key never gets an
      # exact hit and fills the 10GB per-repo cache, evicting the caches the other
      # jobs rely on.
      - uses: actions/cache@v6
        with:
          path: ~/.emscripten_cache
          key: ${{ runner.os }}-emcc-${{ hashFiles('flake.*') }}
          restore-keys: ${{ runner.os }}-emcc-

      # ccache contents change with the source, so it cannot use a toolchain key.
      # It rotates weekly instead: a week's pushes share one entry, and
      # restore-keys falls back to the previous week. That bounds growth to about
      # 52 entries a year.
      - name: Cache period
        id: cache-period
        run: echo "value=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore and cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: wasm-ccache-${{ steps.cache-period.outputs.value }}
          restore-keys: wasm-ccache-

      # Emscripten builds its system libraries on the first emcc call (~50s).
      # The nixpkgs hook points EM_CACHE at a temp dir, so override it on the
      # command so the libraries persist. It must be set for configure and build.
      - name: cmake
        # The launcher is stored in CMakeCache.txt, so setting ccache here also
        # covers the build step. It overrides the sccache the devShell exports.
        run: |
          env EM_CACHE="$HOME/.emscripten_cache" \
            CMAKE_C_COMPILER_LAUNCHER=ccache \
            CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            emcmake cmake -S . -B wasm-build -GNinja \
            -DWASM_SAMPLE_DIR=data/mv-sample \
            -DWASM_MIDI_PATCHES=ON \
            -DWASM_DEFAULT_FONT=ON
          # Warn when the Emscripten probe pre-seed did not apply. The build still
          # works, but it probes the toolchain the slow way (~100s).
          status="$(cat wasm-build/emscripten-probe-cache.status 2>/dev/null \
            || echo 'missing')"
          echo "Emscripten probe cache: $status"
          case "$status" in
            applied*) ;;
            *) echo "::warning::the Emscripten probe pre-seed did not apply" \
                 "($status), so the wasm configure probed the toolchain the" \
                 "slow way. Regenerate cmake/emscripten-probe-cache.cmake --" \
                 "see the header of that file." ;;
          esac

      # Re-probes the toolchain and diffs against the pre-seeded answers. The
      # seed's version guard cannot see a sysroot change under the same release.
      # It runs alongside the build, and the barrier below fails the job on drift.
      - name: Check the Emscripten probe cache
        id: probe-cache
        background: true
        run: |
          env EM_CACHE="$HOME/.emscripten_cache" \
            ./scripts/check_emscripten_probe_cache.bash

      # The link packages data/mv-sample, the MIDI patches and the default font.
      - name: Wait for the MV sample engine, MIDI patches and default font
        wait: [mv-sample, freepats, default-font]

      - name: build
        run: |
          ccache --zero-stats
          env EM_CACHE="$HOME/.emscripten_cache" \
            cmake --build wasm-build

      # Without the patch set the page does not fail, it goes silent: nearly all
      # RPG2000 BGM is MIDI. Checks the preload table in index.js directly.
      - name: Check the page carries the MIDI patch set
        run: |
          if ! grep -q '/timidity/timidity.cfg' wasm-build/timidity.js; then
            echo "::error::the wasm page has no MIDI patch set packaged, so" \
              "every .mid BGM/ME would be silent. Check the freepats download" \
              "and -DWASM_MIDI_PATCHES=ON in the cmake step above."
            exit 1
          fi
          echo "MIDI patch set present:"
          ls -la wasm-build/timidity*.data

      # Cloudflare Pages rejects files over 25 MiB, and nothing else catches it:
      # GitHub Pages allows 100 MiB, so only the preview deploy would fail.
      # scripts/pack-timidity-data.py splits the patches to stay under the limit.
      - name: Check no published file exceeds Cloudflare's 25 MiB limit
        run: |
          limit=$((25 * 1024 * 1024))
          status=0
          for f in wasm-build/index.html wasm-build/index.js \
                   wasm-build/index.wasm wasm-build/index.wasm.map \
                   wasm-build/index.data wasm-build/timidity.js \
                   wasm-build/timidity*.data; do
            [ -f "$f" ] || continue
            size="$(stat -c%s "$f")"
            printf '%-34s %6.1f MiB\n' "${f#wasm-build/}" \
              "$(echo "$size" | awk '{print $1/1048576}')"
            if [ "$size" -gt "$limit" ]; then
              echo "::error::${f#wasm-build/} is over Cloudflare Pages' 25 MiB" \
                "per-file limit, so /preview cannot deploy this page."
              status=1
            fi
          done
          exit $status

      - name: ccache stats
        if: always()
        # Can run with a background fetch still in flight, if the barrier failed.
        run: |
          {
            echo "## ccache stats — wasm"
            echo ""
            echo '```'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A drifted probe cache means the page was configured with stale answers.
      - name: Wait for the probe-cache check
        wait: [probe-cache]

      # index.wasm.map enables source-mapped wasm stack traces. The timidity
      # files carry the MIDI patch set, and dropping them would publish a page
      # whose BGM is silent.
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: |
            wasm-build/index.html
            wasm-build/index.js
            wasm-build/index.wasm
            wasm-build/index.wasm.map
            wasm-build/index.data
            wasm-build/timidity.js
            wasm-build/timidity*.data

  # Wio Terminal (SAMD51) firmwares, built with PlatformIO. Disabled until the
  # bc2cpp cross-build path is more stable; `wio-renode` is disabled with it.
  wio:
    # Builds all three Wio firmwares: `wio` (bring-up, display and input HAL),
    # `wio_walk` (the non-mruby map walk shared with nano 7G), and
    # `wio_sd_upload` (serial-to-SD loader). See app/wio/README.md.
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # PlatformIO's wio envs never reference 3rd/SDL, 3rd/SDL_mixer or
          # 3rd/optcarrot. LVGL is vendored and linked, so it is still needed.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        # -q leaves only warnings and errors in the log.
        run: pip install -q --disable-pip-version-check --upgrade platformio

      - name: Build firmware
        run: |
          pio run -e wio 2>&1 | tee wio-build.log
          pio run -e wio_walk 2>&1 | tee -a wio-build.log
          pio run -e wio_sd_upload 2>&1 | tee -a wio-build.log

      # Summarises the flash and SRAM budget, which is tight on this board.
      - name: wio size report
        if: always()
        run: ruby scripts/wio/size_report.rb wio-build.log

  # Maix Amigo (Kendryte K210). Like the PSP job, this builds the P0 and
  # game firmwares plus the `maix` mruby cross-build, so a patch or gem that
  # stops cross-compiling breaks CI. `maix-smoke` boots them under Renode.
  maix:
    if: ${{ github.event_name != 'issue_comment' && (github.event_name != 'pull_request' || needs.changes.outputs.maix == 'true') }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # The mruby cross-build needs 3rd/mruby, uni-algo, stb, lvgl, quickjs,
          # mruby-marshal, mruby-stringio, mruby-onig-regexp and mgem-list. The
          # rest go unused by this job.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: >-
            3rd/effekseer 3rd/gflags 3rd/ng-log
            3rd/inicpp 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install ruby/rake/gperf/bison
        # gperf and bison regenerate mruby-compiler's lexer and grammar when a
        # patch touches their sources, as the pinned fork commit does.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ruby rake gperf bison

      - name: Cache PlatformIO
        # Also installs the Kendryte toolchain that build_config.rb's maix
        # cross-build prefers, so the mruby objects and firmware share a compiler.
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install -q --disable-pip-version-check --upgrade platformio

      - name: Build P0 firmware
        # Also proves the bare toolchain produces a binary on its own.
        run: pio run -e maix_amigo

      - name: Upload P0 firmware
        # Each `pio run` prunes the others' build dirs, so each env is uploaded
        # as soon as it exists. Flash the .bin with kflash, or debug the .elf.
        uses: actions/upload-artifact@v7
        with:
          name: maix-amigo-firmware
          path: |
            .pio/build/maix_amigo/firmware.bin
            .pio/build/maix_amigo/firmware.elf
          if-no-files-found: error

      - name: Build maix mruby cross lib + uni-algo
        # The interpreter and Unicode tables the firmware links below.
        run: |
          scripts/maix/mruby_build.bash
          scripts/maix/unialgo_build.bash

      - name: Build mruby-linking firmware
        # Linking is the measurement: pio prints RAM and flash use.
        env:
          MAIX_MRUBY_BUILD_DIR: ${{ github.workspace }}/build-maix-mruby/maix
          MAIX_UNIALGO_LIB_DIR: ${{ github.workspace }}/build-maix-unialgo
        run: pio run -e maix_rgss_boot

      - name: Upload mruby-linking firmware
        uses: actions/upload-artifact@v7
        with:
          name: maix-rgss-boot-firmware
          path: |
            .pio/build/maix_rgss_boot/firmware.bin
            .pio/build/maix_rgss_boot/firmware.elf
            .pio/build/maix_rgss_boot/firmware.map
          if-no-files-found: error

      - name: Check game data matches its generator
        # data/maix-hello is committed, since CI should not regenerate test data
        # with unpinned tools. README.md is hand-written, so it is excluded.
        run: |
          ruby scripts/gen/maix-hello-game.rb /tmp/maixhello-check
          diff -r -x README.md /tmp/maixhello-check data/maix-hello && echo "maix-hello in sync"

      - name: Build game firmware
        # Boots data/maix-hello to its title screen (app/maix/README.md).
        env:
          MAIX_MRUBY_BUILD_DIR: ${{ github.workspace }}/build-maix-mruby/maix
          MAIX_UNIALGO_LIB_DIR: ${{ github.workspace }}/build-maix-unialgo
        run: pio run -e maix_game

      - name: Upload game firmware
        uses: actions/upload-artifact@v7
        with:
          name: maix-game-firmware
          path: |
            .pio/build/maix_game/firmware.bin
            .pio/build/maix_game/firmware.elf
            .pio/build/maix_game/firmware.map
          if-no-files-found: error

      - name: Build SD-boot game firmware
        # Reads the game from /sd/maixgame instead of flash. Runtime proof needs
        # a physical card, since Renode models no SD controller.
        env:
          MAIX_MRUBY_BUILD_DIR: ${{ github.workspace }}/build-maix-mruby/maix
          MAIX_UNIALGO_LIB_DIR: ${{ github.workspace }}/build-maix-unialgo
        run: pio run -e maix_game_sd

      - name: Upload SD-boot game firmware
        uses: actions/upload-artifact@v7
        with:
          name: maix-game-sd-firmware
          path: |
            .pio/build/maix_game_sd/firmware.bin
            .pio/build/maix_game_sd/firmware.elf
            .pio/build/maix_game_sd/firmware.map
          if-no-files-found: error

      - name: Compile SD syscall layer
        # The SD syscall file is gated off by default, so this rebuilds the boot
        # env with MAIX_WITH_SD to prove it compiles. Runs after the uploads.
        env:
          MAIX_MRUBY_BUILD_DIR: ${{ github.workspace }}/build-maix-mruby/maix
          MAIX_UNIALGO_LIB_DIR: ${{ github.workspace }}/build-maix-unialgo
          PLATFORMIO_BUILD_FLAGS: -DMAIX_WITH_SD
        run: pio run -e maix_rgss_boot

      - name: Build SD uploader
        # Throwaway serial-to-SD loader (app/maix/README.md).
        run: pio run -e maix_sd_upload

      - name: Upload SD uploader
        uses: actions/upload-artifact@v7
        with:
          name: maix-sd-upload-firmware
          path: |
            .pio/build/maix_sd_upload/firmware.bin
            .pio/build/maix_sd_upload/firmware.elf
          if-no-files-found: error

  # Headless Renode boots of the Maix firmwares, plus a pixel check on the LCD
  # capture. Push only.
  maix-smoke:
    needs: maix
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Only scripts/ and app/maix/renode/ are read here.
          submodules: false
          show-progress: false
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Download firmware
        # The boot script needs only symbol addresses, so no PlatformIO here.
        uses: actions/download-artifact@v8
        with:
          name: maix-rgss-boot-firmware
          path: firmware

      - name: Install riscv nm
        # The boot script resolves setup()/loop() with riscv64-unknown-elf-nm.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q binutils-riscv64-unknown-elf

      - name: Cache Renode
        uses: actions/cache@v6
        with:
          # The version here must match the download step. The key also hashes the
          # boot inputs, so a script change re-extracts.
          path: /tmp/maix-renode
          key: renode-maix-${{ runner.os }}-1.17.0-${{ hashFiles('app/maix/renode/**', 'scripts/maix/renode_boot.bash') }}

      - name: Download Renode
        # The portable release ships the K210 platform description, so nothing is
        # compiled here. The binary only runs next to its own platforms and dlls.
        run: |
          if [ ! -x /tmp/maix-renode/renode_1.17.0-portable/renode ]; then
            mkdir -p /tmp/maix-renode
            curl -fsSL -o /tmp/maix-renode/renode.tar.gz \
              https://github.com/renode/renode/releases/download/v1.17.0/renode-1.17.0.linux-portable.tar.gz
            tar xzf /tmp/maix-renode/renode.tar.gz -C /tmp/maix-renode
          fi
          /tmp/maix-renode/renode_1.17.0-portable/renode --version

      - name: Boot firmware under Renode
        run: |
          elf="$(find firmware -name firmware.elf | head -n 1)"
          test -n "$elf" || { echo "::error::no firmware.elf in artifact:"; find firmware; exit 1; }
          out="$(RENODE_BIN=/tmp/maix-renode/renode_1.17.0-portable/renode MAIX_SPI_LOG="$GITHUB_WORKSPACE/maix-spi-rgss.log" scripts/maix/renode_boot.bash "$elf")"
          echo "$out"
          # Markers go through the matcher, since a Renode [WARNING] can land inside one.
          echo "$out" | ruby scripts/maix/boot_marker.rb - "REACHED setup()" || { echo "::error::did not reach setup()"; exit 1; }
          echo "$out" | ruby scripts/maix/boot_marker.rb - "REACHED loop()" || { echo "::error::did not reach loop()"; exit 1; }
          echo "$out" | grep -q "mrb_open ok" || { echo "::error::mruby did not open"; exit 1; }
          echo "$out" | grep -q "eval -> maix-ruby-alive" || { echo "::error::mruby eval failed"; exit 1; }

      - name: Check red framebuffer
        # The boot firmware paints solid red through LVGL before the pumps return.
        # Red is byte-swapped on the wire (00f8). The panel is 480x320 with the
        # 320x240 canvas centred, so the red fraction is diluted. Thresholds sit
        # below the measured values, with headroom.
        run: |
          python3 scripts/maix/lcd_decode.py maix-spi-rgss.log maix-frame-rgss.ppm \
            --expect-color 00f8 --min-fraction 0.35 --min-colors 2 --expect-size 480x320

      - name: Download P0 firmware
        uses: actions/download-artifact@v8
        with:
          name: maix-amigo-firmware
          path: firmware-p0

      - name: Capture LCD frame under Renode
        # The DMA hook logs each LCD transfer with its DC bit to $MAIX_SPI_LOG.
        # Only the P0 firmware inits the panel, so only it produces a real frame.
        run: |
          elf="$(find firmware-p0 -name firmware.elf | head -n 1)"
          test -n "$elf" || { echo "::error::no P0 firmware.elf in artifact:"; find firmware-p0; exit 1; }
          RENODE_BIN=/tmp/maix-renode/renode_1.17.0-portable/renode \
          MAIX_SPI_LOG="$GITHUB_WORKSPACE/maix-spi.log" \
            scripts/maix/renode_boot.bash "$elf" 00:00:08

      - name: Decode LCD capture
        # Fails unless the frame is a blue 320x240 screen with white text.
        run: |
          python3 scripts/maix/lcd_decode.py maix-spi.log maix-frame.ppm \
            --expect-color 001f --min-fraction 0.45 --min-colors 3 --expect-size 320x240

      - name: Download game firmware
        uses: actions/download-artifact@v8
        with:
          name: maix-game-firmware
          path: firmware-game

      - name: Boot game to title under Renode
        # The game is embedded in flash (app/maix/embed_game.py), so no SD card
        # is needed.
        run: |
          elf="$(find firmware-game -name firmware.elf | head -n 1)"
          test -n "$elf" || { echo "::error::no game firmware.elf in artifact:"; find firmware-game; exit 1; }
          out="$(RENODE_BIN=/tmp/maix-renode/renode_1.17.0-portable/renode MAIX_SPI_LOG="$GITHUB_WORKSPACE/maix-spi-game.log" scripts/maix/renode_boot.bash "$elf" 00:00:10)"
          echo "$out"
          echo "$out" | grep -q "maix-game: boot ok" || { echo "::error::game did not boot"; exit 1; }
          echo "$out" | grep -q "scene: RPG2k::Scene::Title" || { echo "::error::never reached title"; exit 1; }

      - name: Check title framebuffer
        # Requires at least four distinct colours, so the title UI really drew.
        # Thresholds follow the same panel-centring reasoning as the red check.
        run: |
          python3 scripts/maix/lcd_decode.py maix-spi-game.log maix-frame-game.ppm \
            --expect-color 1004 --min-fraction 0.30 --min-colors 4 --expect-size 480x320

  # Boots the Wio firmwares under Renode, with the ILI9341 pixel regression
  # and the SD tooling check. Disabled with `wio` above.
  wio-renode:
    # Covers the CPU running setup()/loop() and the ILI9341 model's pixels.
    # Not covered: a firmware-driven map render. wio_walk's tile pushes go
    # through Adafruit_ZeroDMA, which this platform does not model yet.
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # Same PlatformIO envs as `wio`, so the same submodules go unused.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: actions/setup-dotnet@v6
        with:
          # The portable Renode release bundles only the runtime, which cannot
          # compile a new peripheral, so Renode is built from source below.
          dotnet-version: "8.0.x"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install -q --disable-pip-version-check --upgrade platformio

      - name: Build firmware
        run: |
          pio run -e wio
          pio run -e wio_walk
          pio run -e wio_sd_upload

      - name: Install mtools/dosfstools/ImageMagick
        # mtools and dosfstools test renode_sdcard.bash. ImageMagick reads pixels
        # from the ILI9341 model's PNG dump.
        run: sudo apt-get update -q && sudo apt-get install -y -q mtools dosfstools imagemagick

      - name: Cache the Renode build
        id: renode-cache
        uses: actions/cache@v6
        with:
          path: /tmp/wio-renode-build
          # Keyed on the pinned commit and the peripheral sources it copies in.
          key: wio-renode-${{ runner.os }}-${{ hashFiles('scripts/wio/renode_build.bash', 'app/wio/renode/peripherals/**') }}

      - name: Build Renode with the Wio Terminal peripherals
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: scripts/wio/renode_build.bash /tmp/wio-renode-build

      - name: Boot each firmware under Renode
        env:
          RENODE_BIN: /tmp/wio-renode-build/renode-src/renode
        run: |
          "$RENODE_BIN" --version
          for env in wio wio_walk wio_sd_upload; do
            echo "::group::$env"
            out="$(scripts/wio/renode_boot.bash ".pio/build/$env/firmware.elf" "00:00:00.300")"
            echo "$out"
            # Markers go through the matcher, since a Renode [WARNING] can land inside one.
            echo "$out" | ruby scripts/maix/boot_marker.rb - "REACHED setup()" || { echo "::error::$env did not reach setup()"; exit 1; }
            echo "$out" | ruby scripts/maix/boot_marker.rb - "REACHED loop()" || { echo "::error::$env did not reach loop()"; exit 1; }
            echo "::endgroup::"
          done

      - name: ILI9341 display peripheral regression test
        env:
          RENODE_BIN: /tmp/wio-renode-build/renode-src/renode
        run: |
          rm -f /tmp/wio_lcd_smoke_test.png
          "$RENODE_BIN" --disable-gui --console --plain \
            -e "include @app/wio/renode/lcd_smoke_test.resc" -e "quit" < /dev/null
          # Ubuntu's `imagemagick` is IM6, which has no `magick` binary. IM7 has
          # no `convert`. Accept either.
          im_convert=convert
          command -v magick >/dev/null 2>&1 && im_convert=magick
          check() {
            local got
            got="$("$im_convert" /tmp/wio_lcd_smoke_test.png -format '%[pixel:p{'"$1"'}]' info:)"
            [ "$got" = "$2" ] || { echo "::error::pixel {$1} was $got, expected $2"; exit 1; }
          }
          check "8,0" "srgb(255,0,0)"   # inside the CASET/PASET window, red row
          check "8,1" "srgb(0,0,255)"   # inside the window, blue row
          check "20,0" "srgb(0,0,0)"    # outside the window, untouched

      - name: SD card image tooling smoke test
        # Tests renode_sdcard.bash itself, not a firmware boot: it builds a FAT
        # image and checks mtools can read back what it wrote.
        run: |
          mkdir -p /tmp/wio_renode_sdcard_check
          echo hello > /tmp/wio_renode_sdcard_check_input.txt
          scripts/wio/renode_sdcard.bash /tmp/wio_renode_sdcard_check \
            /tmp/wio_renode_sdcard_check_input.txt:/RPG2kWalk/test.txt
          mdir -i /tmp/wio_renode_sdcard_check/sdcard.img ::/RPG2kWalk | grep -q test

  # M5Stack Core (ESP32) P1 HAL firmware. It is a standalone PlatformIO project
  # under app/m5stack, not an environment in the root platformio.ini: Arduino
  # as an ESP-IDF component takes over the project root, which the shared
  # project cannot allow. Disabled, along with `m5stack-qemu`.
  m5stack:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # LVGL is vendored and linked. See the `wio` job for what else is unused.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-m5stack-${{ runner.os }}-${{ hashFiles('app/m5stack/platformio.ini', 'app/m5stack/sdkconfig.defaults') }}
          restore-keys: pio-m5stack-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install -q --disable-pip-version-check --upgrade platformio

      - name: Build firmware
        working-directory: app/m5stack
        run: pio run -e m5stack

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: m5stack-firmware
          path: |
            app/m5stack/.pio/build/m5stack/firmware.bin
            app/m5stack/.pio/build/m5stack/firmware.elf
            app/m5stack/.pio/build/m5stack/bootloader.bin
            app/m5stack/.pio/build/m5stack/partitions.bin

  # Boots the m5stack firmware under a QEMU built from source with the patches in
  # app/m5stack/qemu/patches (Espressif's release cannot carry the display and
  # gamepad devices). Checks the ILI9341 framebuffer and that a simulated FACES
  # Gamepad Face reaches RGSS::Input. Disabled with `m5stack`.
  m5stack-qemu:
    needs: m5stack
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: m5stack-firmware
          path: app/m5stack/.pio/build/m5stack

      - name: Install esptool, QEMU's build deps
        run: |
          pip install -q --disable-pip-version-check esptool
          sudo apt-get update -q && sudo apt-get install -y -q \
            ninja-build meson pkg-config libglib2.0-dev libpixman-1-dev libgcrypt20-dev libslirp-dev

      - name: Cache the QEMU build
        id: qemu-cache
        uses: actions/cache@v6
        with:
          path: /tmp/m5stack-qemu-build
          # Keyed on the pinned tag and the patches it applies.
          key: m5stack-qemu-build-${{ runner.os }}-${{ hashFiles('scripts/m5stack/qemu_build.bash', 'app/m5stack/qemu/patches/**') }}

      - name: Build QEMU with M5Stack display support
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: scripts/m5stack/qemu_build.bash /tmp/m5stack-qemu-build

      - name: Boot under QEMU
        env:
          M5STACK_QEMU_BIN: /tmp/m5stack-qemu-build/build/qemu-system-xtensa
          M5STACK_DISPLAY_DUMP: /tmp/m5stack_display.ppm
        run: scripts/m5stack/qemu_boot.bash app/m5stack/.pio/build/m5stack

      # The dump file existing proves only that the device was reachable. This
      # checks that the LVGL "Keys: A B C" label drew: a white background plus a
      # second colour for the text.
      - name: Verify the display actually rendered
        run: |
          python3 - <<'EOF'
          import collections

          path = "/tmp/m5stack_display.ppm"
          with open(path, "rb") as f:
              magic = f.readline().strip()
              dims = f.readline().split()
              maxval = f.readline().strip()
              assert magic == b"P6", f"unexpected PPM magic {magic!r}"
              width, height = (int(x) for x in dims)
              assert maxval == b"255"
              data = f.read()

          assert len(data) == width * height * 3, (
              f"short read: {len(data)} bytes for a {width}x{height} frame"
          )

          counts = collections.Counter(
              data[i:i + 3] for i in range(0, len(data), 3)
          )
          total = width * height
          white = counts[b"\xff\xff\xff"]
          non_white = total - white

          print(f"{path}: {width}x{height}, {len(counts)} distinct colors, "
                f"{white} white / {non_white} non-white pixels")

          assert len(counts) > 1, "framebuffer is a single uniform color"
          assert white > total * 0.5, (
              f"expected a majority-white LVGL background, got {white}/{total}"
          )
          assert non_white > 0, "no non-background (label text) pixels found"
          EOF

      # A second boot, so the simulated Gamepad Face state is the only input.
      # 0x7e is active-low: Up and Start held (bit layout in the patch's header).
      - name: Boot under QEMU with a Gamepad Face attached
        env:
          M5STACK_QEMU_BIN: /tmp/m5stack-qemu-build/build/qemu-system-xtensa
          M5STACK_GAMEPAD_STATE: "7e"
          M5STACK_QEMU_CACHE_DIR: /tmp/m5stack-qemu-gamepad
        run: scripts/m5stack/qemu_boot.bash app/m5stack/.pio/build/m5stack

      # Checks the whole input chain in the serial log: I2C probe and read, bit
      # decode, RGSS key mask, and the "Keys: ..." line.
      - name: Verify the Gamepad Face input was actually read
        run: |
          log=/tmp/m5stack-qemu-gamepad/serial.log
          keys_line="$(grep '^Keys:' "$log" | tail -1)"
          echo "$keys_line"
          [ -n "$keys_line" ] || { echo "::error::no Keys: line in $log"; exit 1; }
          echo "$keys_line" | grep -qw "Up" || { echo "::error::Up not reported (Gamepad Face D-pad not read)"; exit 1; }
          echo "$keys_line" | grep -qw "Start" || { echo "::error::Start not reported (Gamepad Face Select/Start not read)"; exit 1; }

  # Boots the nano 7G walk app under qemu-system-arm's Cortex-A8 model. The PL110
  # is a stock QEMU display, unlike the peripherals wio-renode needed. Checks a
  # real rendered map and prints the PMU cycle count as a per-frame cost signal
  # (not asserted: it is a comparison, not a threshold).
  nano7-qemu:
    if: ${{ github.event_name == 'push' }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Links only this repo's app/nano7 and app/shared sources against a shim.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-none-eabi qemu-system-arm unar

      - name: Download Nepheshel
        run: ./scripts/download/nepheshel.bash

      - name: Export a real map
        run: |
          mkdir -p /tmp/nano7_qemu_export
          ruby scripts/export_nano7_map.rb --target nano7 \
            data/Nepheshel206beta/Nepheshel206Nbeta 1 /tmp/nano7_qemu_export

      - name: Build the Cortex-A8 image
        # Compiles with the same -mcpu=cortex-a8 flags as NanoApps' sdk/hb_app.mk.
        run: |
          scripts/nano7/qemu_build.bash \
            /tmp/nano7_qemu_export/map.bin /tmp/nano7_qemu_export/tiles.bin \
            /tmp/nano7_walk_qemu.elf

      - name: Boot under QEMU and screendump the real PL110 framebuffer
        run: |
          scripts/nano7/qemu_run.bash /tmp/nano7_walk_qemu.elf \
            /tmp/nano7_qemu_frame.ppm /tmp/nano7_qemu_uart.log

      - name: Check the rendered frame and print the cycle-count log
        run: |
          grep "NANO7-QEMU" /tmp/nano7_qemu_uart.log || true
          ruby scripts/nano7/qemu_smoke_check.rb /tmp/nano7_qemu_frame.ppm /tmp/nano7_qemu_uart.log

  # PSP EBOOT, built with the pspdev toolchain. Like the Wio job, this only
  # compiles: no emulator runs here, so `psp-smoke` boots the EBOOT under PPSSPP.
  # Gated on `changes`, so it runs only when app/psp changed or on a manual run.
  psp:
    needs: changes
    if: >-
      ${{ github.event_name != 'issue_comment' &&
          (github.event_name == 'workflow_dispatch' || needs.changes.outputs.psp == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # The psp mruby cross-build reads 3rd/mruby and its gems, 3rd/stb, and
          # 3rd/lvgl and uni-algo for app/psp. It also needs 3rd/quickjs: rake's
          # host bootstrap builds mruby-mvjs, which includes quickjs.h. The
          # `single_format_only` gate does not cover it.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Init submodules
        env:
          SKIP_SUBMODULES: >-
            3rd/gflags 3rd/ng-log
            3rd/effekseer 3rd/inicpp 3rd/optcarrot
        run: ./scripts/checkout-submodules.bash

      - name: Copy vendored Unicode mapping tables
        # mruby-lcf and mruby-rgss rake-time generators read $cp932_table and
        # $jis0208_table, normally set by the nix devshell's fetchurl derivations.
        # Verify the vendored copies against the flake's sha256 pins instead, so
        # the build consumes the same bytes Nix would.
        run: |
          mkdir -p .native-build-tables
          vendored_table() {
            local src="$1" dest="$2" want="$3"
            cp "$src" "$dest"
            local got
            got="$(python3 -c 'import hashlib,base64,sys; print(base64.b64encode(hashlib.sha256(open(sys.argv[1],"rb").read()).digest()).decode())' "$dest")"
            if [ "$got" != "$want" ]; then
              echo "hash mismatch for $dest" >&2
              echo "  flake.nix pins $want" >&2
              echo "  vendored       $got" >&2
              exit 1
            fi
          }
          vendored_table data/unicode-mappings/bestfit932.txt \
            .native-build-tables/bestfit932.txt \
            'JhTP6jXDyGxB0zGYeTqEykTt7jzw7gATphpD+6Ts4zE='
          vendored_table data/unicode-mappings/JIS0208.TXT \
            .native-build-tables/JIS0208.TXT \
            'HFcYcEV/Gcl3IGMfqD7kkVSalroUNtoSlnhqZ9hjLoc='

      - name: Build EBOOT (pspdev container)
        # The pspdev image has psp-gcc, cmake and psp-cmake, but no Ruby and no
        # native gcc. rake's host sub-build needs gcc, and the mruby compiler's
        # lexer and grammar need gperf and bison (the pinned fork commit
        # regenerates them). git is for psp_fixup_imports.bash.
        #
        # The script replaces $PSPDEV/bin/psp-fixup-imports, which `create_pbp_file`
        # runs after linking, with a patched build. The stock tool mis-links some of
        # this EBOOT's PSP imports, which stops it booting under PPSSPP-headless.
        # The image is Alpine-based, so the package manager is apk.
        #
        # -q reduces the per-layer pull progress to the resolved digest.
        run: |
          docker pull -q pspdev/pspdev:latest
          docker run --rm -v "$PWD:/src" -w /src \
            -e cp932_table=/src/.native-build-tables/bestfit932.txt \
            -e jis0208_table=/src/.native-build-tables/JIS0208.TXT \
            pspdev/pspdev:latest sh -euc '
            apk add --no-cache ruby ruby-rake build-base git gperf bison
            bash scripts/build/psp_fixup_imports.bash
            psp-cmake -S app/psp -B build-psp
            cmake --build build-psp -j"$(nproc)"
          '

      - name: Upload EBOOT
        uses: actions/upload-artifact@v7
        with:
          name: psp-eboot
          path: build-psp/EBOOT.PBP
          if-no-files-found: error

  # Headless PPSSPP run of the EBOOT. Asserts the boot marker and the per-second
  # frame heartbeat, which proves the frame loop runs. Push only.
  psp-smoke:
    # The emulator is nixpkgs' `ppsspp` with a local patch, so it is built from
    # source unless the Nix store cache has it. Hence the cache-nix-action step.
    #
    # Blocking. The HLE gaps this once worked around are fixed by the patches
    # in app/psp/README.md, so both markers are asserted.
    needs: psp
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # flake.nix and flake.lock pin the emulator. No submodules are needed.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Download EBOOT
        uses: actions/download-artifact@v8
        with:
          name: psp-eboot
          path: eboot

      - uses: nixbuild/nix-quick-install-action@v35

      # The patch changes PPSSPP's output hash without touching the flake files,
      # so the key includes the patch. Otherwise it would silently restore the
      # unpatched build.
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-ppsspp-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-ppsspp-${{ runner.os }}-

      - name: Fetch PPSSPP
        # The default (non-Qt) build ships bin/ppsspp-headless with HEADLESS=ON.
        run: nix build -L --out-link ppsspp '.#ppsspp'

      - name: Run headless smoke test
        run: |
          EBOOT="$GITHUB_WORKSPACE/eboot/EBOOT.PBP"
          ls -l "$EBOOT"
          # sceIoWrite markers need --log to surface. --timeout ends the bring-up
          # loop. `|| true` keeps its non-zero exit from masking the assertion below.
          # --screenshot is an input to compare against in headless, not an output.
          #
          # --log traces every HLE call, so the output goes to a file, which is
          # uploaded below.
          ./ppsspp/bin/ppsspp-headless --log --graphics=software --timeout=15 \
            "$EBOOT" > "$GITHUB_WORKSPACE/headless.log" 2>&1 || true
          echo "=== asserting the EBOOT booted and pumped frames ==="
          # BRINGUP is required separately: a BOOT-only grep would pass a build
          # that crashed before its first frame.
          if grep -q 'RPG2K_PSP_BOOT' "$GITHUB_WORKSPACE/headless.log" &&
             grep -q 'RPG2K_PSP_BRINGUP' "$GITHUB_WORKSPACE/headless.log"; then
            # Echo every one-shot marker, not just BOOT and BRINGUP, plus a few heartbeats.
            grep -E 'RPG2K_PSP_[A-Z_]+' "$GITHUB_WORKSPACE/headless.log" \
              | head -10
          else
            echo "boot or bring-up marker missing from the emulator log; last 100 lines:"
            tail -100 "$GITHUB_WORKSPACE/headless.log"
            exit 1
          fi

      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: psp-smoke
          path: headless.log
          if-no-files-found: warn

  # `psp-smoke` with a real RPG2k project at the EBOOT's fixed Memory Stick path
  # (kGameDir in app/psp/main.cxx). It is the first job to boot a real game on
  # the PSP build and record memory numbers for the database, the map tree,
  # Scene::Title, and steady-state Title.
  #
  # The `.psp_ci_new_game` marker makes Title auto-select New Game, which reaches
  # Scene::Map. Menu and Battle need input scripting that does not exist yet.
  #
  # Nepheshel is the same test bed the desktop build already downloads.
  #
  # continue-on-error until it has run green for a while. Nepheshel's download
  # host is also intermittent.
  psp-smoke-game:
    # `--memstick=DIR` does not work: PPSSPP's arg parser treats it as a boot target.
    # Linux headless has no memstick override (hrydgard/ppsspp#20552). It defaults
    # to $HOME/.ppsspp, so the game is written into that location directly.
    needs: [psp, psp-smoke]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Download EBOOT
        uses: actions/download-artifact@v8
        with:
          name: psp-eboot
          path: eboot

      - uses: nixbuild/nix-quick-install-action@v35

      # Same key as psp-smoke, so this job reuses the PPSSPP build that step made.
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-ppsspp-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-ppsspp-${{ runner.os }}-

      - name: Fetch PPSSPP
        run: nix build -L --out-link ppsspp '.#ppsspp'

      - name: Download Nepheshel
        # unar is a devShell package, but entering the whole devShell for one
        # archive tool is wasteful. apt installs just that package, as in `android`.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q unar
          ./scripts/download/nepheshel.bash

      - name: Place Nepheshel at the EBOOT's fixed Memory Stick path
        # Created before the emulator runs, so there is no race with its first-run setup.
        run: |
          memstick="$HOME/.ppsspp"
          gamedir="$memstick/PSP/GAME/rpg2k"
          mkdir -p "$gamedir"
          cp -r data/Nepheshel206beta/Nepheshel206Rbeta/. "$gamedir/"
          # Only this marker's presence sets RPG2K_NEW_GAME true (app/psp/main.cxx).
          touch "$gamedir/.psp_ci_new_game"

      - name: Run headless with a real game
        run: |
          EBOOT="$GITHUB_WORKSPACE/eboot/EBOOT.PBP"
          ls -l "$EBOOT"
          # A longer timeout than psp-smoke, since loading the database and map tree is real work.
          # Capture the exit status instead of `|| true`, so a signal kill (>= 128)
          # is not absorbed. A plain --timeout exit is expected to be nonzero.
          set +e
          ./ppsspp/bin/ppsspp-headless --log --graphics=software --timeout=45 \
            "$EBOOT" > "$GITHUB_WORKSPACE/headless-game.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ge 128 ]; then
            echo "::warning::ppsspp-headless was killed by signal $((status - 128)) (exit $status) -- see docs/adr/0047-psp-memory-budget.md's P1c"
          fi
          echo "=== asserting the EBOOT booted, found the game, and pumped frames ==="
          if grep -q 'RPG2K_PSP_BOOT' "$GITHUB_WORKSPACE/headless-game.log" &&
             grep -q 'RPG2K_PSP_GAME_START RPG2k ok' "$GITHUB_WORKSPACE/headless-game.log" &&
             grep -q 'RPG2K_PSP_BRINGUP' "$GITHUB_WORKSPACE/headless-game.log"; then
            # 30 lines, to include the map transition and the scene=Map heartbeats.
            grep -E 'RPG2K_PSP_[A-Z_]+|\[RPG2k-MAP\]' "$GITHUB_WORKSPACE/headless-game.log" \
              | head -30
          else
            echo "boot, game-start or bring-up marker missing; last 150 lines:"
            tail -150 "$GITHUB_WORKSPACE/headless-game.log"
            exit 1
          fi

      - name: Upload real-game smoke-test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: psp-smoke-game
          path: headless-game.log
          if-no-files-found: warn

  # Android debug APK. The `android-smoke` job below boots it on an emulator.
  # See app/android/README.md.
  android:
    if: ${{ github.event_name != 'issue_comment' && (github.event_name != 'pull_request' || needs.changes.outputs.android == 'true') }}
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # Android has no system SDL2, so it builds the vendored 3rd/SDL and
          # 3rd/SDL_mixer, plus every submodule the desktop build needs.
          submodules: recursive
          show-progress: false
          persist-credentials: false

      - name: Copy vendored Unicode mapping tables
        # Same as the `psp` job's step of the same name.
        run: |
          mkdir -p .native-build-tables
          vendored_table() {
            local src="$1" dest="$2" want="$3"
            cp "$src" "$dest"
            local got
            got="$(python3 -c 'import hashlib,base64,sys; print(base64.b64encode(hashlib.sha256(open(sys.argv[1],"rb").read()).digest()).decode())' "$dest")"
            if [ "$got" != "$want" ]; then
              echo "hash mismatch for $dest" >&2
              echo "  flake.nix pins $want" >&2
              echo "  vendored       $got" >&2
              exit 1
            fi
          }
          vendored_table data/unicode-mappings/bestfit932.txt \
            .native-build-tables/bestfit932.txt \
            'JhTP6jXDyGxB0zGYeTqEykTt7jzw7gATphpD+6Ts4zE='
          vendored_table data/unicode-mappings/JIS0208.TXT \
            .native-build-tables/JIS0208.TXT \
            'HFcYcEV/Gcl3IGMfqD7kkVSalroUNtoSlnhqZ9hjLoc='

      # Same gperf/bison reason as the `psp` job. Ubuntu ships bison but not gperf.
      - run: sudo apt-get update -q && sudo apt-get install -y -q gperf

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;27.2.12479018" "cmake;3.22.1" \
            --sdk_root="$ANDROID_HOME"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: app/android
        # ${{ env.* }} sees only workflow and job env, not the runner's own
        # ANDROID_HOME. Export the NDK path from the shell instead.
        env:
          cp932_table: ${{ github.workspace }}/.native-build-tables/bestfit932.txt
          jis0208_table: ${{ github.workspace }}/.native-build-tables/JIS0208.TXT
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./gradlew :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Boots the APK on an emulator. Push only, since SDK downloads fail often on
  # PRs; the `android` job still builds every PR.
  #
  # This is a boot-and-crash check, not a performance measurement. The
  # emulator is x86_64 with ARM binary translation, and its frame times do not
  # compare with the device numbers in docs/android-perf-followups.md.
  #
  # continue-on-error until it has run green for a while. Emulator first boots
  # are flaky, and the image is not under this job's control.
  android-smoke:
    needs: android
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      # Without the proxy, this job would hit the upstream host directly.
      CORS_PROXY_URL: ${{ secrets.CORS_PROXY_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Only scripts/android_smoke_check.bash, scripts/download/nepheshel.bash
          # and this workflow file are read.
          submodules: false
          show-progress: false
          persist-credentials: false

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: android-debug-apk
          path: apk

      - name: Download Nepheshel
        # The same fixture and installer the `psp-smoke-game` job uses.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q unar
          ./scripts/download/nepheshel.bash

      - name: Enable KVM group perms
        # /dev/kvm is root-only until a udev rule opens it to the runner's kvm group.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api30-google_apis-x86_64

      - name: Boot the APK and walk it to the map scene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          # Don't save a mid-boot snapshot back into the cached AVD.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -no-snapshot-save
          disable-animations: true
          script: ./scripts/android_smoke_check.bash

      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-smoke
          path: |
            android-smoke-logcat.txt
            android-smoke-full-logcat.txt
            android-smoke-screenshot.png
          if-no-files-found: warn

  # Flake build with every submodule walked. It is the only job that needs
  # nested submodules on disk.
  flake:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-latest

    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # `packages.build` compiles the same CMakeLists.txt as `build`, so the
          # build's submodule subset is enough for it. The `?submodules=1` walk
          # below is what needs the others on disk.
          submodules: false
          show-progress: false
          persist-credentials: false

      # Every submodule, nested too: the `?submodules=1` walk reads each
      # .gitmodules entry from disk, and an uninitialised one makes it fail.
      - name: Init submodules
        env:
          RECURSIVE: 1
        run: ./scripts/checkout-submodules.bash

      # The walk covers every nested .gitmodules entry, so drop quickjs-ng's
      # test262 entry rather than clone tc39/test262.
      - name: Skip the quickjs test262 submodule
        run: ./scripts/skip-quickjs-test262.bash
        env:
          CLONE_TEST262: ${{ vars.CLONE_TEST262 }}

      # With CLONE_TEST262=1 the submodule stays registered, so the walk needs it checked out.
      - name: Materialize quickjs test262 submodule for the flake build
        if: ${{ vars.CLONE_TEST262 == '1' }}
        run: git -C 3rd/quickjs -c submodule.test262.update=checkout submodule update --init --depth 1 test262

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # `?submodules=1` puts the submodule sources in the flake's store copy. Only
      # this job asks for it, so the other jobs skip the walk.
      #
      # The fetch prints a `* [new ref]` line per ref, which the filter drops.
      # `set -o pipefail` is needed because bash -e does not set it, and without it
      # a failed build would pass on the filter's status.
      - name: Build flake
        run: |
          set -o pipefail
          nix build -L '.?submodules=1#build' 2>&1 | ./scripts/drop-git-fetch-noise.bash

  # Publishes the WebAssembly page to GitHub Pages on master. No pthreads means
  # no COOP/COEP headers are needed. Requires Settings → Pages → Source =
  # "GitHub Actions" once for the repo.
  deploy-pages:
    needs: wasm
    # `!cancelled()` is needed because a skip propagates down the `needs` chain.
    # `preview-gate` is skipped outside /preview, and that skip reached this job
    # through `wasm`, so it never published. The `wasm` result has to be checked
    # explicitly.
    if: >-
      ${{ !cancelled() && needs.wasm.result == 'success'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialise deploys. Don't cancel a publish that is already running.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download wasm page
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: site

      # Renders CHANGELOG.md into site/changelog/. The checkout goes to its own
      # path, since a default checkout would `git clean` the site/ directory.
      - name: Fetch CHANGELOG.md
        uses: actions/checkout@v7
        with:
          path: changelog-src
          sparse-checkout: |
            CHANGELOG.md
            scripts/render-changelog-page.bash
          sparse-checkout-cone-mode: false
          show-progress: false
          persist-credentials: false
      - name: Render the changelog to HTML
        run: ./changelog-src/scripts/render-changelog-page.bash changelog-src/CHANGELOG.md site/changelog

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Cloudflare Pages preview for a PR, on `/preview`. Needs the secrets
  # CLOUDFLARE_API_TOKEN ("Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID, and
  # a Direct Upload project named "rpg-maker-clone". See docs/deploy.md.
  preview-cloudflare:
    # preview-gate succeeds only on a /preview comment, which keeps this job out of normal runs.
    needs: [ preview-gate, wasm ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Queue /preview runs per PR. Don't cancel, since a cancelled upload leaves a half-written deployment.
    concurrency:
      group: cloudflare-preview-${{ github.event.issue.number }}
      cancel-in-progress: false
    # Job-level env can read secrets, and job-level `if` cannot. The steps below
    # check whether Cloudflare is configured, so the job stays green when it is not.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set — skipping the preview deployment. See docs/deploy.md for the one-time setup."
          fi
      # An explicit /preview should get a reply, not just a 👀.
      - name: Report the missing setup on the PR
        if: steps.creds.outputs.configured != 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cloudflare-preview
          number: ${{ github.event.issue.number }}
          message: |
            ### ⚡ Cloudflare Pages preview

            `/preview` cannot run: the `CLOUDFLARE_API_TOKEN` /
            `CLOUDFLARE_ACCOUNT_ID` repository secrets are not set. See
            `docs/deploy.md` for the one-time setup.
      - name: Download wasm page
        if: steps.creds.outputs.configured == 'true'
        uses: actions/download-artifact@v8
        with:
          name: wasm
          path: site

      # `ref` is the PR head, which is what the `wasm` job built. The preview then
      # renders the same commit it deployed.
      - name: Fetch CHANGELOG.md
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preview-gate.outputs.head-sha }}
          path: changelog-src
          sparse-checkout: |
            CHANGELOG.md
            scripts/render-changelog-page.bash
          sparse-checkout-cone-mode: false
          show-progress: false
          persist-credentials: false
      - name: Render the changelog to HTML
        if: steps.creds.outputs.configured == 'true'
        run: ./changelog-src/scripts/render-changelog-page.bash changelog-src/CHANGELOG.md site/changelog

      - name: Deploy preview to Cloudflare Pages
        id: cf
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # A branch other than production is published as a preview. `pr-<number>`
          # keeps a fork's branch named master off the production deployment, and
          # gives each PR a stable URL.
          command: >-
            pages deploy site
            --project-name=rpg-maker-clone
            --branch=pr-${{ github.event.issue.number }}
            --commit-hash=${{ needs.preview-gate.outputs.head-sha }}
            --commit-dirty=true
      - name: Comment preview URL on the PR
        if: ${{ steps.cf.outputs.deployment-url != '' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: cloudflare-preview
          number: ${{ github.event.issue.number }}
          message: |
            ### ⚡ Cloudflare Pages preview

            | | |
            | --- | --- |
            | **Preview URL** | ${{ steps.cf.outputs.deployment-url }} |
            | **Commit** | ${{ needs.preview-gate.outputs.head-sha }} |

            Open the link and load an RPG Maker project with the on-page loader.
            Comment `/preview` again to publish a fresh build.
