# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # Formatting / lint checks.  These need no compiler or Nix devshell, so they
  # run as a lightweight uv-powered job instead of inside the heavy build:
  # `astral-sh/setup-uv` provisions a Python toolchain in seconds and pre-commit
  # plus the clang-format / cmake-format binaries all come from PyPI via uv.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Formatters only touch first-party files (pre-commit excludes 3rd/.*),
        # so the submodules are not needed here.

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install formatters used by the system pre-commit hooks
        run: |
          # Pinned so a new upstream release can never silently reformat the
          # tree and turn this job red out of nowhere.
          uv tool install clang-format==22.1.8
          uv tool install cmakelang==0.6.13
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: pre-commit
        env:
          # nixfmt needs Nix, which this job intentionally does not provide.
          SKIP: nixfmt
        run: uvx pre-commit run --all-files --show-diff-on-failure

  # Cross build.  The application's canonical cross-compilation target is
  # WebAssembly via Emscripten: it compiles the full C++/mruby stack for a
  # non-host triple, which is why it replaces the old native (ubuntu + macOS)
  # build matrix as the primary build gate.  Native compilation is still
  # exercised by the flake job below, and end-to-end behaviour by screenshots.
  wasm:
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: nixbuild/nix-quick-install-action@v29
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/.emscripten_cache
          key: ${{ runner.os }}-emcc-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-emcc-

      - name: cmake
        run: |
          nix develop -c emcmake cmake -S . -B wasm-build -GNinja

      - name: build
        run: |
          nix develop -c cmake --build wasm-build

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: |
            wasm-build/index.html
            wasm-build/index.js
            wasm-build/index.wasm

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: cache test game
        uses: actions/cache@v4
        id: cache
        with:
          path: data
          key: game-${{ hashFiles('./scripts/download-nepheshel.bash') }}

      - uses: nixbuild/nix-quick-install-action@v29
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Download game
        if: steps.cache.outputs.cache-hit != 'true'
        run: nix develop -c ./scripts/download-nepheshel.bash

      - name: Take screenshots
        run: |
          wget https://raw.githubusercontent.com/scottyhardy/docker-wine/master/docker-wine
          chmod +x docker-wine
          mkdir -p $HOME/.local/bin
          mv ./docker-wine $HOME/.local/bin
          export PATH=$HOME/.local/bin:$PATH
          ./scripts/take_title_screenshot.bash
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ss/

  flake:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: nixbuild/nix-quick-install-action@v27
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v5
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix') }}

      - name: Build flake
        run: nix build -L '.?submodules=1#build'
