# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    strategy:
      # Don't let a flaky failure on one OS (e.g. a corrupt nix-archive
      # download in nix-quick-install-action) cancel the other OS's build.
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}

    env:
      SCCACHE_GHA_ENABLED: "true"
      ACTIONS_CACHE_SERVICE_V2: "on"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - run: nix develop -c echo test

      # TODO: Restore macos wine if needed
      # - run: brew install --cask wine@staging
      #   if: ${{ !startsWith(matrix.os, 'macos') }}

      - name: cache rtp
        uses: actions/cache@v6
        id: rtp-cache
        with:
          path: scripts/*.zip
          key: rtp-${{ hashFiles('./scripts/rtp*_install.bash') }}
          restore-keys: rtp-
        if: ${{ startsWith(matrix.os, 'ubuntu') }}

      - name: Download RTP
        run: |
          nix develop -c ./scripts/rtp_install.bash
          nix develop -c ./scripts/rtp_xp_install.bash
        if: ${{ startsWith(matrix.os, 'ubuntu') }}

      - name: pre-commit
        env:
          SKIP: nixfmt
        run: |
          nix develop -c pre-commit run -a || (
            git diff --exit-code ;
            false
          )

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: cmake
        run: |
          nix develop -c cmake -S . -B build -GNinja

      - name: build
        run: |
          nix develop -c cmake --build build

      - name: sccache stats
        if: always()
        run: |
          {
            echo "## sccache stats — ${{ matrix.os }}"
            echo ""
            echo '```'
            nix develop -c sccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: cache test game
        uses: actions/cache@v6
        id: cache
        with:
          path: data
          key: game-${{ hashFiles('./scripts/download-*.bash') }}

      - name: Download game
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          nix develop -c ./scripts/download-nepheshel.bash
          nix develop -c ./scripts/download-mtf-meido-action.bash
          nix develop -c ./scripts/download-opengame-xp.bash

      - name: LCF test-bed smoke check
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: nix develop -c ruby scripts/lcf_testbed_check.rb

      - name: RPG2k game-logic checks
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          nix develop -c ruby scripts/rpg2k_logic_check.rb
          nix develop -c ruby scripts/rpg2k_scene_check.rb

      - name: test
        run: |
          nix develop -c cmake --build build -t test

      # Boot the RPG Maker MV test bed (KinoAR/Lunatic-Core) through the
      # embedded JS host as a smoke test. Non-blocking while the MV runtime is
      # brought up: the step logs the engine's output/errors for iteration but
      # does not fail the build.
      - name: Download MV test game
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: nix develop -c ./scripts/download-lunatic-core.bash

      - name: MV boot smoke test
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        continue-on-error: true
        run: |
          mkdir -p ss
          nix develop -c xvfb-run -a timeout 120 ./build/rpg_maker_clone \
            --timeout_ms=5000 --game_dir data/Lunatic-Core \
            --mv_screenshot=ss/mv_title.png

      # Upload the captured MV frame so the rendered output can be inspected
      # while the maker is brought up. Best-effort: the boot is non-blocking, so
      # the screenshot may be missing on some runs.
      - name: Upload MV screenshot
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mv-screenshot
          path: ss/mv_title.png
          if-no-files-found: warn

  wasm:
    runs-on: ubuntu-24.04
    env:
      # Cache emcc compilations across runs. sccache (used by the native build)
      # does not understand emcc, so the wasm build uses ccache instead, which
      # wraps emcc as a plain compiler. nixpkgs sets EM_CONFIG via the
      # environment, so emcc does not pass --em-config on the command line and
      # ccache does not bail out with "Multiple input files".
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: ~/.emscripten_cache
          key: ${{ runner.os }}-emcc-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-emcc-

      - name: Restore and cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: wasm-ccache-${{ github.run_id }}
          restore-keys: wasm-ccache-

      # Emscripten builds its system libraries (libc/libc++, and the -fexceptions
      # variant this project forces) on the first emcc call, which costs ~50s of
      # the configure step. The nixpkgs emscripten setup hook points EM_CACHE at
      # an ephemeral temp dir, so that work is thrown away every run and the
      # cached ~/.emscripten_cache is never written. Override EM_CACHE on the
      # command itself (after the hook runs) so the libraries are built once and
      # restored on later runs. It must be set for both configure and build,
      # since emcc runs in both.
      - name: cmake
        # CMAKE_<LANG>_COMPILER_LAUNCHER is initialised from the environment at
        # configure time and stored in CMakeCache.txt, so setting ccache here is
        # enough for it to wrap emcc during the build step too. This overrides
        # the sccache launcher the devShell exports (sccache cannot cache emcc).
        run: |
          nix develop -c env EM_CACHE="$HOME/.emscripten_cache" \
            CMAKE_C_COMPILER_LAUNCHER=ccache \
            CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            emcmake cmake -S . -B wasm-build -GNinja

      - name: build
        run: |
          nix develop -c ccache --zero-stats
          nix develop -c env EM_CACHE="$HOME/.emscripten_cache" \
            cmake --build wasm-build

      - name: ccache stats
        if: always()
        run: |
          {
            echo "## ccache stats — wasm"
            echo ""
            echo '```'
            nix develop -c ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          # index.wasm.map lets the deployed page symbolicate wasm stack traces
          # (the build links with -gsource-map); it is optional but harmless to
          # ship. All paths sit under wasm-build/, so the artifact stores them at
          # its root (index.html, index.js, index.wasm[.map]) — ready to publish
          # as-is.
          path: |
            wasm-build/index.html
            wasm-build/index.js
            wasm-build/index.wasm
            wasm-build/index.wasm.map

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: cache test game
        uses: actions/cache@v6
        id: cache
        with:
          path: data
          key: game-${{ hashFiles('./scripts/download-nepheshel.bash') }}

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.*') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Download game
        if: steps.cache.outputs.cache-hit != 'true'
        run: nix develop -c ./scripts/download-nepheshel.bash

      - name: Take screenshots
        run: |
          wget https://raw.githubusercontent.com/scottyhardy/docker-wine/master/docker-wine
          chmod +x docker-wine
          mkdir -p $HOME/.local/bin
          mv ./docker-wine $HOME/.local/bin
          export PATH=$HOME/.local/bin:$PATH
          ./scripts/take_title_screenshot.bash
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ss/

  wio:
    # Build the Wio Terminal (SAMD51) bring-up firmware with PlatformIO. This is
    # the external check for the port's HAL: this environment cannot cross-build
    # or flash the board, so CI compiles it. Builds the display + input HAL and
    # the Arduino sketch; the mruby interpreter is layered on in a later slice
    # (see app/wio/README.md and docs/adr/0005-wio-terminal-port.md).
    runs-on: ubuntu-24.04
    steps:
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          # LVGL is vendored as a submodule and linked into the firmware.
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e wio

  flake:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - run: git config --global submodule.fetchJobs 4
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # quickjs-ng pins a nested `test262` submodule with `update = none`, so the
      # recursive checkout above skips it. `nix build '.?submodules=1'` still
      # recurses into every nested submodule and fails to fetch test262 when it
      # is absent, so materialise it here (shallow). It is only needed to satisfy
      # nix's recursive fetch; nothing in the build uses it.
      - name: Materialize quickjs test262 submodule for the flake build
        run: git -C 3rd/quickjs -c submodule.test262.update=checkout submodule update --init --depth 1 test262

      - uses: nixbuild/nix-quick-install-action@v35
      - name: Restore and cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix') }}

      - name: Build flake
        run: nix build -L '.#build'

  # Publish the WebAssembly page to GitHub Pages on every push to master. The
  # build carries no pthreads/SharedArrayBuffer, so it needs no COOP/COEP
  # headers and serves fine from Pages. Requires Settings → Pages → "Build and
  # deployment" → Source = "GitHub Actions" to be enabled once for the repo.
  deploy-pages:
    needs: wasm
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialise deploys so an older run can't overwrite a newer one; let the
    # in-progress publish finish rather than cancelling it half-written.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download wasm page
        uses: actions/download-artifact@v7
        with:
          name: wasm
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Publish a Cloudflare Pages preview deployment for every pull request, so the
  # branch's build gets a shareable URL before it merges. Requires two repo
  # secrets — CLOUDFLARE_API_TOKEN (a token with the "Cloudflare Pages: Edit"
  # permission) and CLOUDFLARE_ACCOUNT_ID — and a Cloudflare Pages project named
  # "rpg-maker-clone" (create it once in the dashboard as a "Direct Upload"
  # project). See docs/deploy.md for the one-time setup.
  preview-cloudflare:
    needs: wasm
    # Only PRs from branches in this repo — forks and Dependabot can't read the
    # secrets, so skip them instead of failing the job.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Job-level env can read secrets (job-level `if` cannot), so expose whether
    # Cloudflare is configured to a step that gates the deploy. This keeps the
    # PR green when the optional Cloudflare setup hasn't been done yet, instead
    # of failing the required check on a missing secret.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set — skipping the preview deployment. See docs/deploy.md for the one-time setup."
          fi
      - name: Download wasm page
        if: steps.creds.outputs.configured == 'true'
        uses: actions/download-artifact@v7
        with:
          name: wasm
          path: site
      - name: Deploy preview to Cloudflare Pages
        id: cf
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Any --branch other than the project's production branch is published
          # as a preview; the PR head branch is never master, so this is always
          # a preview deployment.
          command: >-
            pages deploy site
            --project-name=rpg-maker-clone
            --branch=${{ github.head_ref }}
            --commit-hash=${{ github.event.pull_request.head.sha }}
            --commit-dirty=true
      - name: Comment preview URL on the PR
        if: ${{ steps.cf.outputs.deployment-url != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: cloudflare-preview
          message: |
            ### ⚡ Cloudflare Pages preview

            | | |
            | --- | --- |
            | **Preview URL** | ${{ steps.cf.outputs.deployment-url }} |
            | **Commit** | ${{ github.event.pull_request.head.sha }} |

            Open the link and load an RPG Maker project with the on-page loader.
