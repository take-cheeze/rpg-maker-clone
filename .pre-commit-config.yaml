# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-added-large-files
- repo: local
  hooks:
    # clang-format comes from PyPI (a wheel wrapping the upstream binary) so
    # the hook pins its own version instead of formatting with whatever
    # `clang-format` happens to be on PATH. That is what lets the flake drop
    # nixpkgs' `clang-tools`, and it ends the drift between CI's clang-format
    # and a distro one (18 flags three lines in mruby-rgss/src/lib.cxx that 20+
    # accepts). pre-commit builds the venv with its own interpreter, so nothing
    # needs python on PATH.
    - id: clang-format
      name: clang-format
      entry: clang-format -i
      language: python
      additional_dependencies: ["clang-format==22.1.8"]
      files: ".*\\.(cxx|cc|h|hxx)$"
    - id: cmake-format
      name: cmake-format
      entry: cmake-format -i
      language: system
      files: ".*\\.cmake|CMakeLists.txt"
    # The label taxonomy is spread over three files that have to agree
    # (definitions, path rules, issue forms) and only fails in production, on
    # a real issue or pull request. Check it here instead.
    - id: label-config
      name: label config
      entry: ruby scripts/label_config_check.rb
      language: system
      pass_filenames: false
      files: "^(\\.github/(labels|labeler)\\.yml|\\.github/ISSUE_TEMPLATE/.*|scripts/(issue_form_labels|label_config_check)\\.rb)$"
    # - id: ls
    #   name: show files
    #   language: system
    #   entry: "ls"
    #   pass_filename: true
- repo: https://github.com/NixOS/nixfmt
  rev: v1.4.0
  hooks:
    - id: nixfmt
exclude: "3rd/.*"
