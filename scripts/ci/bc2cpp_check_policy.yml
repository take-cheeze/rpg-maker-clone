# Execution remains in build.yml and coverage/report.rb; this file records prerequisites.
version: 1
runners:
  coverage: []
  ruby-checks: []
  bc2cpp-build:
  - mrbc
  - native_sources
  - core_library
  - full_library
  - cxx
  - closed_build
  - clang
deferred:
  scripts/bc2cpp/class_pools_check.rb:
    tier: runtime
    capabilities:
    - mrbc
    - full_library
    - cxx
    reason: Requires generated-world variants and compiled-vs-interpreted fixture binaries.
  scripts/bc2cpp/class_pools_mutation_check.rb:
    tier: mutation
    capabilities:
    - mrbc
    - full_library
    - cxx
    reason: Expensive mutation audit over compiler copies; not enabled in the PR gate.
  scripts/bc2cpp/comment_only_check.rb:
    tier: review
    capabilities:
    - git_base
    reason: Argument-driven review utility; requires a comment-only diff, not a general unit test.
  scripts/bc2cpp/const_bitor_io_check.rb:
    tier: runtime
    capabilities:
    - mrbc
    reason: Standalone type-check fixtures for IO bitwise constants; not enabled in the PR gate.
  scripts/bc2cpp/def_deletion_safety_check.rb:
    tier: review
    capabilities: []
    reason: Argument-driven deletion audit; requires the method names proposed for deletion.
  scripts/bc2cpp/impossible_as_error_check.rb:
    tier: runtime
    capabilities:
    - mrbc
    - core_library
    - cxx
    reason: Generated-code and core-library runtime audit; separate from scripts/impossible_as_error_check.rb.
  scripts/bc2cpp/module_super_range_check.rb:
    tier: runtime
    capabilities:
    - mrbc
    - native_sources
    reason: Full-engine Range code-generation audit; no fixture library is linked.
  scripts/bc2cpp/optional_block_frame_check.rb:
    tier: runtime
    capabilities:
    - mrbc
    - full_library
    - cxx
    reason: Requires a full-core library and compiled-vs-interpreted fixture binaries.
