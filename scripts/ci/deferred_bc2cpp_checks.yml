# Existing checks outside ordinary CI; new checks must be registered or explained here.
scripts/bc2cpp/class_pools_check.rb: Requires generated-world variants and compiled-vs-interpreted fixture binaries.
scripts/bc2cpp/class_pools_mutation_check.rb: Expensive mutation audit over compiler copies; not enabled in the
  PR gate.
scripts/bc2cpp/comment_only_check.rb: Argument-driven review utility; requires a comment-only diff, not a general
  unit test.
scripts/bc2cpp/const_bitor_io_check.rb: Standalone type-check fixtures for IO bitwise constants; not enabled in
  the PR gate.
scripts/bc2cpp/def_deletion_safety_check.rb: Argument-driven deletion audit; requires the method names proposed
  for deletion.
scripts/bc2cpp/hot_only_check.rb: Generated-world and runtime hot-only audit; not enabled in the PR gate.
scripts/bc2cpp/impossible_as_error_check.rb: Generated-code and core-library runtime audit; separate from scripts/impossible_as_error_check.rb.
scripts/bc2cpp/module_super_range_check.rb: Compiles the real Range implementation; needs an independently prepared
  fixture library.
scripts/bc2cpp/native_arity_check.rb: Existing native arity audit; not yet registered on this branch.
scripts/bc2cpp/native_ast_returns_check.rb: Existing clang AST audit; not yet registered on this branch.
scripts/bc2cpp/native_core_result_sigs_check.rb: Existing native signature freshness audit; not yet registered on
  this branch.
scripts/bc2cpp/native_format_types_check.rb: Requires mruby native sources; cannot run in the submodule-free host
  coverage job.
scripts/bc2cpp/native_owner_map_check.rb: Requires MRBC, native sources and a git-archive comparison base; keep
  worlds and base comparison isolated.
scripts/bc2cpp/native_return_kinds_check.rb: Existing native return-kind audit; not yet registered on this branch.
scripts/bc2cpp/nomethod_reviewed_check.rb: Full-engine hot/all-method generation audit; retains a separate manual
  run until budgeted explicitly.
scripts/bc2cpp/optional_block_frame_check.rb: Requires a full-core library and compiled-vs-interpreted fixture binaries.
scripts/bc2cpp/proven_miss_check.rb: Full-engine reviewed-fallback generation audit; retains a separate manual run
  until budgeted explicitly.
