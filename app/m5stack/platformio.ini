; PlatformIO project for the M5Stack Core (ESP32 + ILI9341) port.
;
; A standalone project, separate from the repo root's platformio.ini (Wio
; Terminal/Maix Amigo): this port needs `framework = arduino, espidf` --
; "Arduino as an ESP-IDF component", not plain `framework = arduino` --
; because framework-arduinoespressif32's precompiled static libs (what plain
; mode links) fail a real assert in their own SPI flash re-probe under QEMU
; (do_core_init, esp_flash_init_default_chip() != ESP_OK), while the exact
; same ESP-IDF version (4.4.7) built from source as a component does not --
; isolated by a controlled before/after boot under the identical QEMU
; invocation (docs/adr/0157). PlatformIO's ESP-IDF/CMake build mode takes
; over the *project root's* own CMakeLists.txt and cannot honor
; build_src_filter, both fatal to sharing the repo root's own CMakeLists.txt
; (the desktop SDL2 build) and its project-wide src_dir the way Wio/Maix do
; -- hence this directory being its own project rather than another
; environment in the root file. See README.md for the port itself.
;
; app_main() (src/main.cxx) is written out by hand for the same reason:
; plain `framework = arduino` auto-generates it, this mode does not.
;
; sdkconfig.defaults (this directory) sets the two options this mode needs
; that plain Arduino mode sets for itself: CONFIG_FREERTOS_HZ=1000 (a hard
; CMake-time check in framework-arduinoespressif32's own CMakeLists.txt) and
; CONFIG_ESPTOOLPY_FLASHSIZE=4MB (to match this board's real flash size --
; the espidf framework's own default is 2 MB).

[env:m5stack]
platform = espressif32
board = m5stack-core-esp32
framework = arduino, espidf
monitor_speed = 115200

; Same LVGL SIMD-assembly exclusion every env linking LVGL on a non-Arm
; target needs (see the script's own header comment): LV_USE_DRAW_SW_ASM is
; NONE in lv_conf.h, so the Helium/NEON .S kernels are unused and would not
; assemble for Xtensa anyway. Reused from the Wio Terminal port rather than
; duplicated -- it only removes files under 3rd/lvgl, nothing board-specific.
extra_scripts = pre:../wio/exclude_lvgl_asm.py

; TFT_eSPI is configured entirely through these build_flags
; (-DUSER_SETUP_LOADED=1 skips its own bundled User_Setup.h) rather than a
; checked-in setup file, using the M5Stack Core Basic/Gray/Go's well-known
; pinout: a 320x240 ILI9341 on VSPI (SCLK 18/MOSI 23/MISO 19), CS 14, DC 27,
; RST 33, backlight (active high) on GPIO32.
build_flags =
    -DM5STACK_CORE
    -DLV_CONF_INCLUDE_SIMPLE
    -I .
    -I ../../include
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=14
    -DTFT_DC=27
    -DTFT_RST=33
    -DTFT_BL=32
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; The repo's vendored LVGL (same source as the desktop build, see the root
; platformio.ini's own comment on why) plus Bodmer's TFT_eSPI, configured for
; this board entirely through build_flags above rather than one of its
; bundled User_Setups.
lib_deps =
    symlink://../../3rd/lvgl
    TFT_eSPI

; `pio run -e m5stack_qemu -t upload` builds the firmware above and boots it
; under Espressif's own QEMU fork (docs/adr/0157) instead of writing it to a
; connected board -- the same "flash it and see it run" gesture, with no
; hardware. QEMU is deliberately not a repo dependency, same as Renode for
; the Wio/Maix ports: scripts/m5stack_qemu_boot.bash (repo root) downloads
; Espressif's prebuilt qemu-xtensa release the first time it runs (see that
; script and README.md for details) and merges the ELF's sibling
; bootloader.bin/partitions.bin into one flash image esptool.py already
; leaves in the build directory.
[env:m5stack_qemu]
extends = env:m5stack
upload_protocol = custom
upload_command = "../../scripts/m5stack_qemu_boot.bash" "$BUILD_DIR"
